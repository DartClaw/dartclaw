[mcp_servers.chrome-devtools]
args = [
    "chrome-devtools-mcp@1.10.1",
    "--headless",
    "--isolated",
    "--chromeArg=--no-sandbox",
    "--chromeArg=--disable-setuid-sandbox",
    "--chromeArg=--disable-dev-shm-usage",
]
command = "npx"

[mcp_servers.dart]
args = ["mcp-server"]
command = "dart"

[features]
hooks = true

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "bash -lc 'cd \"$(git rev-parse --show-toplevel)\" && bash dev/tools/format_changed.sh >/dev/null 2>&1; printf \"{}\"'"
timeout = 120
statusMessage = "Formatting changed Dart files..."
