name: Checks
# Action-update process: to bump a pinned action, re-resolve the tag to its current SHA with
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# then update both the SHA and the trailing # vX comment on the uses: line.

on:
  push:
    # The branch filter also excludes tag pushes, so release tagging does not re-run Checks.
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Check
    # Same-repo PR branches already run via push; keep pull_request for fork PRs only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Installs mise and the Dart SDK pinned in mise.toml, so CI and local runs share one version.
      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      # Both locked dependency sets, then the embedded asset libraries lib/ imports.
      - name: Setup
        run: mise run setup

      # Format check, analyzer and architecture check. Tests stay in the local gates.
      - name: Lint
        run: mise run lint

  powershell:
    name: PowerShell scripts
    # Parsing is a hard gate; the shared script pins PSScriptAnalyzer and bounds
    # findings to Error severity so style drift cannot redden a release lane.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check PowerShell scripts
        shell: pwsh
        run: ./dev/tools/check_powershell.ps1 -InstallAnalyzer
