name: Checks
# Action-update process: to bump a pinned action, re-resolve the tag to its current SHA with
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# then update both the SHA and the trailing # vX comment on the uses: line.

on:
  push:
    # The branch filter also excludes tag pushes, so release tagging does not re-run Checks.
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Check
    # Same-repo PR branches already run via push; keep pull_request for fork PRs only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: 3.13.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          dart pub get --enforce-lockfile
          dart pub get --directory dev/tools/mascot_favicon --enforce-lockfile

      # Generated asset libraries are not committed; lib/ imports them, so this
      # must run before format, analyze, and test.
      - name: Generate embedded assets
        run: dart run dev/tools/embed_assets.dart

      - name: Format check
        run: dart format --line-length=120 --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: bash dev/tools/test_workspace.sh

      - name: Architecture check
        run: dart run dev/tools/arch_check.dart

      - name: Fitness functions
        run: bash dev/tools/fitness/run_all.sh

  container:
    name: Container boundary
    # Deliberately without the `check` job's fork-PR condition: this needs no
    # secret and issues no model turn, so it must run in both contexts. Its own
    # job so a container-runtime problem fails by name rather than inside the
    # test suite.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: 3.13.0

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      # Generated asset libraries are not committed and lib/ imports them, so
      # this must run before anything that loads the runtime from source.
      - name: Generate embedded assets
        run: dart run dev/tools/embed_assets.dart

      # The in-container bridge is a build artifact too; without it the posture
      # downgrades to advisory mode and the profile fails for a reason that is
      # not the boundary.
      - name: Build container bridge
        run: bash dev/tools/build_bridge.sh

      # Boots an undeclared posture and asserts it resolved to container
      # isolation. An absent runtime fails the job rather than skipping: the
      # server's advisory downgrade exits zero and would otherwise read as a pass.
      # Root, not the runner user: native Linux bind mounts pass ownership
      # through verbatim, so the per-authority state dir is chowned to the
      # image uid, and the runner user (uid 1001) has no CAP_CHOWN — the chown
      # fails silently and the container's user cannot enter the mount.
      - name: Container posture
        run: sudo -E env "PATH=$PATH" bash dev/testing/profiles/container/run.sh --ci
