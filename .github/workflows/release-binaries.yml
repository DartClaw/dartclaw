name: Release Binaries
# Action-update process: to bump a pinned action, re-resolve the tag to its current SHA with
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# then update both the SHA and the trailing # vX comment on the uses: line.

on:
  push:
    tags:
      - 'v*'
  # Dry run: the same build, validation, Windows smoke and installer test, with
  # every publishing job held back. It exists because release_check.sh runs on a
  # developer host that never exercises this matrix, so the first execution of a
  # changed build script was a red tag build three times over.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            target: linux-x64
            archive_ext: tar.gz
          - runs_on: ubuntu-24.04-arm
            target: linux-arm64
            archive_ext: tar.gz
          - runs_on: macos-15
            target: macos-arm64
            archive_ext: tar.gz
          - runs_on: macos-15-intel
            target: macos-x64
            archive_ext: tar.gz
          - runs_on: windows-latest
            target: windows-x64
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: 3.13.0

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      # Windows builds run the generator directly; every other target gets both
      # steps from build.sh. The bridge must exist before the generator runs.
      - name: Cross-compile container bridge
        if: runner.os == 'Windows'
        shell: bash
        run: bash dev/tools/build_bridge.sh --embed

      - name: Generate embedded assets
        if: runner.os == 'Windows'
        run: dart run dev/tools/embed_assets.dart

      - name: Read DartClaw version
        if: runner.os != 'Windows'
        run: |
          VERSION=$(sed -n "s/^const dartclawVersion = '\([^']*\)';/\1/p" packages/dartclaw_runtime/lib/src/version.dart)
          echo "DARTCLAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Read DartClaw version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $line = Select-String -Path packages/dartclaw_runtime/lib/src/version.dart -Pattern "dartclawVersion = '([^']+)'"
          "DARTCLAW_VERSION=$($line.Matches[0].Groups[1].Value)" >> $env:GITHUB_ENV

      # Workspace lockstep is checked on every run; the tag-name comparison only
      # has a tag to compare against on a tag push.
      - name: Verify release version lockstep
        if: runner.os != 'Windows'
        run: |
          bash dev/tools/check_versions.sh "$DARTCLAW_VERSION"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Dry run on $GITHUB_REF_NAME — skipping the tag-name comparison."
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$DARTCLAW_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match dartclawVersion $DARTCLAW_VERSION" >&2
            exit 1
          fi

      - name: Verify release version lockstep (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bash dev/tools/check_versions.sh "$env:DARTCLAW_VERSION"
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            Write-Host "Dry run on $env:GITHUB_REF_NAME — skipping the tag-name comparison."
            exit 0
          }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $env:DARTCLAW_VERSION) {
            throw "Tag $env:GITHUB_REF_NAME does not match dartclawVersion $env:DARTCLAW_VERSION"
          }

      - name: Build standalone binary
        if: runner.os != 'Windows'
        run: bash dev/tools/build.sh
        env:
          DARTCLAW_RELEASE_TARGET: ${{ matrix.target }}

      - name: Test Windows artifact validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/tools/build_windows_test.ps1

      - name: Build Windows standalone binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev/tools/build_windows.ps1 -ReleaseTarget windows-x64

      - name: Test native Windows process lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: dart test --reporter=failures-only packages/dartclaw_core/test/harness/process_lifecycle_test.dart

      - name: Smoke-test Windows release artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dev/testing/profiles/windows-runtime/run.ps1 `
            -ArtifactPath "build/dartclaw-v$env:DARTCLAW_VERSION-windows-x64.zip" `
            -SkipProviders `
            -EvidencePath build/windows-runtime-smoke.md

      - name: Upload staged release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            build/dartclaw-v*-${{ matrix.target }}.${{ matrix.archive_ext }}
            build/dartclaw-v*-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
            build/dartclaw-workflow-v*-${{ matrix.target }}.${{ matrix.archive_ext }}
            build/dartclaw-workflow-v*-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  windows-installer:
    name: Test Windows installer
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download staged Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-windows-x64
          path: installer-assets

      - name: Setup Python for installer download acceptance
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Test installer
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            (Select-String -Path packages/dartclaw_runtime/lib/src/version.dart `
              -Pattern "dartclawVersion = '([^']+)'").Matches[0].Groups[1].Value
          }
          ./dev/tools/install_windows_test.ps1 `
            -ArtifactPath "installer-assets/dartclaw-v$version-windows-x64.zip" `
            -Version $version `
            -TestDownloadPath

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [build, windows-installer]
    # A dry run stops here: everything above validates the artifact, everything
    # from here on distributes it.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download staged release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify staged artifacts and build aggregate checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          archives=(
            "dartclaw-v${VERSION}-linux-x64.tar.gz"
            "dartclaw-v${VERSION}-linux-arm64.tar.gz"
            "dartclaw-v${VERSION}-macos-arm64.tar.gz"
            "dartclaw-v${VERSION}-macos-x64.tar.gz"
            "dartclaw-v${VERSION}-windows-x64.zip"
            "dartclaw-workflow-v${VERSION}-linux-x64.tar.gz"
            "dartclaw-workflow-v${VERSION}-linux-arm64.tar.gz"
            "dartclaw-workflow-v${VERSION}-macos-arm64.tar.gz"
            "dartclaw-workflow-v${VERSION}-macos-x64.tar.gz"
            "dartclaw-workflow-v${VERSION}-windows-x64.zip"
          )
          for archive in "${archives[@]}"; do
            test -f "release-assets/$archive"
            test -f "release-assets/$archive.sha256"
            (cd release-assets && shasum -a 256 -c "$archive.sha256")
          done
          LC_ALL=C sort release-assets/*.sha256 > release-assets/SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release-assets/*

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: publish
    environment: distribution-publication
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: 3.13.0

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Read DartClaw version
        run: |
          VERSION=$(sed -n "s/^const dartclawVersion = '\([^']*\)';/\1/p" packages/dartclaw_runtime/lib/src/version.dart)
          echo "DARTCLAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download platform checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p tap-checksums
          gh release download "$TAG_NAME" --pattern 'dartclaw-v*.tar.gz.sha256' --dir tap-checksums
          gh release download "$TAG_NAME" --pattern 'dartclaw-workflow-v*.tar.gz.sha256' --dir tap-checksums

      - name: Render Homebrew formula
        run: |
          dart run dev/tools/render_homebrew_formula.dart \
            --formula package/homebrew/dartclaw.rb \
            --checksums-dir tap-checksums \
            --version "$DARTCLAW_VERSION" \
            --output rendered-dartclaw.rb
          dart run dev/tools/render_homebrew_formula.dart \
            --formula package/homebrew/dartclaw-workflow.rb \
            --artifact dartclaw-workflow \
            --checksums-dir tap-checksums \
            --version "$DARTCLAW_VERSION" \
            --output rendered-dartclaw-workflow.rb

      - name: Publish formula to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured; skipping tap update." >&2
            echo "Re-render both templates in package/homebrew/ and push them to the tap manually." >&2
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/DartClaw/homebrew-dartclaw.git" tap-repo
          mkdir -p tap-repo/Formula
          cp rendered-dartclaw.rb tap-repo/Formula/dartclaw.rb
          cp rendered-dartclaw-workflow.rb tap-repo/Formula/dartclaw-workflow.rb
          cd tap-repo
          git add Formula/dartclaw.rb Formula/dartclaw-workflow.rb
          if git diff --cached --quiet; then
            echo "Formulas already current for ${DARTCLAW_VERSION}; nothing to push."
          else
            git commit -m "dartclaw ${DARTCLAW_VERSION}"
            git push
          fi

  scoop:
    name: Update Scoop bucket
    runs-on: ubuntu-latest
    needs: publish
    environment: distribution-publication
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: 3.13.0

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Read DartClaw version
        run: |
          VERSION=$(sed -n "s/^const dartclawVersion = '\([^']*\)';/\1/p" packages/dartclaw_runtime/lib/src/version.dart)
          echo "DARTCLAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download Windows checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p scoop-checksums
          gh release download "$TAG_NAME" --pattern 'dartclaw-v*-windows-x64.zip.sha256' --dir scoop-checksums
          gh release download "$TAG_NAME" --pattern 'dartclaw-workflow-v*-windows-x64.zip.sha256' --dir scoop-checksums

      - name: Render Scoop manifest
        run: |
          dart run dev/tools/render_scoop_manifest.dart \
            --manifest package/scoop/dartclaw.json \
            --checksums-dir scoop-checksums \
            --version "$DARTCLAW_VERSION" \
            --output rendered-dartclaw.json
          dart run dev/tools/render_scoop_manifest.dart \
            --manifest package/scoop/dartclaw-workflow.json \
            --artifact dartclaw-workflow \
            --checksums-dir scoop-checksums \
            --version "$DARTCLAW_VERSION" \
            --output rendered-dartclaw-workflow.json

      - name: Publish manifest to Scoop bucket
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured; skipping bucket update." >&2
            echo "Re-render locally and push both package/scoop/ manifests to the bucket manually." >&2
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/DartClaw/scoop-dartclaw.git" scoop-repo
          mkdir -p scoop-repo/bucket
          cp rendered-dartclaw.json scoop-repo/bucket/dartclaw.json
          cp rendered-dartclaw-workflow.json scoop-repo/bucket/dartclaw-workflow.json
          cd scoop-repo
          git add bucket/dartclaw.json bucket/dartclaw-workflow.json
          if git diff --cached --quiet; then
            echo "Manifests already current for ${DARTCLAW_VERSION}; nothing to push."
          else
            git commit -m "dartclaw ${DARTCLAW_VERSION}"
            git push
          fi
