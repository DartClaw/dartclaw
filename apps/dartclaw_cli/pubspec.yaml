name: dartclaw_cli
description: Reference DartClaw CLI application for serve, service, status, and maintenance workflows.
publish_to: none
version: 0.25.1
repository: https://github.com/DartClaw/dartclaw/tree/main/apps/dartclaw_cli
homepage: https://github.com/DartClaw/dartclaw
issue_tracker: https://github.com/DartClaw/dartclaw/issues
topics:
  - ai
  - cli
  - agents

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dartclaw_acp:
    path: ../../packages/dartclaw_acp
  dartclaw_client:
    path: ../../packages/dartclaw_client
  dartclaw_kernel:
    path: ../../packages/dartclaw_kernel
  dartclaw_core:
    path: ../../packages/dartclaw_core
  dartclaw_workflow:
    path: ../../packages/dartclaw_workflow
  dartclaw_runtime:
    path: ../../packages/dartclaw_runtime
  dartclaw_google_chat:
    path: ../../packages/dartclaw_google_chat
  args: ^2.7.0
  logging: ^1.3.0
  mason_logger: ^0.3.5
  meta: ^1.18.0
  path: ^1.9.1
  shelf: ^1.4.2
  # Not imported here: `dart build cli` classifies the sqlite3 native build hook
  # by this pubspec, and without the declaration the release binary ships with no
  # sqlite native-asset mapping (see dev/tools/build.sh).
  sqlite3: ^3.1.6
  yaml: ^3.1.3
  yaml_edit: ^2.2.2

dev_dependencies:
  dartclaw_testing:
    path: ../../packages/dartclaw_testing
  fake_async: ^1.3.3
  test: ^1.31.0
  lints: ^6.1.0
