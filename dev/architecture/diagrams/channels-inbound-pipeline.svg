<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 872" width="1000" height="872" role="img" aria-labelledby="title desc">
  <title id="title">Inbound pipeline</title>
  <desc id="desc">Platform events pass an access gate and dedup, then ChannelManager derives the session key and checks pause, ChannelTaskBridge consumes reserved commands, rate-limited senders and bound threads, and everything else is queued and dispatched as a turn.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
    .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; }
    .num { font-size: 11px; font-weight: 700; fill: var(--accent); }
    .badge { fill: var(--accent); }
    .badge-text { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
    a:hover text { text-decoration: underline; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="872"/>
  <text class="title" x="24" y="34">Inbound pipeline</text>
  <text class="lede" x="24" y="56">From a platform event to an agent turn: gate, dedup, pause check, bridge, queue. Doc: channel-messaging-architecture.md section 3.</text>
  <g class="node k-chan">
    <title>One adapter per platform parses its payload, drops bot and own messages and normalizes to ChannelMessage. WhatsApp: GOWA webhook (WhatsAppChannel.handleWebhook). Signal: signal-cli SSE (SignalChannel). Google Chat: signed webhook and Pub/Sub pull. Slack: Socket Mode envelope or signed Events API POST.</title>
    <path class="edge" d="M500,168 L500,204"/>
    <a href="../channel-messaging-architecture.md#3-inbound-pipeline">
      <rect class="box" x="60" y="80" width="880" height="88" rx="6"/>
      <text class="mono" x="76" y="101">Channel adapters</text>
      <text class="sub" x="230" y="101">parse, drop bot and own messages, normalize to ChannelMessage</text>
      <rect class="chip" x="74" y="116" width="162" height="34" rx="4"/>
      <text class="chip-text" x="84" y="137">WhatsApp webhook</text>
      <rect class="chip" x="246" y="116" width="162" height="34" rx="4"/>
      <text class="chip-text" x="256" y="137">Signal SSE</text>
      <rect class="chip" x="418" y="116" width="162" height="34" rx="4"/>
      <text class="chip-text" x="428" y="137">Chat webhook</text>
      <rect class="chip" x="590" y="116" width="162" height="34" rx="4"/>
      <text class="chip-text" x="600" y="137">Chat Pub/Sub pull</text>
      <rect class="chip" x="762" y="116" width="162" height="34" rx="4"/>
      <text class="chip-text" x="772" y="137">Slack Socket / Events</text>
    </a>
  </g>
  <g class="node k-sec">
    <title>inbound_gate.dart. Returns a ChannelInboundDecision (admitted, dmDenied, dmPairingRequired, groupAccessDisabled, groupNotAllowlisted, mentionRequired). Absent DmAccessController or MentionGating admits at that stage. Space Events Pub/Sub runs it with mention gating off; slash commands skip mention gating.</title>
    <path class="edge" d="M500,268 L500,304"/>
    <path class="edge" d="M700,236 L740,236"/>
    <a href="../channel-messaging-architecture.md#3-inbound-pipeline">
      <rect class="box" x="300" y="204" width="400" height="64" rx="6"/>
      <text class="mono" x="314" y="225">ChannelInboundGate.evaluate</text>
      <text class="sub" x="314" y="243">DM access, then group access, then mention gating</text>
      <text class="sub" x="314" y="258">pure decision; each adapter applies the effect</text>
    </a>
  </g>
  <g class="node k-host">
    <title>Refused messages stop here. Google Chat and Slack post the pairing code into the conversation; WhatsApp and Signal only record the pending pairing (3 pending, 8-character code, 1 hour).</title>
    <rect class="box" x="740" y="204" width="220" height="64" rx="6"/>
    <text class="mono" x="754" y="225">dropped</text>
    <text class="sub" x="754" y="243">logged; new DM sender may</text>
    <text class="sub" x="754" y="258">get a pairing code</text>
  </g>
  <g class="node k-host">
    <title>message_deduplicator.dart. Bounded insertion-ordered set, capacity 1000. One instance is shared by the Google Chat webhook and Pub/Sub paths (created only when space events are configured). Slack Events API requests use their own ledger, checked before dispatch.</title>
    <path class="edge" d="M500,360 L500,396"/>
    <path class="edge" d="M700,332 L740,332"/>
    <a href="../channel-messaging-architecture.md#3-inbound-pipeline">
      <rect class="box" x="300" y="304" width="400" height="56" rx="6"/>
      <text class="mono" x="314" y="325">MessageDeduplicator</text>
      <text class="sub" x="314" y="343">Chat webhook and Pub/Sub, keyed on message resource name</text>
    </a>
  </g>
  <g class="node k-host">
    <title>A message that arrives on both the webhook and Pub/Sub is processed once.</title>
    <rect class="box" x="740" y="304" width="220" height="56" rx="6"/>
    <text class="mono" x="754" y="325">duplicate skipped</text>
    <text class="sub" x="754" y="343">same message via two paths</text>
  </g>
  <g class="node k-host">
    <title>channel_manager.dart. The binding lookup runs before the pause check so a paused message keeps the route it would have had. Reserved commands skip the pause check. A message no channel owns is dropped with a warning.</title>
    <path class="edge" d="M500,496 L500,540"/>
    <path class="edge" d="M300,446 L260,446"/>
    <a href="../channel-messaging-architecture.md#24-channelmanager">
      <rect class="box" x="300" y="396" width="400" height="100" rx="6"/>
      <text class="mono" x="314" y="417">ChannelManager.handleInboundMessage</text>
      <text class="sub" x="314" y="435">1  find owning channel (ownsJid)</text>
      <text class="sub" x="314" y="450">2  deriveSessionKey</text>
      <text class="sub" x="314" y="465">3  lookupThreadBinding (task bindings)</text>
      <text class="sub" x="314" y="480">4  paused and not a reserved command?</text>
    </a>
  </g>
  <g class="node k-host">
    <title>governance/pause_controller.dart. /resume drains the queue and unpauses atomically; messages are grouped per conversation into one collapsed message and enqueued straight on MessageQueue with the session key captured before the pause. The bridge is skipped on replay, so the rate limit is not re-applied.</title>
    <path class="edge" d="M150,496 L150,704 L300,704"/>
    <a href="../channel-messaging-architecture.md#93-pause-and-resume">
      <rect class="box" x="40" y="396" width="220" height="100" rx="6"/>
      <text class="mono" x="54" y="417">PauseController</text>
      <text class="sub" x="54" y="435">in-memory, resets on restart</text>
      <text class="sub" x="54" y="450">paused: message queued (cap 200)</text>
      <text class="sub" x="54" y="465">sender is acknowledged</text>
    </a>
  </g>
  <text class="edge-label halo" x="160" y="600" text-anchor="start">on /resume: replay,</text>
  <text class="edge-label halo" x="160" y="614" text-anchor="start">bridge skipped</text>
  <g class="node k-host">
    <title>channel_task_bridge.dart. Stateless coordinator over injected callbacks. Rate limiting precedes bound-thread routing so a limited sender cannot bypass the limit by posting in a bound thread.</title>
    <path class="edge" d="M500,630 L500,676"/>
    <path class="edge" d="M700,566 L740,566"/>
    <path class="edge" d="M700,610 L880,610 L880,704 L700,704"/>
    <a href="../channel-messaging-architecture.md#4-channel-task-bridge">
      <rect class="box" x="300" y="540" width="400" height="90" rx="6"/>
      <text class="mono" x="314" y="561">ChannelTaskBridge.tryHandle</text>
      <text class="sub" x="314" y="579">0  reserved command (ReservedCommandHandler)</text>
      <text class="sub" x="314" y="594">1  per-sender rate limit (admins exempt)</text>
      <text class="sub" x="314" y="609">2  bound-thread routing</text>
    </a>
  </g>
  <g class="node k-host">
    <title>tryHandle returns true: the message never reaches the queue. A non-admin reserved command is refused and audited (guard ReservedCommand).</title>
    <rect class="box" x="740" y="540" width="220" height="62" rx="6"/>
    <text class="mono" x="754" y="561">consumed</text>
    <text class="sub" x="754" y="579">command run or refused,</text>
    <text class="sub" x="754" y="594">rate-limit reply sent</text>
  </g>
  <text class="edge-label halo" x="886" y="656" text-anchor="start">bound thread:</text>
  <text class="edge-label halo" x="886" y="670" text-anchor="start">enqueue on</text>
  <text class="edge-label halo" x="886" y="684" text-anchor="start">binding.sessionKey</text>
  <text class="edge-label" x="508" y="662" text-anchor="start">not consumed</text>
  <g class="node k-host">
    <title>message_queue.dart. Debounce 1 s per (sessionKey, senderJid), per-session FIFO, global cap from concurrency.max_parallel_turns, reply delivery retried (turns never are).</title>
    <path class="edge" d="M500,736 L500,776"/>
    <a href="../channel-messaging-architecture.md#71-messagequeue">
      <rect class="box" x="300" y="676" width="400" height="60" rx="6"/>
      <text class="mono" x="314" y="697">MessageQueue</text>
      <text class="sub" x="314" y="715">debounce, per-session FIFO, global turn cap</text>
    </a>
  </g>
  <g class="node k-host">
    <title>runtime/channel_wiring.dart. Gets or creates the channel session (pinned to the agent for a bound allowlist row), stages attachments, persists the user message, starts the turn with isHumanInput and waits for the outcome.</title>
    <a href="../channel-messaging-architecture.md#72-dispatchchannelturn">
      <rect class="box" x="300" y="776" width="400" height="60" rx="6"/>
      <text class="mono" x="314" y="797">dispatchChannelTurn</text>
      <text class="sub" x="314" y="815">persist message, start turn on TurnManager</text>
    </a>
  </g>
  <rect x="24" y="852" width="26" height="14" rx="3" fill="none" stroke="var(--chan)"/><text class="note" x="58" y="863">platform adapters</text>
  <rect x="170" y="852" width="26" height="14" rx="3" fill="none" stroke="var(--sec)"/><text class="note" x="204" y="863">access control</text>
  <rect x="300" y="852" width="26" height="14" rx="3" fill="none" stroke="var(--host)"/><text class="note" x="334" y="863">DartClaw code</text>
  <text class="note" x="480" y="863" text-anchor="start">Hover a box for details; links open the section.</text>
</svg>
