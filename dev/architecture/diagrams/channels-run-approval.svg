  <rect class="bg" width="1000" height="896"/>

  <text class="kick" x="24" y="32">SEQUENCE · RUN APPROVAL FROM CHAT</text>
  <text class="title" x="24" y="58">Run approval from chat</text>
  <text class="lede" x="24" y="80">A click resolves a run through one single-use nonce and the admin gate; the subscriber, never the adapter, edits the post.</text>

  <g class="k-neu"><rect class="band" x="24" y="176" width="952" height="258" rx="14"/><text class="kick" x="40" y="198">ISSUE AND POST</text></g>
  <g class="k-neu"><rect class="band" x="24" y="446" width="952" height="220" rx="14"/><text class="kick" x="40" y="468">CLICK AND RESOLVE</text></g>
  <g class="k-neu"><rect class="band" x="24" y="678" width="952" height="164" rx="14"/><text class="kick" x="40" y="700">EDIT THE POST · ANY RESOLUTION SOURCE</text></g>
  <path class="life" d="M144,164 V842"/>
  <path class="life" d="M400,164 V842"/>
  <path class="life" d="M665,164 V842"/>
  <path class="life" d="M893,164 V842"/>

  <g class="edges">
    <g class="e dash f-svc t-sub"><path d="M400,226 H146"/><text class="el" x="364" y="218" text-anchor="end">WorkflowApprovalRequestedEvent</text><g class="step k-host"><circle cx="380" cy="226" r="10"/><text x="380" y="230">1</text></g></g>
    <g class="e  f-sub t-svc"><path d="M144,272 H398"/><text class="el" x="180" y="264" text-anchor="start">issueApprovalInteraction (nonce)</text><g class="step k-host"><circle cx="164" cy="272" r="10"/><text x="164" y="276">2</text></g></g>
    <g class="e  f-sub t-ad"><path d="M144,318 H663"/><text class="el" x="180" y="310" text-anchor="start">post: Approve / Reject + nonce</text><g class="step k-host"><circle cx="164" cy="318" r="10"/><text x="164" y="322">3</text></g></g>
    <g class="e  f-ad t-chat"><path d="M665,364 H891"/><text class="el" x="701" y="356" text-anchor="start">approval post with buttons</text><g class="step k-host"><circle cx="685" cy="364" r="10"/><text x="685" y="368">4</text></g></g>
    <g class="e  f-sub t-svc"><path d="M144,410 H398"/><text class="el" x="180" y="402" text-anchor="start">bindApprovalPost: message id</text><g class="step k-host"><circle cx="164" cy="410" r="10"/><text x="164" y="414">5</text></g></g>
    <g class="e  f-chat t-ad"><path d="M893,500 H667"/><text class="el" x="857" y="492" text-anchor="end">click Approve or Reject</text><g class="step k-host"><circle cx="873" cy="500" r="10"/><text x="873" y="504">6</text></g></g>
    <g class="e  f-ad t-svc"><path d="M665,546 H402"/><text class="el" x="629" y="538" text-anchor="end">ChannelRunApprovalHandler(request)</text><g class="step k-host"><circle cx="645" cy="546" r="10"/><text x="645" y="550">7</text></g></g>
    <g class="e  f-svc t-ad"><path d="M400,592 H663"/><text class="el" x="436" y="584" text-anchor="start">Resolved | Refused | Failed</text><g class="step k-host"><circle cx="420" cy="592" r="10"/><text x="420" y="596">8</text></g></g>
    <g class="e dash bad f-ad t-chat"><path d="M665,638 H891"/><text class="el" x="701" y="630" text-anchor="start">refused or failed: answered to the clicker</text><g class="step k-sec"><circle cx="685" cy="638" r="10"/><text x="685" y="642">9</text></g></g>
    <g class="e dash f-svc t-sub"><path d="M400,732 H146"/><text class="el" x="364" y="724" text-anchor="end">WorkflowApprovalResolvedEvent</text><g class="step k-host"><circle cx="380" cy="732" r="10"/><text x="380" y="736">10</text></g></g>
    <g class="e  f-sub t-ad"><path d="M144,778 H663"/><text class="el" x="180" y="770" text-anchor="start">ThreadedNotifications.edit</text><g class="step k-host"><circle cx="164" cy="778" r="10"/><text x="164" y="782">11</text></g></g>
    <g class="e  f-ad t-chat"><path d="M665,824 H891"/><text class="el" x="701" y="816" text-anchor="start">post edited: Approved by &lt;name&gt;</text><g class="step k-host"><circle cx="685" cy="824" r="10"/><text x="685" y="828">12</text></g></g>
  </g>

  <a href="../channel-messaging-architecture.md#61-delivery"><g class="n tint k-host" id="sub">
    <title>task/workflow_run_notification_subscriber.dart. Renders the post, issues the interaction, binds the sent message, and edits the post once on resolution.</title>
    <rect class="box" x="24" y="100" width="240" height="64" rx="9"/>
    <text class="name" x="36" y="123">subscriber</text>
    <text class="sub" x="36" y="141">WorkflowRunNotificationSubscriber</text>
  </g></a>
  <a href="../channel-messaging-architecture.md#62-run-approvals-from-chat"><g class="n solid k-host" id="svc">
    <title>issueApprovalInteraction and bindApprovalPost hold the single-use nonce; WorkflowRunControl.handleApproval holds the policy. Admin check, nonce check and resolution. Every call writes one RunApprovalGate audit entry, except a request-changes check. State lives in dartclaw_workflow.</title>
    <rect class="box" x="290" y="100" width="220" height="64" rx="9"/>
    <text class="name mono-name" x="302" y="123">WorkflowService</text>
    <text class="sub" x="302" y="141">+ WorkflowRunControl</text>
  </g></a>
  <a href="../channel-messaging-architecture.md#62-run-approvals-from-chat"><g class="n tint k-chan" id="ad">
    <title>parses a click and calls ChannelRunApprovalHandler. Never checks admin status and never edits the post. WhatsApp and Signal render no buttons and use the workflow_resume and workflow_cancel tools.</title>
    <rect class="box" x="560" y="100" width="210" height="64" rx="9"/>
    <text class="name" x="572" y="123">channel adapter</text>
    <text class="sub" x="572" y="141">Slack or Google Chat</text>
  </g></a>
  <a href="../channel-messaging-architecture.md#62-run-approvals-from-chat"><g class="n line k-chan" id="chat">
    <title>the clicker, identified as the inbound path identifies senders: Slack user ID, Google Chat users/&lt;id&gt;. An empty governance.admin_senders makes every member an admin.</title>
    <rect class="box" x="810" y="100" width="166" height="64" rx="9"/>
    <text class="name" x="822" y="123">chat user</text>
    <text class="sub" x="822" y="141">admin sender</text>
  </g></a>
  <g transform="translate(24,862)">
    <g class="tint k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">DartClaw component</text>
    <g class="tint k-chan"><rect class="box" x="155.60000000000002" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="177.60000000000002" y="10">chat platform side</text>
    <g class="e "><path d="M311.20000000000005,6 H343.20000000000005"/></g><text class="lg" x="351.20000000000005" y="10">call or post</text>
    <g class="e dash"><path d="M447.6,6 H479.6"/></g><text class="lg" x="487.6" y="10">event</text>
    <g class="e dash bad"><path d="M540.6,6 H572.6"/></g><text class="lg" x="580.6" y="10">answer to the clicker</text>
  </g>
