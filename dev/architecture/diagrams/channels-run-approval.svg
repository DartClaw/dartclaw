<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" role="img" aria-labelledby="title desc">
  <title id="title">Run approval from chat</title>
  <desc id="desc">The subscriber issues a single-use nonce, posts the buttons and binds the post. A click goes through the adapter to WorkflowRunControl.handleApproval, which checks admin and nonce and resolves the run. The subscriber then edits the post once.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
    .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; }
    .num { font-size: 11px; font-weight: 700; fill: var(--accent); }
    .badge { fill: var(--accent); }
    .badge-text { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
    a:hover text { text-decoration: underline; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="730"/>
  <text class="title" x="24" y="34">Run approval from chat</text>
  <text class="lede" x="24" y="56">Approve and Reject on an approval post. Doc: channel-messaging-architecture.md section 6.2.</text>
  <path class="life" d="M130,138 L130,676"/>
  <g class="node k-host">
    <title>issueApprovalInteraction and bindApprovalPost on WorkflowService issue and bind the single-use nonce; WorkflowRunControl.handleApproval holds the policy (admin check, nonce, resolution). State lives in dartclaw_workflow (workflow-architecture.md, 8.2 Approval).</title>
    <rect class="box" x="30" y="76" width="200" height="58" rx="6"/>
    <text class="mono" x="40" y="97" style="font-size:12px">WorkflowService</text>
    <text class="sub" x="40" y="115">+ WorkflowRunControl</text>
  </g>
  <path class="life" d="M390,138 L390,676"/>
  <g class="node k-host">
    <title>task/workflow_run_notification_subscriber.dart. Renders posts, issues the interaction, binds the sent message, edits the post once on resolution.</title>
    <rect class="box" x="274" y="76" width="232" height="58" rx="6"/>
    <text class="mono" x="284" y="97" style="font-size:12px">subscriber</text>
    <text class="sub" x="284" y="115">WorkflowRunNotificationSubscriber</text>
  </g>
  <path class="life" d="M650,138 L650,676"/>
  <g class="node k-chan">
    <title>Parses a click and calls ChannelRunApprovalHandler. Never checks admin status and never edits the post. WhatsApp and Signal render no buttons.</title>
    <rect class="box" x="550" y="76" width="200" height="58" rx="6"/>
    <text class="mono" x="560" y="97" style="font-size:12px">channel adapter</text>
    <text class="sub" x="560" y="115">Slack or Google Chat</text>
  </g>
  <path class="life" d="M880,138 L880,676"/>
  <g class="node k-chan">
    <title>The clicker, identified in the form the inbound path uses (Slack user ID, Google Chat users/&lt;id&gt;).</title>
    <rect class="box" x="805" y="76" width="150" height="58" rx="6"/>
    <text class="mono" x="815" y="97" style="font-size:12px">chat</text>
    <text class="sub" x="815" y="115">admin sender</text>
  </g>
  <path class="edge" d="M130,168 L390,168"/>
  <circle class="badge" cx="146" cy="158" r="9"/>
  <text class="badge-text" x="146" y="162">1</text>
  <text class="edge-label halo" x="260" y="162" text-anchor="middle">WorkflowApprovalRequestedEvent</text>
  <path class="edge" d="M390,214 L130,214"/>
  <circle class="badge" cx="374" cy="204" r="9"/>
  <text class="badge-text" x="374" y="208">2</text>
  <text class="edge-label halo" x="260" y="208" text-anchor="middle">issue interaction (nonce)</text>
  <path class="edge" d="M390,260 L650,260"/>
  <circle class="badge" cx="406" cy="250" r="9"/>
  <text class="badge-text" x="406" y="254">3</text>
  <text class="edge-label halo" x="520" y="254" text-anchor="middle">post with Approve / Reject + nonce</text>
  <path class="edge" d="M650,306 L880,306"/>
  <circle class="badge" cx="666" cy="296" r="9"/>
  <text class="badge-text" x="666" y="300">4</text>
  <text class="edge-label halo" x="765" y="300" text-anchor="middle">approval post with buttons</text>
  <path class="edge" d="M390,352 L130,352"/>
  <circle class="badge" cx="374" cy="342" r="9"/>
  <text class="badge-text" x="374" y="346">5</text>
  <text class="edge-label halo" x="260" y="346" text-anchor="middle">bind sent message id to interaction</text>
  <path class="edge" d="M880,398 L650,398"/>
  <circle class="badge" cx="864" cy="388" r="9"/>
  <text class="badge-text" x="864" y="392">6</text>
  <text class="edge-label halo" x="765" y="392" text-anchor="middle">click Approve or Reject</text>
  <path class="edge" d="M650,444 L130,444"/>
  <circle class="badge" cx="634" cy="434" r="9"/>
  <text class="badge-text" x="634" y="438">7</text>
  <text class="edge-label halo" x="390" y="438" text-anchor="middle">ChannelRunApprovalHandler -&gt; WorkflowRunControl.handleApproval</text>
  <path class="edge" d="M130,490 L650,490"/>
  <circle class="badge" cx="146" cy="480" r="9"/>
  <text class="badge-text" x="146" y="484">8</text>
  <text class="edge-label halo" x="390" y="484" text-anchor="middle">Resolved | Refused(reason) | Failed</text>
  <path class="edge" d="M130,536 L390,536"/>
  <circle class="badge" cx="146" cy="526" r="9"/>
  <text class="badge-text" x="146" y="530">9</text>
  <text class="edge-label halo" x="260" y="530" text-anchor="middle">WorkflowApprovalResolvedEvent</text>
  <path class="edge" d="M390,582 L650,582"/>
  <circle class="badge" cx="406" cy="572" r="9"/>
  <text class="badge-text" x="406" y="576">10</text>
  <text class="edge-label halo" x="520" y="576" text-anchor="middle">ThreadedNotifications.edit, no actions</text>
  <path class="edge" d="M650,628 L880,628"/>
  <circle class="badge" cx="666" cy="618" r="9"/>
  <text class="badge-text" x="666" y="622">11</text>
  <text class="edge-label halo" x="765" y="622" text-anchor="middle">post edited: Approved by &lt;name&gt;</text>
  <text class="note" x="24" y="698" text-anchor="start">Step 8: a refusal or failure answers only the clicker (ephemeral reply or click response text); the post and the nonce stay.</text>
  <text class="note" x="24" y="714" text-anchor="start">A click before step 5 matches no post and is refused as invalid; the next click works.</text>
</svg>
