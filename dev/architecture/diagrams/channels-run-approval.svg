    svg:has(#sub:hover) .edges :is(.f-sub,.t-sub) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#svc:hover) .edges :is(.f-svc,.t-svc) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#ad:hover) .edges :is(.f-ad,.t-ad) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#chat:hover) .edges :is(.f-chat,.t-chat) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
  </style>
