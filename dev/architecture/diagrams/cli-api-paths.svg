  <rect class="panel" x="16" y="604" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="628">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="652">Hover a box for what it does; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="672">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">EXECUTION PATHS · CLI COMMAND TO RUNTIME</text>
  <text class="title" x="24" y="58">CLI paths: connected and standalone</text>
  <text class="lede" x="24" y="80">Connected is the default: the CLI is an HTTP client of a running server. Standalone runs the engine in-process, behind a /health probe.</text>

  <g class="k-host"><rect class="band" x="250" y="96" width="734" height="206" rx="14"/><text class="kick" x="266" y="118">CONNECTED · DEFAULT FOR SERVER-BACKED AND MIXED COMMANDS</text></g>
  <g class="k-sec"><rect class="band" x="250" y="318" width="734" height="226" rx="14"/><text class="kick" x="266" y="340">STANDALONE · --standalone, ALWAYS IN dartclaw-workflow</text></g>

