<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title desc">
  <title id="title">CLI paths: connected and standalone</title>
  <desc id="desc">The full dartclaw binary talks HTTP and SSE to a running dartclaw serve by default. With --standalone, and always in dartclaw-workflow, write verbs probe GET /health, then run the shared runtime headless against a file checkpoint under data_dir/standalone. Local-only commands touch the filesystem and use neither path.</desc>
