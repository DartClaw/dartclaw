    <g class="e main"><path d="M424.0,6 H456.0"/></g><text class="lg" x="464.0" y="10">main path</text>
    <g class="e "><path d="M541.8,6 H573.8"/></g><text class="lg" x="581.8" y="10">call or data</text>
