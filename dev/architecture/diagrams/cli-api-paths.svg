    <g class="e  f-full t-client"><path d="M224,164 H280"/><text class="el" x="252" y="156" text-anchor="middle">default</text></g>
    <g class="e join f-full t-guard"><path d="M224,190 H238 V393"/></g>
    <g class="e join f-lean t-guard"><path d="M224,470 H238 V393"/></g>
    <g class="e main f-full f-lean t-guard"><path d="M238,393 H280"/></g>
    <g class="e dash f-full t-local"><path d="M124,210 V234"/><text class="el" x="132" y="227" text-anchor="start">no server</text></g>
    <g class="e main f-client t-serve"><path d="M522,160 H588"/><text class="el" x="555" y="152" text-anchor="middle">HTTP + SSE</text></g>
