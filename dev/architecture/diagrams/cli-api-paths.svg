    <g class="e main f-guard t-headless"><path d="M522,400 H588"/><text class="el" x="555" y="392" text-anchor="middle">no server</text></g>
    <g class="e  f-headless t-store"><path d="M783,448 V468"/><text class="el" x="791" y="462" text-anchor="start">checkpoint</text></g>
  </g>

  <a href="../cli-api-architecture.md#2-cli-structure"><g class="n tint k-host" id="full">
    <rect class="box" x="24" y="130" width="200" height="80" rx="9"/>
    <text class="name mono-name" x="36" y="153">dartclaw</text>
    <text class="sub" x="36" y="171">full CLI</text>
    <text class="sub" x="36" y="187">--config --server --token</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">dartclaw</tspan> · buildDartclawRunner: the full command tree</text><text class="p2" x="36" y="672">Server-backed commands are connected only; workflow run, status, pause, resume, cancel, retry and show are mixed and take --standalone.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#2-cli-structure"><g class="n ghost k-neu" id="local">
    <rect class="box" x="24" y="236" width="200" height="82" rx="9"/>
    <text class="name" x="36" y="259">local-only commands</text>
    <text class="sub" x="36" y="277">serve, service, init,</text>
    <text class="sub" x="36" y="293">doctor, token, secrets,</text>
    <text class="sub" x="36" y="309">rebuild-index: no server</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">local-only commands</tspan> · serve, service, init, doctor, token, auth, secrets, google-auth, rebuild-index, workflow list and validate</text><text class="p2" x="36" y="672">They work with no server running: each touches the data directory or the installation, or reads definitions from disk.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#2-cli-structure"><g class="n tint k-host" id="lean">
    <rect class="box" x="24" y="430" width="200" height="80" rx="9"/>
    <text class="name mono-name" x="36" y="453">dartclaw-workflow</text>
    <text class="sub" x="36" y="471">lean, always standalone</text>
    <text class="sub" x="36" y="487">no --server, no --token</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">dartclaw-workflow</tspan> · buildDartclawWorkflowRunner: workflow verbs at the root, plus init and rebuild-index</text><text class="p2" x="36" y="672">It links neither the server nor the API client; a build test asserts they are absent from the lean artifact.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#4-api-client"><g class="n tint k-host" id="client">
    <rect class="box" x="282" y="124" width="240" height="80" rx="9"/>
    <text class="name mono-name" x="294" y="147">DartclawApiClient</text>
    <g class="badge"><rect x="451" y="135" width="61" height="16" rx="8"/><text x="482" y="147">dart:io</text></g>
    <text class="sub" x="294" y="165">Bearer auth, JSON helpers</text>
    <text class="sub" x="294" y="181">SSE: up to 3 reconnects</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">DartclawApiClient</tspan> · address: --server, else http://localhost:&lt;server.port&gt;; token: --token, gateway.token or the gateway_token file</text><text class="p2" x="36" y="672">No token is sent when gateway.auth_mode is none. ConnectedCommand resolves a client per call; the client itself resolves nothing.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-mode-default"><g class="n line k-sec" id="exit">
    <rect class="box" x="282" y="222" width="200" height="66" rx="9"/>
    <text class="name mono-name" x="294" y="245">connectedExitCode</text>
    <text class="sub" x="294" y="263">transport 3, auth 4</text>
    <text class="sub" x="294" y="279">4xx 5, 5xx 6, other 1</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">connectedExitCode</tspan> · API failures map to exit codes by failure class</text><text class="p2" x="36" y="672">Transport is 3 only when there is no HTTP status; 401 and 403 are 4, other 4xx 5, 5xx 6, anything else 1.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#5-server-route-families"><g class="n solid k-host" id="serve">
    <rect class="box" x="590" y="118" width="386" height="82" rx="9"/>
    <text class="name mono-name" x="602" y="141">dartclaw serve</text>
    <g class="badge"><rect x="842" y="129" width="124" height="16" rx="8"/><text x="904" y="141">dartclaw_runtime</text></g>
    <text class="sub" x="602" y="159">authMiddleware, /api/* routers, SSE</text>
    <text class="sub" x="602" y="175">task, workflow, session, project services</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">dartclaw serve</tspan> · shelf routers behind authMiddleware; /health, /login, /webhook/* and /static/* are public</text><text class="p2" x="36" y="672">The CLI has no privileged route: it calls the same routes as the web UI, so guards, tracing and web visibility apply.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-mode-default"><g class="n tint k-store" id="pg">
    <rect class="box" x="790" y="222" width="186" height="62" rx="9"/>
    <text class="name mono-name" x="802" y="245">PostgreSQL</text>
    <text class="sub" x="802" y="263">server-side state only</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">PostgreSQL</tspan> · the server owns persistent state; a connected CLI never writes it directly</text><text class="p2" x="36" y="672">Standalone runs use none of it: no connection and no schema gate.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#standalone-mode"><g class="n tint k-sec" id="guard">
    <rect class="box" x="282" y="352" width="240" height="82" rx="9"/>
    <text class="name mono-name" x="294" y="375">GET /health</text>
    <g class="badge"><rect x="465" y="363" width="47" height="16" rx="8"/><text x="488" y="375">PROBE</text></g>
    <text class="sub" x="294" y="393">writer guard on write verbs</text>
    <text class="sub" x="294" y="409">abort unless --force</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">GET /health</tspan> · server_reachability.dart: 200, 401 and 403 count as a running server; a 5 s timeout counts as none</text><text class="p2" x="36" y="672">Write verbs print the server origin and exit 1, so two writers never share project and workflow files; status only reads.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#standalone-mode"><g class="n solid k-host" id="headless">
    <rect class="box" x="590" y="352" width="386" height="96" rx="9"/>
    <text class="name mono-name" x="602" y="375">DartclawRuntime.stageHeadless</text>
    <text class="sub" x="602" y="393">then completeForExecution: engine, task and session</text>
    <text class="sub" x="602" y="409">services; no HTTP, web, MCP, channels, memory</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">DartclawRuntime.stageHeadless</tspan> · the serve composition root with headless: true; credential and provider-auth preflight run first</text><text class="p2" x="36" y="672">A lock file execution.owner.lock refuses a second standalone execution on one data directory; cancel and pause skip skill provisioning.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#standalone-mode"><g class="n tint k-store" id="store">
    <rect class="box" x="590" y="470" width="386" height="62" rx="9"/>
    <text class="name mono-name" x="602" y="493">&lt;data_dir&gt;/standalone/</text>
    <text class="sub" x="602" y="511">execution.json, sessions/, turn_state.json, kv.json</text>
    <g class="d"><text class="p1" x="36" y="652"><tspan class="b">&lt;data_dir&gt;/standalone/</tspan> · FileExecutionStore: one atomic checkpoint shared by the task and workflow repositories</text><text class="p2" x="36" y="672">Existing PostgreSQL run histories are not imported; status --standalone reads this checkpoint.</text></g>
  </g></a>
  <g transform="translate(24,578)">
    <g class="solid k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">DartClaw process</text>
    <g class="tint k-sec"><rect class="box" x="143.2" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="165.2" y="10">guard</text>
