  </g>

  <a href="../cli-api-architecture.md#connected-run"><g class="n solid k-host" id="cli">
    <rect class="box" x="90" y="100" width="200" height="52" rx="9"/>
    <text class="name mono-name" x="102" y="119">workflow run</text>
    <text class="sub" x="102" y="135">ApiWorkflowConnection</text>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">workflow run</tspan> · apps/dartclaw_cli, commands/workflow/api_workflow_connection.dart</text><text class="p2" x="36" y="838">Thin HTTP/SSE client: it has no engine and no local state, and renders what the server streams (ADR-030).</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#5-server-route-families"><g class="n solid k-host" id="srv">
    <rect class="box" x="710" y="100" width="200" height="52" rx="9"/>
    <text class="name mono-name" x="722" y="119">dartclaw serve</text>
    <text class="sub" x="722" y="135">workflow_routes.dart</text>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">dartclaw serve</tspan> · packages/dartclaw_runtime, api/workflow_routes.dart</text><text class="p2" x="36" y="838">The same routes the web UI uses; the CLI has no privileged path, so guards and observability apply to CLI runs.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-run"><g class="n tint k-host" id="m1">
    <rect class="box" x="300" y="168" width="400" height="52" rx="9"/>
    <g class="step"><circle cx="320" cy="194.0" r="10"/><text x="320" y="198.0">1</text></g>
    <text class="name mono-name" x="338" y="187">POST /api/workflows/run</text>
    <g class="badge"><rect x="650" y="175" width="40" height="16" rx="8"/><text x="670" y="187">POST</text></g>
    <text class="sub" x="338" y="203">definition, variables, surface cli, project, approvals</text>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">POST /api/workflows/run</tspan> · body: definition, variables, surface: cli, project, approvals, allowDirtyLocalPath, inline</text><text class="p2" x="36" y="838">The server shapes both launch routes alike: it injects PROJECT and validates required variables before it starts the run.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-run"><g class="n tint k-host" id="m2">
    <rect class="box" x="300" y="238" width="400" height="70" rx="9"/>
    <g class="step"><circle cx="320" cy="260" r="10"/><text x="320" y="264">2</text></g>
    <text class="name mono-name" x="338" y="261">201 created run</text>
    <text class="sub" x="338" y="279">run JSON including definitionJson</text>
    <g class="chip k-sec"><rect x="338" y="284" width="132" height="16" rx="8"/><text x="345" y="296">4xx: no run, exit 5</text></g>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">201 created run</tspan> · the run row; definitionJson lets the CLI count steps and name them for progress lines</text><text class="p2" x="36" y="838">A 400 INVALID_INPUT, 404 DEFINITION_NOT_FOUND or 409 WORKFLOW_PRECONDITION_FAILED creates no run; the CLI prints it and exits 5.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-run"><g class="n tint k-host" id="m3">
    <rect class="box" x="300" y="326" width="400" height="52" rx="9"/>
    <g class="step"><circle cx="320" cy="352.0" r="10"/><text x="320" y="356.0">3</text></g>
    <text class="name mono-name" x="338" y="345">GET /api/workflows/runs/&lt;id&gt;/events</text>
    <g class="badge"><rect x="657" y="333" width="33" height="16" rx="8"/><text x="674" y="345">SSE</text></g>
    <text class="sub" x="338" y="361">opens the per-run stream</text>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">GET /api/workflows/runs/&lt;id&gt;/events</tspan> · answered with a connected frame: current run status plus one status per step</text><text class="p2" x="36" y="838">The handler subscribes to the EventBus per run id; 404 if the run is gone, 503 if no event bus is configured.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-run"><g class="n tint k-host" id="m4">
    <rect class="box" x="300" y="396" width="400" height="52" rx="9"/>
    <g class="step"><circle cx="320" cy="422.0" r="10"/><text x="320" y="426.0">4</text></g>
    <text class="name mono-name" x="338" y="415">step frames, then status change</text>
    <text class="sub" x="338" y="431">--json echoes each frame</text>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">step frames, then status change</tspan> · step, parallel, loop and map completions, task status, token progress, approval requests</text><text class="p2" x="36" y="838">CliProgressPrinter renders them; the closing workflow_status_changed carries total tokens and the current step index.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-run"><g class="n line k-host" id="m5">
    <rect class="box" x="300" y="490" width="400" height="52" rx="9"/>
    <g class="step"><circle cx="320" cy="516.0" r="10"/><text x="320" y="520.0">5</text></g>
    <text class="name mono-name" x="338" y="509">GET /api/workflows/runs/&lt;id&gt;</text>
    <g class="badge"><rect x="657" y="497" width="33" height="16" rx="8"/><text x="674" y="509">GET</text></g>
    <text class="sub" x="338" y="525">terminal, paused or awaiting approval: stop; else retry</text>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">GET /api/workflows/runs/&lt;id&gt;</tspan> · the client reconnects up to 3 times, waiting 1, 2 and 4 s; each drop first re-fetches the run</text><text class="p2" x="36" y="838">completed, failed, cancelled, paused and awaitingApproval end the wait; pending and running reconnect and print a notice.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-run"><g class="n tint k-host" id="m6">
    <rect class="box" x="300" y="568" width="400" height="52" rx="9"/>
    <g class="step"><circle cx="320" cy="594.0" r="10"/><text x="320" y="598.0">6</text></g>
    <text class="name mono-name" x="338" y="587">terminal workflow_status_changed</text>
    <text class="sub" x="338" y="603">exit: completed 0, failed 1, other 2</text>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">terminal workflow_status_changed</tspan> · cancelled, paused and awaitingApproval exit 2; the standalone lane maps the same way</text><text class="p2" x="36" y="838">A transport or HTTP failure instead maps through connectedExitCode: 3 transport, 4 auth, 5 other 4xx, 6 for 5xx.</text></g>
  </g></a>
  <a href="../cli-api-architecture.md#connected-run"><g class="n line k-host" id="m7">
    <rect class="box" x="300" y="662" width="400" height="52" rx="9"/>
    <g class="step"><circle cx="320" cy="688.0" r="10"/><text x="320" y="692.0">7</text></g>
    <text class="name mono-name" x="338" y="681">Ctrl-C: POST .../runs/&lt;id&gt;/cancel</text>
    <g class="badge"><rect x="650" y="669" width="40" height="16" rx="8"/><text x="670" y="681">POST</text></g>
    <text class="sub" x="338" y="697">keeps waiting; a second Ctrl-C exits 1</text>
    <g class="d"><text class="p1" x="36" y="818"><tspan class="b">Ctrl-C: POST .../runs/&lt;id&gt;/cancel</tspan> · the first interrupt is a control action: it requests cancel and still waits for the terminal state</text><text class="p2" x="36" y="838">A second interrupt calls exit(1) at once, leaving the server run to finish its own cancel.</text></g>
  </g></a>
  <g transform="translate(24,744)">
    <g class="solid k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">participant</text>
    <g class="tint k-host"><rect class="box" x="112.2" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="134.2" y="10">message</text>
    <g class="line k-host"><rect class="box" x="199.60000000000002" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="221.60000000000002" y="10">conditional</text>
    <g class="e main"><path d="M311.8,6 H343.8"/></g><text class="lg" x="351.8" y="10">request or event</text>
    <g class="e main dash"><path d="M473.0,6 H505.0"/></g><text class="lg" x="513.0" y="10">response or stream</text>
    <g class="e dash"><path d="M646.6,6 H678.6"/></g><text class="lg" x="686.6" y="10">control, on demand</text>
  </g>
</svg>
