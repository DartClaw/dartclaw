  <text class="panel-kick" x="36" y="794">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="818">Hover a message for what it carries; its arrow lights up. Click it to open its section.</text><text class="p2" x="36" y="838">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">SEQUENCE · ApiWorkflowConnection.run</text>
  <text class="title" x="24" y="58">Connected workflow run</text>
  <text class="lede" x="24" y="80">workflow run &lt;name&gt; starts a run, follows its SSE stream and maps the final status to an exit code.</text>

  <g class="k-neu"><rect class="band inner" x="24" y="464" width="952" height="84" rx="10"/><text class="kick" x="40" y="486">IF THE STREAM DROPS</text></g>
  <g class="k-neu"><rect class="band inner" x="24" y="640" width="952" height="84" rx="10"/><text class="kick" x="40" y="662">AT ANY TIME</text></g>
  <line class="life" x1="190" y1="152" x2="190" y2="736"/>
  <line class="life" x1="810" y1="152" x2="810" y2="736"/>

  <g class="edges">
    <g class="e main f-cli f-m1 t-srv t-m1"><path d="M192,194 H808"/></g>
    <g class="e main dash f-srv f-m2 t-cli t-m2"><path d="M808,273 H192"/></g>
    <g class="e main f-cli f-m3 t-srv t-m3"><path d="M192,352 H808"/></g>
    <g class="e main dash f-srv f-m4 t-cli t-m4"><path d="M808,422 H192"/></g>
    <g class="e dash f-cli f-m5 t-srv t-m5"><path d="M192,516 H808"/></g>
    <g class="e main dash f-srv f-m6 t-cli t-m6"><path d="M808,594 H192"/></g>
