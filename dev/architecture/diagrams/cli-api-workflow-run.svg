<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 866" width="1000" height="866" role="img" aria-labelledby="title desc">
  <title id="title">Connected workflow run</title>
  <desc id="desc">The CLI posts to /api/workflows/run, opens the per-run SSE stream and renders frames until a terminal, paused or awaitingApproval status arrives, then exits 0, 1 or 2. If the stream drops it re-fetches the run; Ctrl-C posts a cancel and keeps waiting.</desc>
  <style>

