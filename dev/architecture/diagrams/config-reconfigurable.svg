<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="1000" height="716" role="img" aria-labelledby="title desc">
  <title id="title">Reconfigurable services</title>
  <desc id="desc">ConfigNotifier calls reconfigure on each registered Reconfigurable whose watchKeys match ConfigDelta.changedKeys: security.* reaches SecurityWiring, logging.* the redactor adapter, workspace.* the git-sync reconfigurer, sessions.* SessionResetService, server.* SessionLockManager and MessageQueueReconfigurer, context.* ContextMonitor and ResultTrimmer, alerts.* AlertRouter. A watch key naming a restart-tier or undeclared section is refused at registration.</desc>
  <style>

    svg { --bg:#f6f7f9; --card:#ffffff; --ink:#1e2030; --ink2:#4c4f69; --ink3:#6c6f85; --rule:#ccd0da; --edge:#8c8fa1; --hi:#1e66f5; --on:#ffffff; --panel:#1e1e2e; --panel-ink:#cdd6f4; --panel-sub:#a6adc8; --panel-kick:#fab387;
      --host:#40a02b; --host-d:#1f5c2a; --host-l:#2d7a1f; --ext:#e07c4f; --ext-d:#a8481c; --ext-l:#b5531f; --store:#179299; --store-d:#0f5f63; --store-l:#0e7377;
      --sec:#d20f39; --sec-d:#9b0c2c; --sec-l:#b80d33; --chan:#8839ef; --chan-d:#5d23a8; --chan-l:#7027d4; --neu:#7c7f93; --neu-d:#4c4f69; --neu-l:#5c5f77; }
