  <rect class="bg" width="1000" height="716"/>
  <!-- Details panel: painted first so node details (.d) draw on top -->
  <rect class="panel" x="16" y="620" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="644">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="668">Hover a service for what it applies; its watch key lights up. Click it to open its section.</text><text class="p2" x="36" y="688">reconfigure is synchronous and must not throw; a throw is logged and the other services still run.</text></g>

  <text class="kick" x="24" y="32">FAN-OUT · Reconfigurable.watchKeys</text>
  <text class="title" x="24" y="58">Reconfigurable services</text>
  <text class="lede" x="24" y="80">Nine services watch seven reloadable sections. A service runs only when its watch key matches a changed key of the delta.</text>



  <g class="edges">
    <g class="e join f-delta t-r1 t-r2 t-r3 t-r4 t-r5 t-r6 t-r7 t-r8 t-r9"><path d="M244,342 H300 M300,134 V550"/></g>
    <g class="e  f-delta t-r1"><path d="M300,134 H418"/><text class="el" x="359" y="126" text-anchor="middle">security.*</text></g>
    <g class="e  f-delta t-r2"><path d="M300,186 H418"/><text class="el" x="359" y="178" text-anchor="middle">logging.*</text></g>
    <g class="e  f-delta t-r3"><path d="M300,238 H418"/><text class="el" x="359" y="230" text-anchor="middle">workspace.*</text></g>
    <g class="e  f-delta t-r4"><path d="M300,290 H418"/><text class="el" x="359" y="282" text-anchor="middle">sessions.*</text></g>
    <g class="e  f-delta t-r5"><path d="M300,342 H418"/><text class="el" x="359" y="334" text-anchor="middle">server.*</text></g>
    <g class="e  f-delta t-r6"><path d="M300,394 H418"/><text class="el" x="359" y="386" text-anchor="middle">server.*</text></g>
    <g class="e  f-delta t-r7"><path d="M300,446 H418"/><text class="el" x="359" y="438" text-anchor="middle">context.*</text></g>
    <g class="e  f-delta t-r8"><path d="M300,498 H418"/><text class="el" x="359" y="490" text-anchor="middle">context.*</text></g>
    <g class="e  f-delta t-r9"><path d="M300,550 H418"/><text class="el" x="359" y="542" text-anchor="middle">alerts.*</text></g>
  </g>

  <a href="../configuration-architecture.md#reload-triggers"><g class="n solid k-host" id="delta">
    <rect class="box" x="24" y="304" width="220" height="76" rx="9"/>
    <text class="name mono-name" x="36" y="327">ConfigDelta</text>
    <text class="sub" x="36" y="345">one &lt;section&gt;.* in changedKeys</text>
    <text class="sub" x="36" y="361">per reloadable section</text>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">ConfigDelta</tspan> · ConfigNotifier builds it once per reload and filters it by each service's watchKeys</text><text class="p2" x="36" y="688">hasChanged matches by prefix in both directions: watch key context.reserve_tokens matches changed key context.*.</text></g>
  </g></a>
  <a href="../configuration-architecture.md#confignotifier"><g class="n ghost k-neu" id="restart">
    <rect class="box" x="24" y="440" width="220" height="76" rx="9"/>
    <text class="name" x="36" y="463">restart-tier section</text>
    <text class="sub" x="36" y="481">no service can watch it:</text>
    <text class="sub" x="36" y="497">register() throws ArgumentError</text>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">restart-tier section</tspan> · register() refuses a watch key whose section is restart-tier or undeclared</text><text class="p2" x="36" y="688">Tier keys are DartclawConfig field names, not YAML keys: a guards.* watcher would sit dead where security.* fires.</text></g>
  </g></a>
  <a href="../configuration-architecture.md#reconfigurable-services"><g class="n tint k-sec" id="r1">
    <rect class="box" x="420" y="112" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="131">SecurityWiring</text>
    <text class="sub" x="432" y="147">rebuilds the guard chain</text>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">SecurityWiring</tspan> · rebuilds the guard chain from the new declarations, swapping the list atomically (security_wiring.dart)</text><text class="p2" x="36" y="688">guards.content.* stays restart-tier although any security change rebuilds the chain; that over-reports in the safe direction.</text></g>
  </g></a>
  <a href="../configuration-architecture.md#reconfigurable-services"><g class="n tint k-sec" id="r2">
    <rect class="box" x="420" y="164" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="183">_MessageRedactorAdapter</text>
    <text class="sub" x="432" y="199">replaces redaction patterns</text>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">_MessageRedactorAdapter</tspan> · replaces the redaction patterns from logging.redact_patterns (security_wiring.dart)</text><text class="p2" x="36" y="688">logging.level, format and file stay restart-tier.</text></g>
  </g></a>
  <a href="../configuration-architecture.md#live-field-side-effects"><g class="n tint k-host" id="r3">
    <rect class="box" x="420" y="216" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="235">WorkspaceGitSyncReconfigurer</text>
    <text class="sub" x="432" y="251">push flag via RuntimeToggleApplier</text>
    <g class="chip k-neu"><rect x="760" y="223" width="206" height="16" rx="8"/><text x="767" y="235">clears an ephemeral push toggle</text></g>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">WorkspaceGitSyncReconfigurer</tspan> · applies the git-sync push flag through RuntimeToggleApplier (runtime_toggle_applier.dart)</text><text class="p2" x="36" y="688">A persisted workspace.* reload clears an ephemeral push toggle, deliberately, so RuntimeConfig reports the value in force.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionresetservice"><g class="n tint k-host" id="r4">
    <rect class="box" x="420" y="268" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="287">SessionResetService</text>
    <text class="sub" x="432" y="303">reset hour, idle timeout</text>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">SessionResetService</tspan> · re-reads the daily reset hour and the idle timeout (session_reset_service.dart)</text><text class="p2" x="36" y="688">sessions.dm_scope and group_scope are live fields handled by ScopeReconciler, not by this service.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionlockmanager"><g class="n tint k-host" id="r5">
    <rect class="box" x="420" y="320" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="339">SessionLockManager</text>
    <text class="sub" x="432" y="355">max parallel turns</text>
    <g class="chip k-neu"><rect x="822" y="327" width="144" height="16" rx="8"/><text x="829" y="339">a raise wakes waiters</text></g>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">SessionLockManager</tspan> · applies concurrency.max_parallel_turns (session_lock_manager.dart)</text><text class="p2" x="36" y="688">A raise wakes callers parked in whenCapacityAvailable(), which reserves nothing: a woken caller retries and may lose the race.</text></g>
  </g></a>
  <a href="../configuration-architecture.md#reconfigurable-services"><g class="n tint k-ext" id="r6">
    <rect class="box" x="420" y="372" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="391">MessageQueueReconfigurer</text>
    <text class="sub" x="432" y="407">channel MessageQueue slot cap</text>
    <g class="chip k-ext"><rect x="766" y="379" width="200" height="16" rx="8"/><text x="773" y="391">only when a channel is enabled</text></g>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">MessageQueueReconfigurer</tspan> · the channel MessageQueue's own slot cap (message_queue_reconfigurer.dart)</text><text class="p2" x="36" y="688">Registered only when a channel is enabled (channel_wiring.dart).</text></g>
  </g></a>
  <a href="../configuration-architecture.md#reconfigurable-services"><g class="n tint k-host" id="r7">
    <rect class="box" x="420" y="424" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="443">ContextMonitor</text>
    <text class="sub" x="432" y="459">reserve tokens, warning threshold</text>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">ContextMonitor</tspan> · applies context.reserve_tokens and the warning threshold (context_monitor.dart)</text><text class="p2" x="36" y="688">context.warning_threshold is a live field, also applied through ConfigChangeSubscriber.</text></g>
  </g></a>
  <a href="../configuration-architecture.md#reconfigurable-services"><g class="n tint k-host" id="r8">
    <rect class="box" x="420" y="476" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="495">ResultTrimmer</text>
    <text class="sub" x="432" y="511">host tool-result byte cap</text>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">ResultTrimmer</tspan> · soft-trims oversized tool results to head plus tail at context.max_result_bytes (result_trimmer.dart)</text><text class="p2" x="36" y="688">McpProtocolHandler applies it to the successful text result of every tools/call; the truncation marker is never dropped.</text></g>
  </g></a>
  <a href="../configuration-architecture.md#reconfigurable-services"><g class="n tint k-host" id="r9">
    <rect class="box" x="420" y="528" width="556" height="44" rx="9"/>
    <text class="name mono-name" x="432" y="547">AlertRouter</text>
    <text class="sub" x="432" y="563">targets, routes, cooldowns</text>
    <g class="d"><text class="p1" x="36" y="668"><tspan class="b">AlertRouter</tspan> · re-reads alert targets, routes, cooldown and burst threshold (alert_router.dart)</text><text class="p2" x="36" y="688">A section added to DartclawConfig without a tier once left this router dead; config_section_tier_coverage_test.dart now fails on that gap.</text></g>
  </g></a>
  <g transform="translate(24,594)">
    <g class="solid k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">delta</text>
    <g class="tint k-host"><rect class="box" x="75.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="97.0" y="10">service</text>
    <g class="tint k-sec"><rect class="box" x="162.4" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="184.4" y="10">security</text>
    <g class="tint k-ext"><rect class="box" x="256.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="278.0" y="10">conditional</text>
    <g class="ghost k-neu"><rect class="box" x="368.2" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="390.2" y="10">no service</text>
    <g class="e "><path d="M474.2,6 H506.2"/></g><text class="lg" x="514.2" y="10">watch key matched</text>
  </g>
</svg>
