<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 874" width="1000" height="874" role="img" aria-labelledby="title desc">
  <title id="title">Bounded contexts and integration patterns</title>
  <desc id="desc">Twelve contexts with the named pattern on each point-to-point integration, plus three cross-cutting contexts and the shared kernel. Core subdomains are blue, supporting purple; turn-orchestration is the hub that execution, guarding, governance, conversation and knowledge contexts feed.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
    .edge.bi { marker-start: url(#arrow); }
    .edge.plain { marker-end: none; }
    svg .node:hover .edge.bi { marker-start: url(#arrow-hi); }
    svg .node:hover .edge.plain { marker-end: none; }
    .elab { fill: var(--sub); font-size: 10.5px; font-weight: 600; }
    .badge { fill: var(--accent); }
    .badge-text { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .life { stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 3 4; }
    .msg { fill: none; stroke: var(--edge); stroke-width: 1.5; marker-end: url(#arrow); }
    .msg.ret { stroke-dasharray: 5 4; }
    .mlabel { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; }
    .legend-text { fill: var(--sub); font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="874"/>
  <text class="title" x="24" y="34">Bounded contexts and integration patterns</text>
  <text class="lede" x="24" y="56">Arrows run from upstream (supplier) to downstream (consumer). Cross-cutting contexts and the shared kernel are at the bottom.</text>
  <g class="node k-chan">
    <title>Project &amp; source control. dartclaw_runtime/lib/src/project/, Project and ProjectConfig in dartclaw_kernel. Shared upstream of task-review and workflow-orchestration.</title>
    <path class="edge" d="M230,126 H298"/>
    <path class="edge" d="M135,100 V82 H635 V98"/>
    <rect class="box" x="40" y="100" width="190" height="52" rx="6"/>
    <text class="mono" x="54" y="122">project-registry</text>
    <text class="sub" x="54" y="139">git checkouts</text>
  </g>
  <text class="elab" x="262" y="120" text-anchor="middle">OHS</text>
  <text class="elab" x="385" y="78" text-anchor="middle">OHS</text>
  <g class="node k-host">
    <title>Deterministic multi-step pipelines with git branch topology. dartclaw_workflow plus glue in dartclaw_runtime. Contested core (H-1).</title>
    <rect class="box" x="300" y="100" width="190" height="52" rx="6"/>
    <text class="mono" x="314" y="122">workflow-orchestration</text>
    <text class="sub" x="314" y="139">pipelines, branches</text>
  </g>
  <g class="node k-chan">
    <title>Task and review lifecycle plus scheduling. dartclaw_runtime/lib/src/{task,scheduling}/, dartclaw_core/lib/src/task/.</title>
    <path class="edge" d="M540,126 H492"/>
    <path class="edge" d="M730,126 H865 V158"/>
    <rect class="box" x="540" y="100" width="190" height="52" rx="6"/>
    <text class="mono" x="554" y="122">task-review</text>
    <text class="sub" x="554" y="139">reviewable work</text>
  </g>
  <text class="elab" x="516" y="120" text-anchor="middle">C/S</text>
  <text class="elab" x="780" y="120" text-anchor="middle">C/S</text>
  <g class="node k-chan">
    <title>Normalizes WhatsApp, Signal, Google Chat and Slack into one inbound/outbound contract. dartclaw_core/lib/src/channel/ plus four adapter packages.</title>
    <rect class="box" x="770" y="160" width="190" height="52" rx="6"/>
    <text class="mono" x="784" y="182">channel-integration</text>
    <text class="sub" x="784" y="199">ChannelMessage in/out</text>
  </g>
  <g class="node k-host">
    <title>Claude JSONL, Codex JSON-RPC and ACP normalized to one host-owned contract. dartclaw_core/lib/src/{harness,bridge,worker}/, dartclaw_acp.</title>
    <path class="edge" d="M230,226 H300 V312 H398"/>
    <rect class="box" x="40" y="200" width="190" height="52" rx="6"/>
    <text class="mono" x="54" y="222">provider-mediation</text>
    <text class="sub" x="54" y="239">AgentHarness, adapters</text>
  </g>
  <text class="elab" x="306" y="268">OHS</text>
  <g class="node k-chan">
    <title>Budgets, rate limits, loop detection, emergency stop. Governance is pre-execution; the coordinator is post-governance.</title>
    <path class="edge" d="M470,252 V298"/>
    <rect class="box" x="400" y="200" width="190" height="52" rx="6"/>
    <text class="mono" x="414" y="222">runtime-governance</text>
    <text class="sub" x="414" y="239">pre-execution limits</text>
  </g>
  <text class="elab" x="476" y="282">C/S</text>
  <g class="node k-host">
    <title>Binds each execution to one trust principal and mediates provider traffic host-side. dartclaw_runtime/lib/src/container/, dartclaw_bridge.</title>
    <path class="edge bi" d="M135,330 V254"/>
    <path class="edge bi" d="M230,346 H398"/>
    <rect class="box" x="40" y="330" width="190" height="52" rx="6"/>
    <text class="mono" x="54" y="352">execution-isolation</text>
    <text class="sub" x="54" y="369">principal, authority, gateway</text>
  </g>
  <text class="elab" x="142" y="296">P</text>
  <text class="elab" x="312" y="340">P</text>
  <g class="node k-host">
    <title>Admits, runs and observes one unit of agent work: serialized primary lane, hard per-provider lease capacity, worker reuse.</title>
    <rect class="box" x="400" y="300" width="220" height="52" rx="6"/>
    <text class="mono" x="414" y="322">turn-orchestration</text>
    <text class="sub" x="414" y="339">lanes, leases, coordinator</text>
  </g>
  <g class="node k-chan">
    <title>Conversation identity, retention, submissions, attempts, effective context, inbox state.</title>
    <path class="edge" d="M770,326 H622"/>
    <path class="edge" d="M865,300 V214"/>
    <rect class="box" x="770" y="300" width="190" height="52" rx="6"/>
    <text class="mono" x="784" y="322">conversation-session</text>
    <text class="sub" x="784" y="339">sessions, attempts</text>
  </g>
  <text class="elab" x="692" y="320" text-anchor="middle">C/S</text>
  <text class="elab" x="871" y="262">C/S</text>
  <g class="node k-dev">
    <title>Publishes host-owned tools to provider binaries and consumes external MCP servers under the egress guard. dartclaw_runtime/lib/src/mcp/.</title>
    <path class="edge" d="M135,460 V384"/>
    <rect class="box" x="40" y="460" width="190" height="52" rx="6"/>
    <text class="mono" x="54" y="482">tool-surface</text>
    <text class="sub" x="54" y="499">host MCP + outbound MCP</text>
  </g>
  <text class="elab" x="142" y="428">C/S</text>
  <g class="node k-host">
    <title>Evaluates tool calls, inbound messages and egress, and records the verdict. EventBus-free by design.</title>
    <path class="edge" d="M450,460 V354"/>
    <path class="edge" d="M330,486 H232"/>
    <path class="edge plain dashed" d="M345,460 L215,382"/>
    <rect class="box" x="330" y="460" width="190" height="52" rx="6"/>
    <text class="mono" x="344" y="482">guarding-audit</text>
    <text class="sub" x="344" y="499">guards, verdicts</text>
  </g>
  <text class="elab" x="456" y="420">OHS</text>
  <text class="elab" x="262" y="480" text-anchor="middle">OHS</text>
  <text class="elab" x="292" y="448">SW</text>
  <g class="node k-host">
    <title>Durable knowledge: canonical memory, search index, knowledge graph, citation synthesis. dartclaw_core/lib/src/{memory,search,knowledge,storage}/, dartclaw_search.</title>
    <path class="edge" d="M600,460 V354"/>
    <path class="edge" d="M760,486 H865 V354"/>
    <path class="edge" d="M660,512 V560 H135 V514"/>
    <rect class="box" x="560" y="460" width="200" height="52" rx="6"/>
    <text class="mono" x="574" y="482">knowledge-memory</text>
    <text class="sub" x="574" y="499">memory, search, KG</text>
  </g>
  <text class="elab" x="606" y="420">C/S</text>
  <text class="elab" x="802" y="480" text-anchor="middle">OHS</text>
  <text class="elab" x="400" y="553" text-anchor="middle">OHS</text>
  <rect class="group" x="24" y="596" width="952" height="104" rx="8"/>
  <text class="group-label" x="36" y="614">Cross-cutting contexts</text>
  <g class="node k-chan">
    <title>Routes, templates, auth, web UI and CLI. Conformist to every context it renders (accepted drift D-1); Published Language from conversation-session; Open Host Service from workflow-orchestration.</title>
    <rect class="box" x="40" y="626" width="290" height="62" rx="6"/>
    <text class="mono" x="54" y="648">operator-interface</text>
    <text class="sub" x="54" y="665">Conformist to every context it renders;</text>
    <text class="sub" x="54" y="679">PL from conversation-session, OHS from workflow</text>
  </g>
  <g class="node k-chan">
    <title>Consumes the sealed DartclawEvent hierarchy; subscribers never reach into domains (ADR-011).</title>
    <rect class="box" x="355" y="626" width="290" height="62" rx="6"/>
    <text class="mono" x="369" y="648">observability-alerting</text>
    <text class="sub" x="369" y="665">Published Language: sealed DartclawEvent</text>
    <text class="sub" x="369" y="679">from all contexts</text>
  </g>
  <g class="node k-chan">
    <title>Typed sections are an Open Host Service for all contexts; ConfigDelta + Reconfigurable.watchKeys is the Published Language for hot reload.</title>
    <rect class="box" x="670" y="626" width="290" height="62" rx="6"/>
    <text class="mono" x="684" y="648">configuration-platform</text>
    <text class="sub" x="684" y="665">OHS: typed sections for all contexts;</text>
    <text class="sub" x="684" y="679">PL: ConfigDelta for hot reload</text>
  </g>
  <g class="node k-store">
    <title>Shared Kernel (not a context): dependency-free values, storage ports, typed configuration, guard contracts and utilities shared verbatim.</title>
    <rect class="box" x="24" y="712" width="952" height="40" rx="6"/>
    <text class="mono" x="38" y="738">dartclaw_kernel</text><text class="sub" x="188" y="738">Shared Kernel to all contexts (not itself a context): values, storage ports, typed config, guard contracts, utilities</text>
  </g>
  <path class="edge" d="M24,782 L64,782"/><text class="legend-text" x="72" y="786">upstream to downstream</text>
  <path class="edge bi" d="M232,782 L272,782"/><text class="legend-text" x="280" y="786">Partnership (P)</text>
  <path class="edge plain dashed" d="M402,782 L442,782"/><text class="legend-text" x="450" y="786">Separate Ways (SW)</text>
  <rect x="24" y="798" width="20" height="12" rx="3" fill="none" stroke="var(--host)"/><text class="legend-text" x="52" y="808">core subdomain</text>
  <rect x="168" y="798" width="20" height="12" rx="3" fill="none" stroke="var(--chan)"/><text class="legend-text" x="196" y="808">supporting subdomain</text>
  <rect x="340" y="798" width="20" height="12" rx="3" fill="none" stroke="var(--dev)" stroke-dasharray="5 4"/><text class="legend-text" x="368" y="808">no subdomain of its own (shared)</text>
  <text class="legend-text" x="24" y="832">OHS Open Host Service · C/S Customer/Supplier · PL Published Language</text>
  <text class="legend-text" x="24" y="854">External upstreams (provider CLIs, messaging APIs, MCP servers, Docker) are in the Integration Patterns tables.</text>
</svg>
