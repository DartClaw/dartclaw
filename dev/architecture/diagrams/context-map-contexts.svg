  <rect class="bg" width="1000" height="816"/>
  <!-- Details panel: painted first so node details (.d) draw on top -->
  <rect class="panel" x="16" y="720" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="744">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="768">Hover a context for its purpose and invariant; its integrations light up. Click it to open the table.</text><text class="p2" x="36" y="788">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">CONTEXT MAP · THE EXECUTION CORE</text>
  <text class="title" x="24" y="58">Bounded contexts around turn-orchestration</text>
  <text class="lede" x="24" y="80">Arrows run from upstream to downstream. Six contexts meet at the turn hub; guarding-audit and execution-isolation compose only there.</text>

  <g class="k-sec"><rect class="band" x="52" y="276" width="224" height="262" rx="14"/><text class="kick" x="68" y="298">DEFENSE LAYERS 3 + 5</text></g>
  <text class="lg" x="24" y="662" text-anchor="start">Weight</text>
  <text class="lg" x="24" y="688" text-anchor="start">Colour</text>
  <text class="lg" x="24" y="712" text-anchor="start">OHS Open Host Service · C/S Customer/Supplier · P Partnership · SW Separate Ways.</text>

  <g class="edges">
    <g class="e  f-provider t-turn"><path d="M410,202 V298"/><text class="el" x="418" y="254" text-anchor="start">OHS</text></g>
    <g class="e  f-gov t-turn"><path d="M620,202 V298"/><text class="el" x="628" y="254" text-anchor="start">C/S</text></g>
    <g class="e bi f-exec t-turn"><path d="M266,342 H318"/><text class="el" x="292" y="334" text-anchor="middle">P</text></g>
    <g class="e bi f-exec f-provider t-provider t-exec"><path d="M310,171 H236 V309"/><text class="el" x="272" y="163" text-anchor="start">P</text></g>
    <g class="e  f-guard t-turn"><path d="M266,462 H350 V386"/><text class="el" x="358" y="430" text-anchor="start">OHS</text></g>
    <g class="e dash join f-guard t-exec"><path d="M164,450 V375"/><text class="el" x="172" y="418" text-anchor="start">SW</text></g>
    <g class="e  f-guard t-tools"><path d="M164,512 V568"/><text class="el" x="172" y="546" text-anchor="start">OHS</text></g>
    <g class="e  f-tools t-exec"><path d="M64,601 H34 V342 H62"/><text class="el" x="34" y="472" text-anchor="middle">C/S</text></g>
    <g class="e  f-know t-turn"><path d="M470,450 V386"/><text class="el" x="478" y="424" text-anchor="start">C/S</text></g>
    <g class="e  f-know t-tools"><path d="M370,496 H316 V601 H268"/><text class="el" x="324" y="560" text-anchor="start">OHS</text></g>
    <g class="e  f-know t-conv"><path d="M570,481 H878 V375"/><text class="el" x="730" y="473" text-anchor="middle">OHS</text></g>
    <g class="e  f-conv t-turn"><path d="M778,342 H722"/><text class="el" x="750" y="334" text-anchor="middle">C/S</text></g>
  </g>

  <a href="../context-map.md#bounded-contexts"><g class="n solid k-host" id="turn">
    <rect class="box" x="320" y="300" width="400" height="84" rx="9"/>
    <text class="name mono-name" x="332" y="323">turn-orchestration</text>
    <text class="sub" x="332" y="341">core · admit, run and observe one unit of agent work</text>
    <text class="sub" x="332" y="357">serialized primary lane, hard per-provider leases</text>
    <g class="d"><text class="p1" x="36" y="768"><tspan class="b">turn-orchestration</tspan> · admits, runs and observes one unit of agent work: one serialized primary lane, per-provider worker leases</text><text class="p2" x="36" y="788">Capacity is lease-based and reuse is only an optimization. Lives in dartclaw_runtime turn_*.dart and execution_coordinator*.dart.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n tint k-ext" id="provider">
    <rect class="box" x="310" y="140" width="200" height="62" rx="9"/>
    <text class="name mono-name" x="322" y="163">provider-mediation</text>
    <text class="sub" x="322" y="181">core · AgentHarness, adapters</text>
    <g class="d"><text class="p1" x="36" y="768"><tspan class="b">provider-mediation</tspan> · Claude JSONL, Codex JSON-RPC and ACP normalized to one host-owned execution contract</text><text class="p2" x="36" y="788">Provider branching stays inside adapters (AgentHarness + ProtocolAdapter); BridgeEvent is its published language.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n line k-sec" id="gov">
    <rect class="box" x="530" y="140" width="200" height="62" rx="9"/>
    <text class="name mono-name" x="542" y="163">runtime-governance</text>
    <text class="sub" x="542" y="181">supporting · admission limits</text>
    <g class="d"><text class="p1" x="36" y="768"><tspan class="b">runtime-governance</tspan> · cost, rate and runaway-autonomy limits, enforced before a turn starts</text><text class="p2" x="36" y="788">Governance is pre-execution and the coordinator is post-governance; every control is default-disabled.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n tint k-sec" id="exec">
    <rect class="box" x="64" y="311" width="200" height="62" rx="9"/>
    <text class="name mono-name" x="76" y="334">execution-isolation</text>
    <text class="sub" x="76" y="352">core · principal, authority</text>
    <g class="d"><text class="p1" x="36" y="768"><tspan class="b">execution-isolation</tspan> · binds each execution to one trust principal and mediates its provider traffic host-side</text><text class="p2" x="36" y="788">A container never crosses principals; credentials never enter a container environment. Its bridge frame format is a Published Language.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n tint k-sec" id="guard">
    <rect class="box" x="64" y="450" width="200" height="62" rx="9"/>
    <text class="name mono-name" x="76" y="473">guarding-audit</text>
    <text class="sub" x="76" y="491">core · guards, verdicts</text>
    <g class="d"><text class="p1" x="36" y="768"><tspan class="b">guarding-audit</tspan> · evaluates every tool call, inbound message and egress against policy and records the verdict</text><text class="p2" x="36" y="788">EventBus-free by design so guards run standalone; verdicts leave through GuardVerdictCallback. Fail-closed by default.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n ghost k-ext" id="tools">
    <rect class="box" x="64" y="570" width="200" height="62" rx="9"/>
    <text class="name mono-name" x="76" y="593">tool-surface</text>
    <text class="sub" x="76" y="611">shared · host + outbound MCP</text>
    <g class="d"><text class="p1" x="36" y="768"><tspan class="b">tool-surface</tspan> · publishes host-owned tools to provider binaries and consumes external MCP servers under guard</text><text class="p2" x="36" y="788">No subdomain of its own (it shares guarding and knowledge). Container executions reach /mcp only through the per-authority bridge.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n tint k-store" id="know">
    <rect class="box" x="370" y="450" width="200" height="62" rx="9"/>
    <text class="name mono-name" x="382" y="473">knowledge-memory</text>
    <text class="sub" x="382" y="491">core · memory, search, graph</text>
    <g class="d"><text class="p1" x="36" y="768"><tspan class="b">knowledge-memory</tspan> · retains, curates and synthesizes durable knowledge; serves citation-backed context to agents</text><text class="p2" x="36" y="788">The search index is a rebuildable projection; authoritative knowledge-graph facts live in durable storage.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n line k-host" id="conv">
    <rect class="box" x="780" y="311" width="196" height="62" rx="9"/>
    <text class="name mono-name" x="792" y="334">conversation-session</text>
    <text class="sub" x="792" y="352">supporting · sessions</text>
    <g class="d"><text class="p1" x="36" y="768"><tspan class="b">conversation-session</tspan> · conversation identity, retention, submissions, attempts, effective context and inbox state</text><text class="p2" x="36" y="788">The session key is deterministic, which decouples scoping from session discovery.</text></g>
  </g></a>
  <g transform="translate(80,652)">
    <g class="solid k-neu"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">hub</text>
    <g class="tint k-neu"><rect class="box" x="62.6" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="84.6" y="10">core subdomain</text>
    <g class="line k-neu"><rect class="box" x="193.4" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="215.4" y="10">supporting</text>
    <g class="ghost k-neu"><rect class="box" x="299.4" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="321.4" y="10">shared, no subdomain of its own</text>
    <g class="e "><path d="M535.6,6 H567.6"/></g><text class="lg" x="575.6" y="10">upstream to downstream</text>
    <g class="e bi"><path d="M734.0,6 H766.0"/></g><text class="lg" x="774.0" y="10">mutual</text>
  </g>
  <g transform="translate(80,678)">
    <g class="tint k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">turn flow and sessions</text>
    <g class="tint k-ext"><rect class="box" x="180.4" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="202.4" y="10">faces a provider or MCP peer</text>
    <g class="tint k-sec"><rect class="box" x="398.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="420.0" y="10">isolates or limits</text>
    <g class="tint k-store"><rect class="box" x="553.6" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="575.6" y="10">durable knowledge</text>
  </g>
</svg>
