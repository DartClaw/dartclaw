<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 856" width="1000" height="856" role="img" aria-labelledby="title desc">
  <title id="title">Where DartClaw conforms and where it translates</title>
  <desc id="desc">Five external upstreams and the pattern on each. Provider CLIs are a Conformist wire format and an Anticorruption Layer for their models; messaging APIs get an Anticorruption Layer; external MCP servers and Docker are Conformist; AndThen is Separate Ways from the workflow engine and Conformist for the built-in definitions.</desc>
  <style>

    svg { --bg:#f6f7f9; --card:#ffffff; --ink:#1e2030; --ink2:#4c4f69; --ink3:#6c6f85; --rule:#ccd0da; --edge:#8c8fa1; --hi:#1e66f5; --on:#ffffff; --panel:#1e1e2e; --panel-ink:#cdd6f4; --panel-sub:#a6adc8; --panel-kick:#fab387;
      --host:#40a02b; --host-d:#1f5c2a; --host-l:#2d7a1f; --ext:#e07c4f; --ext-d:#a8481c; --ext-l:#b5531f; --store:#179299; --store-d:#0f5f63; --store-l:#0e7377;
