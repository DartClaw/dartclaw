  <rect class="panel" x="16" y="760" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="784">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="808">Hover a box for what it is and why the pattern holds; its edges light up. Click it to open the table.</text><text class="p2" x="36" y="828">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">CONTEXT MAP · EXTERNAL UPSTREAMS</text>
  <text class="title" x="24" y="58">Where DartClaw conforms and where it translates</text>
  <text class="lede" x="24" y="80">Vendors set the terms. Provider and messaging adapters translate them; MCP, Docker and AndThen are taken as given or kept apart.</text>

  <g class="k-host"><rect class="band" x="640" y="498" width="336" height="168" rx="14"/><text class="kick" x="656" y="520">workflow-orchestration</text></g>
  <text class="lg" x="24" y="702" text-anchor="start">Weight</text>
  <text class="lg" x="24" y="728" text-anchor="start">Colour</text>
  <text class="lg" x="24" y="752" text-anchor="start">ACL Anticorruption Layer, on the downstream context · Conformist: the downstream takes the upstream model as given · Separate Ways: deliberately no link.</text>

  <g class="edges">
    <g class="e  f-cli t-pm"><path d="M326,148 H658"/><text class="el" x="492" y="140" text-anchor="middle">Conformist · wire formats as specified</text></g>
    <g class="e  f-cli t-pm"><path d="M326,184 H658"/><text class="el" x="492" y="176" text-anchor="middle">ACL · ProtocolAdapter</text></g>
    <g class="e  f-msg t-ci"><path d="M326,265 H658"/><text class="el" x="492" y="257" text-anchor="middle">ACL · adapter to ChannelMessage</text></g>
    <g class="e  f-mcp t-ts"><path d="M326,353 H658"/><text class="el" x="492" y="345" text-anchor="middle">Conformist · only surface_tools</text></g>
    <g class="e  f-docker t-ei"><path d="M326,441 H658"/><text class="el" x="492" y="433" text-anchor="middle">Conformist</text></g>
    <g class="e dash join f-andthen t-engine"><path d="M326,556 H658"/><text class="el" x="492" y="548" text-anchor="middle">Separate Ways · fitness-enforced</text></g>
    <g class="e  f-andthen t-defs"><path d="M326,624 H658"/><text class="el" x="492" y="616" text-anchor="middle">Conformist · skills named in YAML</text></g>
  </g>

  <a href="../context-map.md#external"><g class="n tint k-ext" id="cli">
    <rect class="box" x="24" y="122" width="300" height="88" rx="9"/>
    <text class="name" x="36" y="145">provider CLIs</text>
    <text class="sub" x="36" y="163">claude, codex, any ACP agent</text>
    <text class="sub" x="36" y="179">JSONL and JSON-RPC over stdio</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">provider CLIs</tspan> · claude (JSONL), codex (JSON-RPC) and ACP agents (JSON-RPC) are vendor-owned binaries and formats</text><text class="p2" x="36" y="828">DartClaw spawns them directly and implements each protocol as specified, so nothing in the chain is negotiable or npm-based.</text></g>
  </g></a>
  <a href="../context-map.md#external"><g class="n tint k-chan" id="msg">
    <rect class="box" x="24" y="232" width="300" height="66" rx="9"/>
    <text class="name" x="36" y="255">messaging platform APIs</text>
    <text class="sub" x="36" y="273">WhatsApp (GOWA), Signal (signal-cli)</text>
    <text class="sub" x="36" y="289">Google Chat, Slack</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">messaging platform APIs</tspan> · WhatsApp via the GOWA sidecar, Signal via signal-cli, Google Chat webhooks, Slack Socket Mode or Events API</text><text class="p2" x="36" y="828">Each platform keeps its own identity, thread and payload model; none of it is renegotiated by DartClaw.</text></g>
  </g></a>
  <a href="../context-map.md#external"><g class="n tint k-ext" id="mcp">
    <rect class="box" x="24" y="320" width="300" height="66" rx="9"/>
    <text class="name" x="36" y="343">external MCP servers</text>
    <text class="sub" x="36" y="361">tool schemas taken as given</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">external MCP servers</tspan> · MCP servers the operator configures under mcp_servers; their tool schemas are not DartClaw's to change</text><text class="p2" x="36" y="828">Only tools named in a server's surface_tools are surfaced; an unknown name there is a config error.</text></g>
  </g></a>
  <a href="../context-map.md#external"><g class="n tint k-ext" id="docker">
    <rect class="box" x="24" y="408" width="300" height="66" rx="9"/>
    <text class="name" x="36" y="431">Docker / OS platform</text>
    <text class="sub" x="36" y="449">container runtime semantics</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">Docker / OS platform</tspan> · Docker and OS capabilities decide what isolation is possible; DartClaw takes their semantics as given</text><text class="p2" x="36" y="828">An explicit container.enabled on native Windows exits rather than degrading; run on POSIX or inside WSL.</text></g>
  </g></a>
  <a href="../context-map.md#external"><g class="n ghost k-ext" id="andthen">
    <rect class="box" x="24" y="528" width="300" height="124" rx="9"/>
    <text class="name" x="36" y="551">AndThen framework</text>
    <text class="sub" x="36" y="569">skills the workflow YAML names</text>
    <text class="sub" x="36" y="585">not a dependency of the engine</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">AndThen framework</tspan> · the skill framework the shipped workflow definitions are written against</text><text class="p2" x="36" y="828">The engine stays framework-agnostic (ADR-041); check_no_framework_coupling.sh fails on any andthen literal outside definition YAML.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n tint k-ext" id="pm">
    <rect class="box" x="660" y="122" width="316" height="88" rx="9"/>
    <text class="name mono-name" x="672" y="145">provider-mediation</text>
    <g class="badge"><rect x="933" y="133" width="33" height="16" rx="8"/><text x="950" y="145">ACL</text></g>
    <text class="sub" x="672" y="163">core · AgentHarness, adapters</text>
    <text class="sub" x="672" y="179">ProtocolAdapter → BridgeEvent</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">provider-mediation</tspan> · translates three vendor models into BridgeEvent and the canonical tool taxonomy</text><text class="p2" x="36" y="828">The ACL is ProtocolAdapter: provider drift stops at the adapter, while the wire format itself is taken as specified.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n line k-chan" id="ci">
    <rect class="box" x="660" y="232" width="316" height="66" rx="9"/>
    <text class="name mono-name" x="672" y="255">channel-integration</text>
    <g class="badge"><rect x="933" y="243" width="33" height="16" rx="8"/><text x="950" y="255">ACL</text></g>
    <text class="sub" x="672" y="273">supporting · ChannelMessage</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">channel-integration</tspan> · per-platform adapters normalize every inbound message to ChannelMessage before routing</text><text class="p2" x="36" y="828">Vendor quirks stay inside the adapter, so a new platform adds an adapter rather than context surface.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n ghost k-ext" id="ts">
    <rect class="box" x="660" y="320" width="316" height="66" rx="9"/>
    <text class="name mono-name" x="672" y="343">tool-surface</text>
    <text class="sub" x="672" y="361">shared · outbound MCP client</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">tool-surface</tspan> · consumes external MCP servers under guard and publishes host-owned tools to providers</text><text class="p2" x="36" y="828">The egress guard mediates every outbound MCP call before dispatch (ADR-039).</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n tint k-sec" id="ei">
    <rect class="box" x="660" y="408" width="316" height="66" rx="9"/>
    <text class="name mono-name" x="672" y="431">execution-isolation</text>
    <text class="sub" x="672" y="449">core · principal, authority</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">execution-isolation</tspan> · binds each execution to one trust principal and mediates provider traffic host-side</text><text class="p2" x="36" y="828">Docker semantics are taken as given, so container behavior is whatever the runtime provides.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n tint k-host" id="engine">
    <rect class="box" x="660" y="528" width="300" height="56" rx="9"/>
    <text class="name mono-name" x="672" y="547">engine</text>
    <text class="sub" x="672" y="563">declared schema only</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">engine</tspan> · the workflow engine validates declared schema only</text><text class="p2" x="36" y="828">Framework semantics live in definitions and skills, never in dartclaw_workflow/lib/src code.</text></g>
  </g></a>
  <a href="../context-map.md#bounded-contexts"><g class="n line k-host" id="defs">
    <rect class="box" x="660" y="596" width="300" height="56" rx="9"/>
    <text class="name mono-name" x="672" y="615">built-in definitions</text>
    <text class="sub" x="672" y="631">YAML names AndThen skills</text>
    <g class="d"><text class="p1" x="36" y="808"><tspan class="b">built-in definitions</tspan> · code-review, plan-and-implement and story-and-implement name AndThen skills directly</text><text class="p2" x="36" y="828">The one sanctioned home for framework semantics, which is why the edge is Conformist and the engine edge is not.</text></g>
  </g></a>
  <g transform="translate(80,692)">
    <g class="tint k-neu"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">external peer or core context</text>
    <g class="line k-neu"><rect class="box" x="223.8" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="245.8" y="10">supporting or secondary</text>
    <g class="ghost k-neu"><rect class="box" x="410.4" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="432.4" y="10">optional or shared</text>
    <g class="e "><path d="M566.0,6 H598.0"/></g><text class="lg" x="606.0" y="10">upstream to downstream</text>
    <g class="e dash"><path d="M764.4,6 H796.4"/></g><text class="lg" x="804.4" y="10">no integration</text>
  </g>
  <g transform="translate(80,718)">
    <g class="tint k-ext"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">vendor, provider and tool side</text>
    <g class="tint k-chan"><rect class="box" x="230.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="252.0" y="10">messaging</text>
    <g class="tint k-sec"><rect class="box" x="329.8" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="351.8" y="10">isolation</text>
    <g class="tint k-host"><rect class="box" x="429.6" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="451.6" y="10">workflow engine side</text>
  </g>
</svg>
