<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 814" width="1000" height="814" role="img" aria-labelledby="title desc">
  <title id="title">Entities and reference enforcement</title>
  <desc id="desc">Entity map of the task, execution, workflow and session records. Arrows point from the referencing row to the row it names. Four references are PostgreSQL foreign keys: tasks to agent_executions, workflow_step_executions to tasks and to agent_executions, and task_artifacts to tasks. Every other reference, including those into the session files and projects.json, is an unconstrained string id.</desc>
  <style>

