<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-labelledby="title desc">
  <title id="title">Memory corpus commit and crash recovery</title>
  <desc id="desc">Five commit steps (stage, journal, replace with MEMORY.md last, manifest, cleanup) and the recovery decision: MEMORY.md at the journal target revision rolls forward, otherwise rolls back, then verification fails closed on any mismatch.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .mono-s { font-size: 11.5px; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="690"/>
  <text class="title" x="24" y="34">Memory corpus commit and crash recovery</text>
  <text class="lede" x="24" y="56">A multi-file write is journaled; MEMORY.md is replaced last, so its revision tells recovery which way to go.</text>
  <text class="group-label" x="24" y="84">Commit (MemoryCorpusService, under the workspace lock)</text>
  <g class="node k-host">
    <title>Every changed member is written to stage-N and, when it exists, its current bytes to backup-N, inside .dartclaw-memory-transaction/. Any previous transaction directory is deleted first. Nothing in the corpus has changed yet.</title>
    <path class="edge" d="M196,148 H217"/>
    <rect class="box" x="24" y="96" width="172" height="120" rx="6"/>
    <text class="mono" x="36" y="118">1  stage</text>
    <text class="sub" x="36" y="138">stage-N: new bytes</text>
    <text class="sub" x="36" y="153">backup-N: current bytes</text>
    <text class="sub" x="36" y="168">in .dartclaw-memory-</text>
    <text class="sub" x="36" y="183">transaction/</text>
  </g>
  <g class="node k-host">
    <title>The journal is written atomically only after every stage and backup file exists. Its presence is what makes recovery run after a crash.</title>
    <path class="edge" d="M391,148 H412"/>
    <rect class="box" x="219" y="96" width="172" height="120" rx="6"/>
    <text class="mono" x="231" y="118">2  journal</text>
    <text class="sub" x="231" y="138">.dartclaw-memory-</text>
    <text class="sub" x="231" y="153">transaction.json: base and</text>
    <text class="sub" x="231" y="168">target revision, fingerprint,</text>
    <text class="sub" x="231" y="183">entries (atomic write)</text>
  </g>
  <g class="node k-host">
    <title>MEMORY.md carries the collection revision. Moving it last means a reader that sees the target revision there knows every other member was already replaced.</title>
    <path class="edge" d="M586,148 H607"/>
    <rect class="box" x="414" y="96" width="172" height="120" rx="6"/>
    <text class="mono" x="426" y="118">3  replace</text>
    <text class="sub" x="426" y="138">each changed member</text>
    <text class="sub" x="426" y="153">replaced from its stage;</text>
    <text class="sub" x="426" y="168">MEMORY.md last: its</text>
    <text class="sub" x="426" y="183">revision prefix is the</text>
    <text class="sub" x="426" y="198">commit marker</text>
  </g>
  <g class="node k-host">
    <title>The manifest is coordination state, rewritten after the members. It is rebuilt from the Markdown if missing.</title>
    <path class="edge" d="M781,148 H802"/>
    <rect class="box" x="609" y="96" width="172" height="120" rx="6"/>
    <text class="mono" x="621" y="118">4  manifest</text>
    <text class="sub" x="621" y="138">.dartclaw-memory-</text>
    <text class="sub" x="621" y="153">corpus.json: revision,</text>
    <text class="sub" x="621" y="168">fingerprint, member</text>
    <text class="sub" x="621" y="183">digests and record ids</text>
  </g>
  <g class="node k-host">
    <title>_cleanupTransaction removes the journal and directory. The registered post-commit projection then re-projects the committed entries; a hook failure marks the index degraded and leaves canonical memory available.</title>
    <rect class="box" x="804" y="96" width="172" height="120" rx="6"/>
    <text class="mono" x="816" y="118">5  cleanup</text>
    <text class="sub" x="816" y="138">delete the journal and</text>
    <text class="sub" x="816" y="153">the transaction directory;</text>
    <text class="sub" x="816" y="168">then the post-commit</text>
    <text class="sub" x="816" y="183">projection hook updates</text>
    <text class="sub" x="816" y="198">the derived index</text>
  </g>
  <text class="edge-label" x="24" y="236">crash before step 2: no journal, nothing replaced</text>
  <text class="edge-label" x="24" y="251">(the staging directory is deleted by the next write)</text>
  <text class="edge-label" x="414" y="236">crash after step 2 and before step 5: the journal remains and the next</text>
  <text class="edge-label" x="414" y="251">open, read, authenticate or write runs the recovery below</text>

  <text class="group-label" x="24" y="290">Recovery (runs first in every manifest preparation, authenticate and write)</text>
  <g class="node k-host">
    <title>_recoverLocked reads the journal. If .dartclaw-memory-transaction.json does not exist it returns immediately.</title>
    <path class="edge" d="M500,344 V366"/>
    <rect class="box" x="340" y="302" width="320" height="42" rx="6"/>
    <text class="mono" x="354" y="321">journal file found</text>
    <text class="sub" x="354" y="336">.dartclaw-memory-transaction.json</text>
  </g>
  <g class="node k-host">
    <title>The commit marker test: _readIndexRevisionPrefix(MEMORY.md) equals journal.targetRevision.</title>
    <path class="edge" d="M340,396 H164 V444"/>
    <path class="edge" d="M660,396 H836 V444"/>
    <rect class="box" x="340" y="366" width="320" height="60" rx="6"/>
    <text class="mono" x="354" y="388">MEMORY.md revision</text>
    <text class="sub" x="354" y="405">equals journal.targetRevision?</text>
    <text class="sub" x="354" y="419">(step 3 replaced MEMORY.md last)</text>
  </g>
  <text class="edge-label" x="172" y="390">yes</text>
  <text class="edge-label" x="780" y="390">no</text>
  <g class="node k-host">
    <title>Committed: copy every entry from its stage file again (idempotent), then continue to verification.</title>
    <path class="edge" d="M164,524 V574 H338"/>
    <rect class="box" x="24" y="444" width="280" height="80" rx="6"/>
    <text class="mono" x="38" y="466">roll forward</text>
    <text class="sub" x="38" y="485">replace each entry from stage-N</text>
    <text class="sub" x="38" y="501">revision = journal target</text>
  </g>
  <g class="node k-host">
    <title>Not committed: restore each entry from backup-N, or delete the file when it had no backup (a new member). A missing backup raises MemoryCorpusRecoveryRequired.</title>
    <path class="edge" d="M836,524 V574 H662"/>
    <rect class="box" x="696" y="444" width="280" height="80" rx="6"/>
    <text class="mono" x="710" y="466">roll back</text>
    <text class="sub" x="710" y="485">restore each entry from backup-N,</text>
    <text class="sub" x="710" y="501">delete members that had none</text>
  </g>
  <g class="node k-host">
    <title>Recovery recomputes member descriptors from the files and compares the collectionId and fingerprint with the journal (target when rolled forward, base when rolled back). Any mismatch, or a MEMORY.md revision that matches neither, throws MemoryCorpusRecoveryRequired and the corpus stays unavailable; nothing is guessed.</title>
    <rect class="box" x="340" y="544" width="320" height="64" rx="6"/>
    <text class="mono" x="354" y="566">verify, then rewrite manifest</text>
    <text class="sub" x="354" y="584">collectionId and fingerprint must match the journal;</text>
    <text class="sub" x="354" y="598">otherwise MemoryCorpusRecoveryRequired</text>
  </g>

  <rect x="24" y="640" width="34" height="18" rx="4" fill="none" stroke="var(--host)" stroke-width="1.4"/>
  <text class="note" x="66" y="654">step or recovery action; a failed verification refuses and the corpus stays unavailable</text>
  <text class="note" x="24" y="680">Source: packages/dartclaw_core/lib/src/memory/memory_corpus_authority.dart; hover a node for the detail.</text>
</svg>
