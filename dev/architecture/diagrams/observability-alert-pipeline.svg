    svg:has(#router:hover) .edges :is(.f-router,.t-router) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#classify:hover) .edges :is(.f-classify,.t-classify) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#resolve:hover) .edges :is(.f-resolve,.t-resolve) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#filter:hover) .edges :is(.f-filter,.t-filter) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#format:hover) .edges :is(.f-format,.t-format) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#throttle:hover) .edges :is(.f-throttle,.t-throttle) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#adapter:hover) .edges :is(.f-adapter,.t-adapter) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#summary:hover) .edges :is(.f-summary,.t-summary) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#chan:hover) .edges :is(.f-chan,.t-chan) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path class="ah-main" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="622"/>
  <!-- Details panel: painted first so node details (.d) draw on top -->
  <rect class="panel" x="16" y="526" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="550">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="574">Hover a step for what it decides; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="594">A red chip inside a step is where an event or alert stops; a grey chip is a counted or logged outcome.</text></g>

  <text class="kick" x="24" y="32">PIPELINE · AlertRouter._onEvent</text>
  <text class="title" x="24" y="58">Alert pipeline</text>
  <text class="lede" x="24" y="80">Steps 1 to 5 decide whether and where an alert goes once; steps 6 to 8 run for each target.</text>

  <g class="k-host"><rect class="band" x="16" y="104" width="968" height="122" rx="14"/><text class="kick" x="32" y="126">CLASSIFY · ONCE PER EVENT</text></g>
  <g class="k-host"><rect class="band" x="16" y="262" width="968" height="140" rx="14"/><text class="kick" x="32" y="284">FILTER, THEN SEND</text></g>
  <g class="k-host"><rect class="band inner" x="250" y="274" width="722" height="116" rx="10"/><text class="kick" x="266" y="296">PER TARGET · AlertRouter._deliver</text></g>

  <g class="edges">
    <g class="e main f-bus t-router"><path d="M212,172 H284"/><text class="el" x="248" y="164" text-anchor="middle">every event</text></g>
    <g class="e main f-router t-classify"><path d="M462,172 H534"/><text class="el" x="498" y="164" text-anchor="middle">event</text></g>
    <g class="e main f-classify t-resolve"><path d="M712,172 H784"/><text class="el" x="748" y="164" text-anchor="middle">alert type</text></g>
    <g class="e main f-resolve t-filter"><path d="M874,210 V244 H190 V308"/><text class="el" x="500" y="239" text-anchor="middle">classified alert and targets</text></g>
    <g class="e main f-filter t-format"><path d="M228,346 H288"/><text class="el" x="258" y="338" text-anchor="middle">per target</text></g>
    <g class="e main f-format t-throttle"><path d="M454,346 H506"/><text class="el" x="480" y="338" text-anchor="middle">response</text></g>
    <g class="e main f-throttle t-adapter"><path d="M698,346 H750"/><text class="el" x="724" y="338" text-anchor="middle">send now</text></g>
    <g class="e main f-adapter t-chan"><path d="M872,382 V430"/><text class="el" x="880" y="416" text-anchor="start">sendMessage</text></g>
    <g class="e dash f-throttle t-summary"><path d="M600,382 V430"/><text class="el" x="608" y="416" text-anchor="start">count ≥ burstThreshold</text></g>
    <g class="e dash f-summary t-adapter"><path d="M720,460 H780 V384"/><text class="el" x="750" y="453" text-anchor="middle">deliver</text></g>
  </g>

  <a href="../observability-operations-architecture.md#1-overview"><g class="n tint k-host" id="bus">
    <rect class="box" x="36" y="134" width="176" height="76" rx="9"/>
    <g class="step"><circle cx="56" cy="156" r="10"/><text x="56" y="160">1</text></g>
    <text class="name" x="74" y="157">EventBus</text>
    <text class="sub" x="74" y="175">DartclawEvent</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">EventBus</tspan> · sealed stream; AlertRouter subscribes to every DartclawEvent</text><text class="p2" x="36" y="594">Publishers: guards, governance, tasks, scheduler, credential and container health. classifyAlert names each subtype (ADR-057).</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#2-alerts"><g class="n tint k-host" id="router">
    <rect class="box" x="286" y="134" width="176" height="76" rx="9"/>
    <g class="step"><circle cx="306" cy="156" r="10"/><text x="306" y="160">2</text></g>
    <text class="name" x="324" y="157">AlertRouter</text>
    <text class="sub" x="324" y="175">alerts.enabled</text>
    <g class="chip k-sec"><rect x="324" y="186" width="107" height="16" rx="8"/><text x="331" y="198">disabled → drop</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">AlertRouter</tspan> · _onEvent returns at once when alerts.enabled is false (the default)</text><text class="p2" x="36" y="594">Reconfigurable on alerts.*: new values apply to the next event without resubscribing. Targets are checked at step 4.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#classifyalert"><g class="n solid k-host" id="classify">
    <rect class="box" x="536" y="134" width="176" height="76" rx="9"/>
    <g class="step"><circle cx="556" cy="156" r="10"/><text x="556" y="160">3</text></g>
    <text class="name mono-name" x="574" y="157">classifyAlert</text>
    <text class="sub" x="574" y="175">type, severity, body</text>
    <g class="chip k-sec"><rect x="574" y="186" width="82" height="16" rx="8"/><text x="581" y="198">null → drop</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">classifyAlert</tspan> · pure switch over every event subtype, no wildcard arm; null means not alertable</text><text class="p2" x="36" y="594">A new subtype fails the build until classified or mapped to null. Type, severity, body and details come only from here.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#routing-formatting-throttling"><g class="n tint k-host" id="resolve">
    <rect class="box" x="786" y="134" width="176" height="76" rx="9"/>
    <g class="step"><circle cx="806" cy="156" r="10"/><text x="806" y="160">4</text></g>
    <text class="name mono-name" x="824" y="157">_resolveTargets</text>
    <text class="sub" x="824" y="175">AlertsConfig.routes</text>
    <g class="chip k-sec"><rect x="824" y="186" width="107" height="16" rx="8"/><text x="831" y="198">no route → drop</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">_resolveTargets</tspan> · empty routes: all targets; routes[type] = [*]: all; indices select; no entry for the type: dropped</text><text class="p2" x="36" y="594">A bad index logs a warning and is skipped; an empty alerts.targets resolves to nothing, whatever routes says.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#classifyalert"><g class="n tint k-host" id="filter">
    <rect class="box" x="32" y="310" width="196" height="72" rx="9"/>
    <g class="step"><circle cx="52" cy="332" r="10"/><text x="52" y="336">5</text></g>
    <text class="name" x="70" y="333">task-failure filter</text>
    <text class="sub" x="70" y="351">task failures only</text>
    <g class="chip k-sec"><rect x="70" y="358" width="144" height="16" rx="8"/><text x="77" y="370">channel origin → drop</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">task-failure filter</tspan> · shouldAlertTaskFailure: a task from a DM or group session is dropped, since TaskNotificationSubscriber told that user</text><text class="p2" x="36" y="594">Other events skip this step. An unknown task is skipped; a malformed session key fails open and delivers.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#routing-formatting-throttling"><g class="n tint k-host" id="format">
    <rect class="box" x="290" y="310" width="164" height="72" rx="9"/>
    <g class="step"><circle cx="310" cy="332" r="10"/><text x="310" y="336">6</text></g>
    <text class="name mono-name" x="328" y="333">AlertFormatter</text>
    <text class="sub" x="328" y="351">text or Cards v2</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">AlertFormatter</tspan> · stateless and event-agnostic: Google Chat gets a Cards v2 card, every other channel [SEVERITY] Title: body</text><text class="p2" x="36" y="594">Owns the alert-type-to-title table and the burst summary text. It runs once per target, before the throttle decision.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#routing-formatting-throttling"><g class="n solid k-host" id="throttle">
    <rect class="box" x="508" y="310" width="190" height="72" rx="9"/>
    <g class="step"><circle cx="528" cy="332" r="10"/><text x="528" y="336">7</text></g>
    <text class="name mono-name" x="546" y="333">AlertThrottle</text>
    <text class="sub" x="546" y="351">cooldown and burst</text>
    <g class="chip k-neu"><rect x="546" y="358" width="132" height="16" rx="8"/><text x="553" y="370">in cooldown → count</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">AlertThrottle</tspan> · key alertType:channel:recipient; first alert delivers, later ones inside cooldownSeconds (300) are counted</text><text class="p2" x="36" y="594">Reconfigure applies to windows opened afterwards; dispose() drops pending summaries (alerts/alert_throttle.dart).</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#routing-formatting-throttling"><g class="n tint k-host" id="adapter">
    <rect class="box" x="752" y="310" width="212" height="72" rx="9"/>
    <g class="step"><circle cx="772" cy="332" r="10"/><text x="772" y="336">8</text></g>
    <text class="name mono-name" x="790" y="333">AlertDeliveryAdapter</text>
    <text class="sub" x="790" y="351">sendMessage, best effort</text>
    <g class="chip k-neu"><rect x="790" y="358" width="95" height="16" rx="8"/><text x="797" y="370">failure → log</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">AlertDeliveryAdapter</tspan> · resolves an AlertTarget to a Channel and calls sendMessage; never throws and never retries</text><text class="p2" x="36" y="594">An unknown channel type logs a warning, a send failure logs an error (alerts/alert_delivery_adapter.dart).</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#routing-formatting-throttling"><g class="n line k-host" id="summary">
    <rect class="box" x="500" y="432" width="220" height="56" rx="9"/>
    <text class="name mono-name" x="512" y="451">_onSummary</text>
    <text class="sub" x="512" y="467">formatSummary, then deliver</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">_onSummary</tspan> · timer callback at window end, only when suppressedCount &gt;= burstThreshold (5)</text><text class="p2" x="36" y="594">Bypasses the throttle. The summary takes the first suppressed alert's severity, so it never understates the burst.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#routing-formatting-throttling"><g class="n tint k-chan" id="chan">
    <rect class="box" x="800" y="432" width="144" height="56" rx="9"/>
    <text class="name" x="812" y="451">Channel</text>
    <text class="sub" x="812" y="467">by target.channel</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">Channel</tspan> · looked up by target.channel from the channel manager</text><text class="p2" x="36" y="594">Alerts travel the same channel infrastructure as user messages, so the operator sees them where they already work.</text></g>
  </g></a>
  <g transform="translate(24,500)">
    <g class="tint k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">pipeline step</text>
    <g class="solid k-host"><rect class="box" x="124.60000000000001" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="146.60000000000002" y="10">focal step</text>
    <g class="tint k-chan"><rect class="box" x="230.60000000000002" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="252.60000000000002" y="10">channel</text>
    <g class="e main"><path d="M318.0,6 H350.0"/></g><text class="lg" x="358.0" y="10">alert path</text>
    <g class="e dash"><path d="M442.0,6 H474.0"/></g><text class="lg" x="482.0" y="10">burst summary</text>
  </g>
</svg>
