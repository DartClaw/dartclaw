<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Compaction lifecycle</title>
  <desc id="desc">Claude Code and Codex compaction both become CompactionStartingEvent and CompactionCompletedEvent on the EventBus. Claude reports through a PreCompact hook, after which the host captures a memory observation, and a compact_boundary message with pre_tokens. Codex reports contextCompaction items and has neither. ACP agents report nothing. Completion reaches AlertRouter, ContextMonitor and a task-event subscriber; starting reaches only the SSE bridge.</desc>
