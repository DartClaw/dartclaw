  <g class="d0"><text class="p1" x="36" y="602">Hover a box for its role and file; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="622">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">EVENT FLOW · CompactionLifecycleEvent</text>
  <text class="title" x="24" y="58">Compaction lifecycle</text>
  <text class="lede" x="24" y="80">Two sources, one event pair. Only Claude has a pre-compact hook, so only Claude captures memory before compacting.</text>

  <g class="k-ext"><rect class="band" x="16" y="104" width="422" height="196" rx="14"/><text class="kick" x="32" y="126">CLAUDE CODE · supportsPreCompactHook: true</text></g>
  <g class="k-ext"><rect class="band" x="16" y="312" width="422" height="118" rx="14"/><text class="kick" x="32" y="334">CODEX · supportsPreCompactHook: false</text></g>

  <g class="edges">
    <g class="e main f-claude t-cch"><path d="M158,160 H260"/><text class="el" x="209" y="153" text-anchor="middle">PreCompact</text></g>
    <g class="e main f-claude t-cch"><path d="M158,188 H260"/><text class="el" x="209" y="181" text-anchor="middle">compact_boundary</text></g>
    <g class="e  f-cch t-obs"><path d="M342,204 V224"/><text class="el" x="350" y="219" text-anchor="start">capture, awaited</text></g>
    <g class="e main f-cch t-bus"><path d="M422,160 H576"/><text class="el" x="499" y="153" text-anchor="middle">CompactionStartingEvent</text></g>
    <g class="e main f-cch t-bus"><path d="M422,188 H576"/><text class="el" x="499" y="181" text-anchor="middle">CompactionCompletedEvent</text></g>
    <g class="e main f-codex t-tr"><path d="M180,362 H278"/><text class="el" x="229" y="355" text-anchor="middle">item/started</text></g>
    <g class="e main f-codex t-tr"><path d="M180,392 H278"/><text class="el" x="229" y="385" text-anchor="middle">item/completed</text></g>
    <g class="e main f-tr t-bus"><path d="M422,362 H576"/><text class="el" x="499" y="355" text-anchor="middle">CompactionStartingEvent</text></g>
    <g class="e main f-tr t-bus"><path d="M422,392 H576"/><text class="el" x="499" y="385" text-anchor="middle">CompactionCompletedEvent</text></g>
    <g class="e main f-bus t-sse"><path d="M666,152 H726"/><text class="el" x="696" y="145" text-anchor="middle">Starting</text></g>
    <g class="e main f-bus t-alert"><path d="M666,242 H726"/><text class="el" x="696" y="235" text-anchor="middle">Completed</text></g>
    <g class="e main f-bus t-mon"><path d="M666,312 H726"/><text class="el" x="696" y="305" text-anchor="middle">Completed</text></g>
    <g class="e main f-bus t-task"><path d="M666,392 H726"/><text class="el" x="696" y="385" text-anchor="middle">Completed</text></g>
  </g>

  <a href="../observability-operations-architecture.md#compaction-lifecycle"><g class="n tint k-ext" id="claude">
    <rect class="box" x="24" y="134" width="134" height="70" rx="9"/>
    <text class="name mono-name" x="36" y="157">claude</text>
    <text class="sub" x="36" y="175">PreCompact hook</text>
    <text class="mono" x="36" y="191">compact_boundary</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">claude</tspan> · external Claude Code process; the host registers a PreCompact hook (no matcher, 10 s timeout) and reads compact_boundary</text><text class="p2" x="36" y="622">The hook arrives as a control request; the host answers allow only after its observer returns, so compaction waits for the capture.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#compaction-lifecycle"><g class="n tint k-host" id="cch">
    <rect class="box" x="262" y="134" width="160" height="70" rx="9"/>
    <text class="name mono-name" x="274" y="157">ClaudeCodeHarness</text>
    <text class="sub" x="274" y="175">onCompactionStarting</text>
    <text class="sub" x="274" y="191">onCompactionCompleted</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">ClaudeCodeHarness</tspan> · callbacks wired in runtime/harness_wiring_memory.dart, for ClaudeCodeHarness only</text><text class="p2" x="36" y="622">An observer failure is logged and compaction proceeds; CompactionStartingEvent is fired in a finally, so it is sent even when the capture fails.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#compaction-lifecycle"><g class="n tint k-store" id="obs">
    <rect class="box" x="262" y="226" width="160" height="56" rx="9"/>
    <text class="name mono-name" x="274" y="245">memory_observe</text>
    <text class="sub" x="274" y="261">last 12 messages</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">memory_observe</tspan> · tail of the session, redacted, capped at 32 KiB, saved as a memory observation (caller claude:PreCompact)</text><text class="p2" x="36" y="622">Skipped when the session has no memory context or no messages. This capture is why the post-turn flush is suppressed for Claude.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#compaction-lifecycle"><g class="n tint k-ext" id="codex">
    <rect class="box" x="24" y="340" width="156" height="70" rx="9"/>
    <text class="name mono-name" x="36" y="363">codex app-server</text>
    <text class="sub" x="36" y="381">contextCompaction</text>
    <text class="sub" x="36" y="397">started, completed</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">codex app-server</tspan> · Codex reports compaction as a contextCompaction item: item/started, then item/completed</text><text class="p2" x="36" y="622">There is no pre-compact hook and no pre_tokens, so Codex relies on the post-turn flush heuristic in ContextMonitor.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#compaction-lifecycle"><g class="n tint k-host" id="tr">
    <rect class="box" x="280" y="336" width="142" height="76" rx="9"/>
    <text class="name mono-name" x="292" y="359">TurnRunner</text>
    <text class="sub" x="292" y="377">from bridge events</text>
    <g class="chip k-neu"><rect x="292" y="388" width="101" height="16" rx="8"/><text x="299" y="400">preTokens null</text></g>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">TurnRunner</tspan> · CodexHarness emits Compaction*BridgeEvent; TurnRunner turns them into bus events with trigger "auto"</text><text class="p2" x="36" y="622">Mapped in the turn event loop (turn_runner_execution_loop.dart), so only while a turn runs. summary is always null.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#contextmonitor"><g class="n ghost k-neu" id="acp">
    <rect class="box" x="24" y="452" width="398" height="56" rx="9"/>
    <text class="name mono-name" x="36" y="471">ACP agent</text>
    <g class="badge"><rect x="337" y="459" width="75" height="16" rx="8"/><text x="374" y="471">NO EVENTS</text></g>
    <text class="sub" x="36" y="487">compaction messages are dropped: no events</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">ACP agent</tspan> · acp_harness_presentation.dart ignores CompactBoundary and the Codex compaction messages</text><text class="p2" x="36" y="622">supportsPreCompactHook is false, so ContextMonitor falls back to the post-turn flush heuristic for ACP as for Codex.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#1-overview"><g class="n solid k-host" id="bus">
    <rect class="box" x="578" y="124" width="88" height="306" rx="9"/>
    <text class="name mono-name" x="590" y="147">EventBus</text>
    <text class="sub" x="590" y="165">sealed</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">EventBus</tspan> · CompactionStartingEvent and CompactionCompletedEvent, both CompactionLifecycleEvent subtypes</text><text class="p2" x="36" y="622">preTokens comes only from Claude's compact_boundary, and only when present; summary is reserved and always null.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#global-broadcast-get-apievents"><g class="n tint k-host" id="sse">
    <rect class="box" x="728" y="124" width="258" height="56" rx="9"/>
    <text class="name mono-name" x="740" y="143">EventBusSseBridge</text>
    <text class="sub" x="740" y="159">SSE compaction_starting</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">EventBusSseBridge</tspan> · broadcasts compaction_starting on /api/events with sessionId and trigger</text><text class="p2" x="36" y="622">Only the starting event is bridged; completion has no SSE frame (api/event_bus_sse_bridge.dart).</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#2-alerts"><g class="n tint k-host" id="alert">
    <rect class="box" x="728" y="214" width="258" height="56" rx="9"/>
    <text class="name mono-name" x="740" y="233">AlertRouter</text>
    <text class="sub" x="740" y="249">alert compaction, info</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">AlertRouter</tspan> · classifyAlert maps CompactionCompletedEvent to compaction / info</text><text class="p2" x="36" y="622">CompactionStartingEvent is lifecycle telemetry and not alertable.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#contextmonitor"><g class="n tint k-host" id="mon">
    <rect class="box" x="728" y="284" width="258" height="56" rx="9"/>
    <text class="name mono-name" x="740" y="303">ContextMonitor</text>
    <text class="sub" x="740" y="319">advances the flush cycle</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">ContextMonitor</tspan> · onCompactionCompleted increments the cycle counter; wired in runtime/harness_wiring.dart</text><text class="p2" x="36" y="622">shouldSkipFlush then allows one pre-compaction flush per cycle, deduplicated by a hash of the last three messages.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#compaction-lifecycle"><g class="n tint k-host" id="task">
    <rect class="box" x="728" y="354" width="258" height="76" rx="9"/>
    <text class="name mono-name" x="740" y="377">CompactionTaskEventSubscriber</text>
    <text class="sub" x="740" y="395">TaskEvent kind compaction,</text>
    <text class="sub" x="740" y="411">only if a task runs in the session</text>
    <g class="d"><text class="p1" x="36" y="602"><tspan class="b">CompactionTaskEventSubscriber</tspan> · records a compaction TaskEvent when a running task owns the session</text><text class="p2" x="36" y="622">Sessions without a running task get the bus event only (task/compaction_task_event_subscriber.dart).</text></g>
  </g></a>
  <g transform="translate(24,528)">
    <g class="tint k-ext"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">provider binary</text>
    <g class="tint k-host"><rect class="box" x="137.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="159.0" y="10">DartClaw component</text>
    <g class="tint k-store"><rect class="box" x="292.6" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="314.6" y="10">memory write</text>
    <g class="ghost k-neu"><rect class="box" x="411.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="433.0" y="10">no signal</text>
    <g class="e main"><path d="M510.8,6 H542.8"/></g><text class="lg" x="550.8" y="10">event or callback</text>
    <g class="e "><path d="M678.2,6 H710.2"/></g><text class="lg" x="718.2" y="10">call</text>
  </g>
