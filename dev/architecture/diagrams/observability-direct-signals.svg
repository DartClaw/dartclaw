  <!-- Details panel: painted first so node details (.d) draw on top -->
  <rect class="panel" x="16" y="548" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="572">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="596">Hover a box for its role and file; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="616">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">DATA FLOW · SIGNALS WITHOUT A BUS SUBSCRIBER</text>
  <text class="title" x="24" y="58">Usage, capacity and log signals</text>
  <text class="lede" x="24" y="80">Three signals with one collector each. Only runner_state returns to the EventBus.</text>

  <g class="k-neu"><rect class="band" x="16" y="104" width="968" height="126" rx="14"/><text class="kick" x="32" y="126">USAGE · PER COMPLETED TURN</text></g>
  <g class="k-neu"><rect class="band" x="16" y="244" width="968" height="126" rx="14"/><text class="kick" x="32" y="266">CAPACITY · PER RUNNER</text></g>
  <g class="k-neu"><rect class="band" x="16" y="384" width="968" height="126" rx="14"/><text class="kick" x="32" y="406">LOGS · PER RECORD</text></g>

  <g class="edges">
    <g class="e  f-tr t-ut"><path d="M222,167 H288"/><text class="el" x="256" y="161" text-anchor="middle">record()</text></g>
    <g class="e  f-ut t-jsonl"><path d="M510,167 H540 V139 H668"/><text class="el" x="548" y="133" text-anchor="start">append, rotate</text></g>
    <g class="e  f-ut t-kv"><path d="M540,167 V195 H668"/><text class="el" x="548" y="189" text-anchor="start">daily aggregate</text></g>
    <g class="e  f-ec t-ro"><path d="M222,307 H288"/><text class="el" x="256" y="301" text-anchor="middle">events</text></g>
    <g class="e  f-ro t-runners"><path d="M510,307 H540 V279 H668"/><text class="el" x="548" y="273" text-anchor="start">metrics, capacity</text></g>
    <g class="e  f-ro t-tstream"><path d="M540,307 V335 H668"/><text class="el" x="548" y="329" text-anchor="start">capacityChanges</text></g>
    <g class="e  f-lr t-ls"><path d="M222,447 H288"/><text class="el" x="256" y="441" text-anchor="middle">LogRecord</text></g>
    <g class="e  f-ls t-stderr"><path d="M510,447 H540 V419 H668"/><text class="el" x="548" y="413" text-anchor="start">every record</text></g>
    <g class="e  f-ls t-lfile"><path d="M540,447 V475 H668"/><text class="el" x="548" y="469" text-anchor="start">when logging.file</text></g>
  </g>

  <a href="../observability-operations-architecture.md#5-usage-and-token-accounting"><g class="n line k-host" id="tr">
    <rect class="box" x="32" y="132" width="190" height="70" rx="9"/>
    <text class="name mono-name" x="44" y="155">TurnRunner</text>
    <text class="sub" x="44" y="173">after each completed turn</text>
    <g class="chip k-store"><rect x="44" y="178" width="132" height="16" rx="8"/><text x="51" y="190">→ session_cost:&lt;id&gt;</text></g>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">TurnRunner</tspan> · calls UsageTracker.record(UsageEvent) unawaited, a failure only logs</text><text class="p2" x="36" y="616">turn_runner_execution_loop.dart records the turn; turn_runner_execution.dart writes the cumulative KV session_cost:&lt;sessionId&gt; itself.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#5-usage-and-token-accounting"><g class="n solid k-host" id="ut">
    <rect class="box" x="290" y="129" width="220" height="76" rx="9"/>
    <text class="name mono-name" x="302" y="152">UsageTracker</text>
    <text class="sub" x="302" y="170">record(): append, aggregate,</text>
    <text class="sub" x="302" y="186">rotate, budget log</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">UsageTracker</tspan> · four steps, each in its own try, so one failure skips only that step</text><text class="p2" x="36" y="616">observability/usage_tracker.dart. usage.budget_warning_tokens only logs a warning per record; the governance budget is separate.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#5-usage-and-token-accounting"><g class="n tint k-store" id="jsonl">
    <rect class="box" x="670" y="116" width="300" height="46" rx="9"/>
    <text class="name mono-name" x="682" y="135">usage.jsonl</text>
    <text class="sub" x="682" y="151">one line per turn; rotates at 10 MB</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">usage.jsonl</tspan> · timestamp, session_id, agent_name, token counts, token_usage_complete, duration_ms</text><text class="p2" x="36" y="616">Past usage.max_file_size_bytes it is renamed to usage.jsonl.1, replacing an earlier backup.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#5-usage-and-token-accounting"><g class="n tint k-store" id="kv">
    <rect class="box" x="670" y="172" width="300" height="46" rx="9"/>
    <text class="name mono-name" x="682" y="191">usage_daily:YYYY-MM-DD</text>
    <text class="sub" x="682" y="207">KV aggregate; /health, BudgetEnforcer</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">usage_daily:YYYY-MM-DD</tspan> · daily input and output totals, per-agent split, token_usage_complete</text><text class="p2" x="36" y="616">Holds budget_warning_posted_at once BudgetEnforcer warned, so the once-per-day warning survives a restart. Dated by server-local day.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#runner-and-capacity-observability"><g class="n line k-host" id="ec">
    <rect class="box" x="32" y="272" width="190" height="70" rx="9"/>
    <text class="name mono-name" x="44" y="295">ExecutionCoordinator</text>
    <text class="sub" x="44" y="313">lease and teardown events</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">ExecutionCoordinator</tspan> · single authority for execution allocation once governance admits a turn</text><text class="p2" x="36" y="616">Publishes ExecutionEvent: capacityChanged, acquired, released, disposed, quarantined, runnerCreated, turnSettled.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#runner-and-capacity-observability"><g class="n solid k-host" id="ro">
    <rect class="box" x="290" y="269" width="220" height="76" rx="9"/>
    <text class="name mono-name" x="302" y="292">RunnerObserver</text>
    <text class="sub" x="302" y="310">folds ExecutionEvents</text>
    <g class="chip k-host"><rect x="302" y="321" width="194" height="16" rx="8"/><text x="309" y="333">RunnerStateChangedEvent → bus</text></g>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">RunnerObserver</tspan> · fed by the coordinator stream alone; never emit lifecycle transitions from another surface</text><text class="p2" x="36" y="616">task/runner_observer.dart. A quarantined runner stays as a crashed tombstone in /api/runners until restart; disposed removes it.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#runner-and-capacity-observability"><g class="n tint k-chan" id="runners">
    <rect class="box" x="670" y="256" width="300" height="46" rx="9"/>
    <text class="name mono-name" x="682" y="275">GET /api/runners</text>
    <text class="sub" x="682" y="291">metrics and the capacity object</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">GET /api/runners</tspan> · configured, effective, active, available, queued, cached, quarantined, runnerCount, primaryActive</text><text class="p2" x="36" y="616">available = effective - active; quarantined slots reduce effective until recovery or restart; cached never adds capacity.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#task-stream-get-apitasksevents"><g class="n tint k-chan" id="tstream">
    <rect class="box" x="670" y="312" width="300" height="46" rx="9"/>
    <text class="name mono-name" x="682" y="331">GET /api/tasks/events</text>
    <text class="sub" x="682" y="347">execution_capacity, runner_state</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">GET /api/tasks/events</tspan> · execution_capacity comes straight from capacityChanges; runner_state comes from the bus event</text><text class="p2" x="36" y="616">Not every execution event reaches the stream: turnSettled updates metrics but never emits a capacity change.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#6-structured-logging"><g class="n line k-host" id="lr">
    <rect class="box" x="32" y="412" width="190" height="70" rx="9"/>
    <text class="name mono-name" x="44" y="435">Logger.root</text>
    <text class="sub" x="44" y="453">package:logging records</text>
    <g class="chip k-neu"><rect x="44" y="458" width="169" height="16" rx="8"/><text x="51" y="470">LogContext: session, turn</text></g>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">Logger.root</tspan> · every logger in the process feeds the one root stream</text><text class="p2" x="36" y="616">LogContext.runWith binds sessionId and turnId to a zone per turn, so each record is correlated.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#6-structured-logging"><g class="n tint k-host" id="ls">
    <rect class="box" x="290" y="409" width="220" height="76" rx="9"/>
    <text class="name mono-name" x="302" y="432">LogService</text>
    <text class="sub" x="302" y="450">formatter, then LogRedactor,</text>
    <text class="sub" x="302" y="466">on the finished line</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">LogService</tspan> · HumanFormatter or JsonFormatter, then LogRedactor over message, error and stack trace</text><text class="p2" x="36" y="616">logging/log_service.dart is installed by serve and by the standalone workflow lifecycle; built-in patterns plus logging.redact_patterns apply.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#6-structured-logging"><g class="n tint k-neu" id="stderr">
    <rect class="box" x="670" y="396" width="300" height="46" rx="9"/>
    <text class="name mono-name" x="682" y="415">stderr</text>
    <text class="sub" x="682" y="431">always; ANSI colour only on a terminal</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">stderr</tspan> · one line per record at logging.level (default INFO)</text><text class="p2" x="36" y="616">human format by default; logging.format: json writes one NDJSON object per record.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#6-structured-logging"><g class="n tint k-store" id="lfile">
    <rect class="box" x="670" y="452" width="300" height="46" rx="9"/>
    <text class="name mono-name" x="682" y="471">logging.file</text>
    <text class="sub" x="682" y="487">optional append sink</text>
    <g class="d"><text class="p1" x="36" y="596"><tspan class="b">logging.file</tspan> · same formatted line as stderr, appended to the configured file</text><text class="p2" x="36" y="616">Unset by default; closed and flushed on shutdown by LogService.dispose.</text></g>
  </g></a>
