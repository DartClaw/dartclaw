<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 644" width="1000" height="644" role="img" aria-labelledby="title desc">
  <title id="title">Usage, capacity and log signals</title>
  <desc id="desc">Usage, runner capacity and log records do not reach their sinks through an EventBus subscriber. TurnRunner calls UsageTracker, RunnerObserver folds ExecutionCoordinator events, and LogService listens on the root logger. RunnerObserver fires RunnerStateChangedEvent back onto the bus for the runner_state frame.</desc>
