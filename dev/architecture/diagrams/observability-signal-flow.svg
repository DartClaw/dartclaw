<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 654" width="1000" height="654" role="img" aria-labelledby="title desc">
  <title id="title">Observability signal flow</title>
  <desc id="desc">Event producers fire DartclawEvents onto the EventBus. Three collectors read it: GuardAuditSubscriber into the audit log, AlertRouter into operator channels, and the SSE bridge into the web UI. Producers that must fail closed bypass the bus and call GuardAuditLogger.writeEntry, which is awaited.</desc>
  <style>

