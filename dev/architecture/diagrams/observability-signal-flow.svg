    svg:has(#wcall:hover) .edges :is(.f-wcall,.t-wcall) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#ndjson:hover) .edges :is(.f-ndjson,.t-ndjson) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
