  <rect class="bg" width="1000" height="654"/>
  <!-- Details panel: painted first so node details (.d) draw on top -->
  <rect class="panel" x="16" y="558" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="582">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="606">Hover a box for its role and file; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="626">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">DATA FLOW · EventBus subscribers</text>
  <text class="title" x="24" y="58">Observability signal flow</text>
  <text class="lede" x="24" y="80">Each signal has one collector. Producers that must fail closed skip the bus and call writeEntry.</text>

  <g class="k-neu"><rect class="band" x="16" y="250" width="444" height="268" rx="14"/><text class="kick" x="32" y="272">AUDIT TRAIL</text></g>
  <g class="k-neu"><rect class="band" x="474" y="250" width="226" height="268" rx="14"/><text class="kick" x="490" y="272">OPERATOR ALERTS</text></g>
  <g class="k-neu"><rect class="band" x="714" y="250" width="270" height="268" rx="14"/><text class="kick" x="730" y="272">LIVE UI</text></g>

  <g class="edges">
    <g class="e main f-prod t-bus"><path d="M500,154 V176"/><text class="el" x="510" y="170" text-anchor="start">fire(event)</text></g>
    <g class="e main f-bus t-sub"><path d="M130,226 V280"/><text class="el" x="140" y="241" text-anchor="start">GuardBlockEvent, ToolPermissionDeniedEvent</text></g>
    <g class="e main f-bus t-router"><path d="M620,226 V280"/><text class="el" x="628" y="241" text-anchor="start">every event</text></g>
    <g class="e main f-bus t-bridge"><path d="M850,226 V280"/><text class="el" x="858" y="241" text-anchor="start">selected events</text></g>
    <g class="e  f-sub t-logger"><path d="M130,332 V366"/><text class="el" x="140" y="354" text-anchor="start">logVerdict, logPermissionDenied</text></g>
    <g class="e  f-wcall t-logger"><path d="M278,393 H230"/><text class="el" x="254" y="386" text-anchor="middle">awaited</text></g>
    <g class="e  f-logger t-ndjson"><path d="M130,418 V452"/><text class="el" x="140" y="440" text-anchor="start">append</text></g>
    <g class="e  f-router t-adapter"><path d="M620,332 V366"/><text class="el" x="628" y="354" text-anchor="start">deliver</text></g>
    <g class="e  f-adapter t-chan"><path d="M620,418 V452"/><text class="el" x="628" y="440" text-anchor="start">sendMessage</text></g>
    <g class="e  f-bridge t-bcast"><path d="M850,332 V366"/><text class="el" x="858" y="354" text-anchor="start">broadcast(name, data)</text></g>
    <g class="e  f-bcast t-sse"><path d="M850,418 V452"/><text class="el" x="858" y="440" text-anchor="start">event: &lt;name&gt;</text></g>
  </g>

  <a href="../observability-operations-architecture.md#1-overview"><g class="n line k-host" id="prod">
    <rect class="box" x="24" y="106" width="952" height="48" rx="9"/>
    <text class="name" x="36" y="125">event producers</text>
    <text class="sub" x="36" y="141">guards, tasks, workflows, credential and container health, governance, scheduler, RunnerObserver</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">event producers</tspan> · every DartclawEvent subtype is fired by exactly one owner of that fact</text><text class="p2" x="36" y="626">Credential health, capacity lifecycle and alert classification each have one writer (design rule 3), so two paths cannot disagree.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#1-overview"><g class="n solid k-host" id="bus">
    <rect class="box" x="24" y="178" width="952" height="48" rx="9"/>
    <text class="name mono-name" x="36" y="197">EventBus</text>
    <text class="sub" x="36" y="213">sealed DartclawEvent stream (dartclaw_core); fire() isolates subscriber exceptions</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">EventBus</tspan> · one broadcast stream; usage, logging and capacity do not read it</text><text class="p2" x="36" y="626">fire() runs the add under runZonedGuarded, so a throwing subscriber is logged and never fails the publisher.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#4-audit-logging"><g class="n tint k-host" id="sub">
    <rect class="box" x="32" y="282" width="196" height="50" rx="9"/>
    <text class="name mono-name" x="44" y="301">GuardAuditSubscriber</text>
    <text class="sub" x="44" y="317">bridges two bus events</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">GuardAuditSubscriber</tspan> · GuardBlockEvent and ToolPermissionDeniedEvent become audit entries</text><text class="p2" x="36" y="626">Lives in dartclaw_runtime so the kernel logger stays free of the bus (audit/guard_audit_subscriber.dart).</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#guardauditlogger"><g class="n tint k-host" id="logger">
    <rect class="box" x="32" y="368" width="196" height="50" rx="9"/>
    <text class="name mono-name" x="44" y="387">GuardAuditLogger</text>
    <text class="sub" x="44" y="403">one serialized write chain</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">GuardAuditLogger</tspan> · logs at INFO, WARNING or SEVERE and appends an NDJSON line to the day partition</text><text class="p2" x="36" y="626">dartclaw_kernel guard_audit.dart: appends share one _pendingWrite future; logVerdict is unawaited, writeEntry awaited.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#guardauditlogger"><g class="n tint k-sec" id="wcall">
    <rect class="box" x="278" y="368" width="170" height="50" rx="9"/>
    <text class="name" x="290" y="387">writeEntry callers</text>
    <text class="sub" x="290" y="403">fail closed on error</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">writeEntry callers</tspan> · egress, knowledge writes, review and run-approval gates, refusal audits, Slack webhook, database egress</text><text class="p2" x="36" y="626">They await writeEntry and refuse the action when the append fails, so they cannot rely on the bus path.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#partitions-and-retention"><g class="n tint k-store" id="ndjson">
    <rect class="box" x="32" y="454" width="196" height="50" rx="9"/>
    <text class="name mono-name" x="44" y="473">audit-YYYY-MM-DD</text>
    <text class="sub" x="44" y="489">.ndjson, one file per day</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">audit-YYYY-MM-DD</tspan> · date-partitioned files in the data directory; AuditLogReader serves them to /health-dashboard</text><text class="p2" x="36" y="626">Retention guard_audit.max_retention_days (default 30, 0 keeps all) is applied by the session-maintenance job.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#2-alerts"><g class="n tint k-host" id="router">
    <rect class="box" x="490" y="282" width="194" height="50" rx="9"/>
    <text class="name mono-name" x="502" y="301">AlertRouter</text>
    <text class="sub" x="502" y="317">classify, route, throttle</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">AlertRouter</tspan> · subscribes to every DartclawEvent; off by default (alerts.enabled: false)</text><text class="p2" x="36" y="626">Reconfigurable on alerts.*; the pipeline is the alert pipeline figure (alerts/alert_router.dart).</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#routing-formatting-throttling"><g class="n tint k-host" id="adapter">
    <rect class="box" x="490" y="368" width="194" height="50" rx="9"/>
    <text class="name mono-name" x="502" y="387">AlertDeliveryAdapter</text>
    <text class="sub" x="502" y="403">best effort, no retry</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">AlertDeliveryAdapter</tspan> · resolves an AlertTarget to a Channel and calls sendMessage</text><text class="p2" x="36" y="626">An unknown channel logs a warning and a send failure logs an error; nothing is thrown or retried.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#routing-formatting-throttling"><g class="n tint k-chan" id="chan">
    <rect class="box" x="490" y="454" width="194" height="50" rx="9"/>
    <text class="name" x="502" y="473">Channel</text>
    <text class="sub" x="502" y="489">any registered channel</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">Channel</tspan> · any registered channel, looked up by target.channel</text><text class="p2" x="36" y="626">Alerts reach the operator through the same channel infrastructure as user messages.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#global-broadcast-get-apievents"><g class="n tint k-host" id="bridge">
    <rect class="box" x="730" y="282" width="238" height="50" rx="9"/>
    <text class="name mono-name" x="742" y="301">EventBusSseBridge</text>
    <text class="sub" x="742" y="317">and task_sse_routes subscribe too</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">EventBusSseBridge</tspan> · bus events become named SSE frames: loop_detected, task_review_ready, compaction_starting, conversation_changed</text><text class="p2" x="36" y="626">Excludes EmergencyStopEvent: that frame stays with EmergencyStopHandler so a stop is never sent twice.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#global-broadcast-get-apievents"><g class="n tint k-host" id="bcast">
    <rect class="box" x="730" y="368" width="238" height="50" rx="9"/>
    <text class="name mono-name" x="742" y="387">SseBroadcast</text>
    <text class="sub" x="742" y="403">named events, all clients</text>
    <g class="chip k-host"><rect x="882" y="375" width="76" height="16" rx="8"/><text x="889" y="387">← emitters</text></g>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">SseBroadcast</tspan> · fans event: &lt;name&gt; frames to every client and drops closed ones</text><text class="p2" x="36" y="626">Runtime emitters (governance, emergency stop, TurnRunner, DeliveryService) call it directly. It exists only when the primary lane is on.</text></g>
  </g></a>
  <a href="../observability-operations-architecture.md#7-real-time-streaming-sse"><g class="n tint k-chan" id="sse">
    <rect class="box" x="730" y="454" width="238" height="50" rx="9"/>
    <text class="name" x="742" y="473">SSE endpoints</text>
    <text class="sub" x="742" y="489">/api/events, /api/tasks/events</text>
    <g class="d"><text class="p1" x="36" y="606"><tspan class="b">SSE endpoints</tspan> · browser EventSource clients of the web UI</text><text class="p2" x="36" y="626">/api/events answers 503 without SseBroadcast; the five streams are in the SSE topology figure.</text></g>
  </g></a>
  <g transform="translate(24,530)">
    <g class="tint k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">DartClaw component</text>
    <g class="tint k-sec"><rect class="box" x="155.60000000000002" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="177.60000000000002" y="10">fail-closed producer</text>
    <g class="tint k-store"><rect class="box" x="323.6" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="345.6" y="10">file</text>
    <g class="tint k-chan"><rect class="box" x="392.40000000000003" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="414.40000000000003" y="10">outside the host</text>
    <g class="e main"><path d="M535.6,6 H567.6"/></g><text class="lg" x="575.6" y="10">bus fan-out</text>
    <g class="e "><path d="M665.8,6 H697.8"/></g><text class="lg" x="705.8" y="10">call or write</text>
  </g>
</svg>
