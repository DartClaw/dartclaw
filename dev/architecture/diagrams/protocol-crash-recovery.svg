  <rect class="panel" x="16" y="474" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="498">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="522">Hover a box for the rule behind it; its transitions light up. Click a box to open its section.</text><text class="p2" x="36" y="542">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">STATE MACHINE · BaseHarness.WorkerState</text>
  <text class="title" x="24" y="58">Worker crash recovery</text>
  <text class="lede" x="24" y="80">A crashed worker is restarted only by the next turn, after a backoff, and the harness gives up at the sixth crash in a row.</text>

  <g class="k-host"><rect class="band" x="16" y="92" width="968" height="178" rx="14"/><text class="kick" x="32" y="114">WORKER PROCESS · BaseHarness</text></g>
  <g class="k-host"><rect class="band" x="16" y="284" width="676" height="140" rx="14"/><text class="kick" x="32" y="306">PER PROVIDER · WHAT A RESTART RESTORES</text></g>

  <g class="edges">
    <g class="e  f-stopped t-idle"><path d="M148,172 H214"/><text class="el" x="181" y="166" text-anchor="middle">start()</text></g>
    <g class="e  f-idle t-stopped"><path d="M216,194 H150"/><text class="el" x="183" y="210" text-anchor="middle">stop()</text></g>
    <g class="e  f-idle t-busy"><path d="M340,172 H406"/><text class="el" x="373" y="166" text-anchor="middle">turn()</text></g>
    <g class="e  f-busy t-idle"><path d="M408,194 H342"/><text class="el" x="375" y="210" text-anchor="middle">result</text></g>
    <g class="e bad f-busy t-crashed"><path d="M546,172 H598"/><text class="el" x="572" y="166" text-anchor="middle">exit</text></g>
    <g class="e bad f-idle t-crashed"><path d="M278,150 V128 H670 V148"/><text class="el" x="474" y="121" text-anchor="middle">process exit or stream fault, also while idle</text></g>
    <g class="e bad f-crashed t-dead"><path d="M740,182 H828"/><text class="el" x="784" y="176" text-anchor="middle">crashCount &gt; 5</text></g>
    <g class="e main f-crashed t-idle"><path d="M670,214 V246 H278 V216"/><text class="el" x="474" y="240" text-anchor="middle">next turn(): recoverFromCrash waits 5 × 2^(n−1) s, restarts</text></g>
    <g class="e  f-crashed t-claude t-codex t-acp"><path d="M560,246 V282"/><text class="el" x="568" y="268" text-anchor="start">restart</text></g>
    <g class="e bad f-crashed t-unconf"><path d="M720,214 V314"/><text class="el" x="728" y="268" text-anchor="start">exit unconfirmed</text></g>
  </g>

  <a href="../control-protocol.md#7-crash-recovery-and-errors"><g class="n tint k-neu" id="stopped">
    <rect class="box" x="24" y="150" width="124" height="64" rx="9"/>
    <text class="name mono-name" x="36" y="173">stopped</text>
    <text class="sub" x="36" y="191">initial,</text>
    <text class="sub" x="36" y="207">after stop()</text>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">stopped</tspan> · initial state and the end of stop(); turn() on a stopped harness starts it first</text><text class="p2" x="36" y="542">start() spawns the binary and runs the initialize handshake, which must be answered within 10 seconds.</text></g>
  </g></a>
  <a href="../control-protocol.md#7-crash-recovery-and-errors"><g class="n tint k-host" id="idle">
    <rect class="box" x="216" y="150" width="124" height="64" rx="9"/>
    <text class="name mono-name" x="228" y="173">idle</text>
    <text class="sub" x="228" y="191">ready for a turn</text>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">idle</tspan> · process is up and handshaken</text><text class="p2" x="36" y="542">Mutating lifecycle calls (start, stop, restart) serialize through SequentialLock.withLock.</text></g>
  </g></a>
  <a href="../control-protocol.md#7-crash-recovery-and-errors"><g class="n tint k-host" id="busy">
    <rect class="box" x="408" y="150" width="136" height="64" rx="9"/>
    <text class="name mono-name" x="420" y="173">busy</text>
    <text class="sub" x="420" y="191">one turn running</text>
    <g class="chip k-neu"><rect x="464" y="161" width="70" height="16" rx="8"/><text x="471" y="173">→ stopped</text></g>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">busy</tspan> · a turn is in flight; the 16 MiB per-turn output budget counts from entering busy</text><text class="p2" x="36" y="542">A turn timeout (budget + 60 s backstop) and cancel() stop the process: busy goes to stopped, not crashed.</text></g>
  </g></a>
  <a href="../control-protocol.md#7-crash-recovery-and-errors"><g class="n solid k-sec" id="crashed">
    <rect class="box" x="600" y="150" width="140" height="64" rx="9"/>
    <text class="name mono-name" x="612" y="173">crashed</text>
    <text class="sub" x="612" y="191">exit not requested</text>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">crashed</tspan> · handleUnexpectedProcessExit: crashCount++ and the pending turn completes with the error or the recorded stream fault</text><text class="p2" x="36" y="542">The exit watcher is guarded by _spawnGeneration, so a stale handler cannot affect a newer process.</text></g>
  </g></a>
  <a href="../control-protocol.md#7-crash-recovery-and-errors"><g class="n tint k-sec" id="dead">
    <rect class="box" x="830" y="150" width="146" height="64" rx="9"/>
    <text class="name mono-name" x="842" y="173">StateError</text>
    <text class="sub" x="842" y="191">max retries exceeded</text>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">StateError</tspan> · recoverFromCrash throws "Harness unavailable: max retries exceeded" once crashCount &gt; maxRetries (5)</text><text class="p2" x="36" y="542">A turn that completes resets crashCount to 0. Claude and Codex harnesses default to maxRetries 5, baseBackoff 5 s.</text></g>
  </g></a>
  <a href="../control-protocol.md#3-claude-code-protocol"><g class="n tint k-host" id="claude">
    <rect class="box" x="32" y="316" width="190" height="96" rx="9"/>
    <text class="name mono-name" x="44" y="339">Claude</text>
    <text class="sub" x="44" y="357">cold process:</text>
    <text class="sub" x="44" y="373">bounded history re-injected</text>
    <text class="sub" x="44" y="389">by the next turn</text>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">Claude</tspan> · the process was cold: _startWithCleanup restarts it and the turn replays bounded persisted history</text><text class="p2" x="36" y="542">A conversation or spawn-flag change restarts it anyway (section 2.5).</text></g>
  </g></a>
  <a href="../control-protocol.md#4-codex-protocol"><g class="n tint k-host" id="codex">
    <rect class="box" x="234" y="316" width="226" height="96" rx="9"/>
    <text class="name mono-name" x="246" y="339">Codex</text>
    <text class="sub" x="246" y="357">cached thread ids cleared,</text>
    <text class="sub" x="246" y="373">handshake repeated, new thread,</text>
    <text class="sub" x="246" y="389">history in previousResponseItems</text>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">Codex</tspan> · thread/start opens a new thread; an explicit durable session uses thread/resume instead</text><text class="p2" x="36" y="542">recoverFromCrash is retried in a loop until the harness is idle or throws StateError.</text></g>
  </g></a>
  <a href="../control-protocol.md#5-acp"><g class="n ghost k-host" id="acp">
    <rect class="box" x="472" y="316" width="204" height="96" rx="9"/>
    <text class="name mono-name" x="484" y="339">ACP</text>
    <text class="sub" x="484" y="357">no in-place restart:</text>
    <text class="sub" x="484" y="373">the worker stays crashed and</text>
    <text class="sub" x="484" y="389">the coordinator discards it</text>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">ACP</tspan> · AcpHarness does not extend BaseHarness; a process exit fails the active turn and leaves the worker crashed</text><text class="p2" x="36" y="542">ExecutionCoordinator reuses a worker only when its harness state is idle.</text></g>
  </g></a>
  <a href="../control-protocol.md#7-crash-recovery-and-errors"><g class="n tint k-sec" id="unconf">
    <rect class="box" x="708" y="316" width="268" height="96" rx="9"/>
    <text class="name mono-name" x="720" y="339">Root exit unconfirmed</text>
    <text class="sub" x="720" y="357">no restart, no replacement:</text>
    <text class="sub" x="720" y="373">the coordinator quarantines the permit,</text>
    <text class="sub" x="720" y="389">effective capacity falls (ADR-058)</text>
    <g class="d"><text class="p1" x="36" y="522"><tspan class="b">Root exit unconfirmed</tspan> · recoverFromCrash refuses while the previous process is still owned; the coordinator refuses a replacement too</text><text class="p2" x="36" y="542">Exit is confirmed by SIGTERM then SIGKILL after a 2 s grace on POSIX; other platforms hard-terminate the managed root.</text></g>
  </g></a>
  <g transform="translate(24,448)">
    <g class="solid k-sec"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">crashed</text>
    <g class="tint k-host"><rect class="box" x="87.4" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="109.4" y="10">worker state or provider</text>
    <g class="tint k-sec"><rect class="box" x="280.20000000000005" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="302.20000000000005" y="10">failure</text>
    <g class="e main"><path d="M367.6,6 H399.6"/></g><text class="lg" x="407.6" y="10">recovery</text>
    <g class="e bad"><path d="M479.20000000000005,6 H511.20000000000005"/></g><text class="lg" x="519.2" y="10">crash or refusal</text>
  </g>
</svg>
