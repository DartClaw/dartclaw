<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc">
  <title id="title">Worker crash recovery</title>
  <desc id="desc">A harness worker is stopped, idle or busy. An exit nobody asked for, or an output stream fault, makes it crashed and fails the pending turn. The next turn() calls recoverFromCrash, which waits base times two to the power of crashCount minus one (5, 10, 20, 40, 80 seconds) and restarts, or throws StateError once crashCount exceeds 5. What a restart restores differs per provider, and an unconfirmed root exit blocks any restart.</desc>
