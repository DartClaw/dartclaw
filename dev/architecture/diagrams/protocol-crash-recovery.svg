    svg:has(#acp:hover) .edges :is(.f-acp,.t-acp) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#unconf:hover) .edges :is(.f-unconf,.t-unconf) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
  </style>
