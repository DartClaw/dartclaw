    <g class="e both f-claudeH t-claudeP"><path d="M642,199 H758"/><text class="el" x="700" y="193" text-anchor="middle">stream-json</text></g>
    <g class="e both f-codexH t-codexP"><path d="M642,293 H758"/><text class="el" x="700" y="287" text-anchor="middle">JSON-RPC</text></g>
    <g class="e both f-acpH t-acpP"><path d="M642,387 H758"/><text class="el" x="700" y="381" text-anchor="middle">JSON-RPC</text></g>
    <g class="e join f-claudeP t-mcp"><path d="M918,199 H962 V478 H940"/></g>
    <g class="e  f-codexP t-mcp"><path d="M918,293 H940 V514"/></g>
  </g>

  <a href="../control-protocol.md#63-reserve-execute-settle"><g class="n tint k-host" id="tm">
    <rect class="box" x="24" y="150" width="188" height="60" rx="9"/>
    <text class="name mono-name" x="36" y="173">TurnManager</text>
    <text class="sub" x="36" y="191">reserveTurn, executeTurn</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">TurnManager</tspan> · facade over the coordinator: reserve, execute, cancel and outcome lookup across runners</text><text class="p2" x="36" y="640">dartclaw_runtime/lib/src/turn_manager.dart. Same-session reservations run one at a time (SessionMutationCoordinator).</text></g>
  </g></a>
  <a href="../control-protocol.md#62-execution-allocation"><g class="n tint k-host" id="ec">
    <rect class="box" x="24" y="236" width="188" height="60" rx="9"/>
    <text class="name mono-name" x="36" y="259">ExecutionCoordinator</text>
    <text class="sub" x="36" y="277">lanes, pool_size, leases</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">ExecutionCoordinator</tspan> · sole post-governance allocator: lane, capacity permit, worker reuse, replacement, quarantine</text><text class="p2" x="36" y="640">dartclaw_runtime/lib/src/execution_coordinator.dart. Callers never inspect provider identity.</text></g>
  </g></a>
  <a href="../control-protocol.md#63-reserve-execute-settle"><g class="n tint k-host" id="tr">
    <rect class="box" x="24" y="322" width="188" height="60" rx="9"/>
    <text class="name mono-name" x="36" y="345">TurnRunner</text>
    <text class="sub" x="36" y="363">one active turn per runner</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">TurnRunner</tspan> · one harness's turn engine: guards, prompt, event stream, usage, persistence, limits, cancel</text><text class="p2" x="36" y="640">dartclaw_runtime/lib/src/turn_runner*.dart. A second concurrent turn on one runner is refused with BusyTurnException.</text></g>
  </g></a>
  <a href="../control-protocol.md#21-the-agentharness-contract"><g class="n solid k-host" id="ah">
    <rect class="box" x="258" y="158" width="124" height="270" rx="9"/>
    <text class="name mono-name" x="270" y="181">AgentHarness</text>
    <text class="sub" x="270" y="199">the contract:</text>
    <text class="sub" x="270" y="215"></text>
    <text class="sub" x="270" y="231">turn()</text>
    <text class="sub" x="270" y="247">cancel()</text>
    <text class="sub" x="270" y="263">stop()</text>
    <text class="sub" x="270" y="279">events stream</text>
    <text class="sub" x="270" y="295"></text>
    <text class="sub" x="270" y="311">capability</text>
    <text class="sub" x="270" y="327">getters</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">AgentHarness</tspan> · provider-neutral: start, turn(), cancel, stop, an event stream and capability getters that default to the safe answer</text><text class="p2" x="36" y="640">dartclaw_core/lib/src/harness/agent_harness.dart. Callers read capabilities and never branch on provider identity.</text></g>
  </g></a>
  <a href="../control-protocol.md#3-claude-code-protocol"><g class="n tint k-host" id="claudeH">
    <rect class="box" x="422" y="158" width="218" height="82" rx="9"/>
    <text class="name mono-name" x="434" y="181">ClaudeCodeHarness</text>
    <g class="badge"><rect x="583" y="169" width="47" height="16" rx="8"/><text x="606" y="181">JSONL</text></g>
    <text class="sub" x="434" y="199">ClaudeProtocolAdapter</text>
    <text class="sub" x="434" y="215">extends BaseHarness</text>
    <text class="sub" x="434" y="231">PreToolUse hook callbacks</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">ClaudeCodeHarness</tspan> · one long-lived claude process; per-turn changes to cwd, model, effort or schema restart it</text><text class="p2" x="36" y="640">dartclaw_core/lib/src/harness/claude_code_harness*.dart. BaseHarness adds the lifecycle lock, crash backoff and bounded stdout/stderr.</text></g>
  </g></a>
  <a href="../control-protocol.md#4-codex-protocol"><g class="n tint k-host" id="codexH">
    <rect class="box" x="422" y="252" width="218" height="82" rx="9"/>
    <text class="name mono-name" x="434" y="275">CodexHarness</text>
    <g class="badge"><rect x="562" y="263" width="68" height="16" rx="8"/><text x="596" y="275">JSON-RPC</text></g>
    <text class="sub" x="434" y="293">CodexProtocolAdapter</text>
    <text class="sub" x="434" y="309">extends BaseHarness</text>
    <text class="sub" x="434" y="325">requestApproval replies</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">CodexHarness</tspan> · one long-lived codex app-server; one thread per DartClaw session, opened lazily</text><text class="p2" x="36" y="640">dartclaw_core/lib/src/harness/codex_harness.dart. Approval requests are the only interception point; there is no hook system.</text></g>
  </g></a>
  <a href="../control-protocol.md#5-acp"><g class="n tint k-host" id="acpH">
    <rect class="box" x="422" y="346" width="218" height="82" rx="9"/>
    <text class="name mono-name" x="434" y="369">AcpHarness</text>
    <g class="badge"><rect x="562" y="357" width="68" height="16" rx="8"/><text x="596" y="369">JSON-RPC</text></g>
    <text class="sub" x="434" y="387">AcpProtocolAdapter</text>
    <text class="sub" x="434" y="403">extends AgentHarness only</text>
    <text class="sub" x="434" y="419">fs/* reverse calls</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">AcpHarness</tspan> · one long-lived ACP agent; one ACP session per turn, host execution only</text><text class="p2" x="36" y="640">dartclaw_acp/lib/src/acp_harness.dart. No BaseHarness: a process exit fails the turn and the coordinator discards the worker.</text></g>
  </g></a>
  <a href="../control-protocol.md#31-spawn"><g class="n tint k-ext" id="claudeP">
    <rect class="box" x="760" y="158" width="156" height="82" rx="9"/>
    <text class="name mono-name" x="772" y="181">claude</text>
    <text class="sub" x="772" y="199">claude --print</text>
    <text class="sub" x="772" y="215">--input-format</text>
    <text class="sub" x="772" y="231">stream-json</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">claude</tspan> · the published claude CLI, long-lived, one per harness</text><text class="p2" x="36" y="640">Spawned on the host or through docker exec -i into a hardened container; stdio works for both.</text></g>
  </g></a>
  <a href="../control-protocol.md#41-spawn-and-handshake"><g class="n tint k-ext" id="codexP">
    <rect class="box" x="760" y="252" width="156" height="82" rx="9"/>
    <text class="name mono-name" x="772" y="275">codex app-server</text>
    <text class="sub" x="772" y="293">one thread per</text>
    <text class="sub" x="772" y="309">DartClaw session</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">codex app-server</tspan> · codex app-server, long-lived, JSON-RPC 2.0-like messages as JSONL</text><text class="p2" x="36" y="640">DartClaw never passes --yolo; the configured approval policy decides which operations reach the host.</text></g>
  </g></a>
  <a href="../control-protocol.md#5-acp"><g class="n ghost k-ext" id="acpP">
    <rect class="box" x="760" y="346" width="156" height="82" rx="9"/>
    <text class="name mono-name" x="772" y="369">ACP agent</text>
    <text class="sub" x="772" y="387">configured binary,</text>
    <text class="sub" x="772" y="403">for example goose acp</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">ACP agent</tspan> · any ACP agent that advertises and honors host fs capabilities, run on the host</text><text class="p2" x="36" y="640">Relay and unverified agents are unavailable: no container boundary is mediated for an ACP client.</text></g>
  </g></a>
  <a href="../control-protocol.md#8-mcp-integration"><g class="n tint k-host" id="mcp">
    <rect class="box" x="760" y="516" width="208" height="44" rx="9"/>
    <text class="name mono-name" x="772" y="535">McpProtocolHandler</text>
    <text class="sub" x="772" y="551">POST /mcp, Streamable HTTP</text>
    <g class="d"><text class="p1" x="36" y="620"><tspan class="b">McpProtocolHandler</tspan> · tool server for harnesses: memory, knowledge graph, sessions, tasks, workflows, web, search</text><text class="p2" x="36" y="640">dartclaw_runtime/lib/src/mcp/. Every call is guarded and audited once at the dispatch seam; bearer or container bridge identifies the caller.</text></g>
  </g></a>
