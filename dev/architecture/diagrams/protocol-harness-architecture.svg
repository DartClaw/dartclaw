<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" width="1000" height="668" role="img" aria-labelledby="title desc">
  <title id="title">Harness architecture</title>
  <desc id="desc">The turn engine in the Dart host (TurnManager, ExecutionCoordinator, TurnRunner) calls one AgentHarness contract. ClaudeCodeHarness, CodexHarness and AcpHarness each spawn a provider binary over stdio with its own wire protocol, and route every tool call through the GuardChain. Claude and Codex call back into the host /mcp endpoint.</desc>
