  <g class="d0"><text class="p1" x="36" y="620">Hover a box for its role and file; its connections light up. Click a box to open its section.</text><text class="p2" x="36" y="640">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">C4 · LEVEL 3 · TURN ENGINE AND HARNESSES</text>
  <text class="title" x="24" y="58">Harness architecture</text>
  <text class="lede" x="24" y="80">TurnRunner drives every provider through one AgentHarness contract; only the adapters know a wire format.</text>

  <g class="k-host"><rect class="band" x="16" y="100" width="656" height="372" rx="14"/><text class="kick" x="32" y="122">DART HOST PROCESS · dartclaw serve</text></g>
  <g class="k-sec"><rect class="band inner" x="406" y="126" width="250" height="332" rx="10"/><text class="kick" x="422" y="148">EVERY TOOL CALL → GuardChain</text></g>
  <g class="k-ext"><rect class="band" x="744" y="100" width="240" height="372" rx="14"/><text class="kick" x="760" y="122">PROVIDER PROCESSES · stdio</text></g>
  <g class="k-host"><rect class="band" x="744" y="488" width="240" height="78" rx="14"/><text class="kick" x="760" y="510">DART HOST PROCESS · /mcp</text></g>
  <text class="el" x="934" y="483" text-anchor="end">tools/call over HTTP</text>

  <g class="edges">
    <g class="e  f-tm t-ec"><path d="M118,210 V234"/><text class="el" x="126" y="227" text-anchor="start">acquire</text></g>
    <g class="e  f-ec t-tr"><path d="M118,296 V320"/><text class="el" x="126" y="313" text-anchor="start">lease.runner</text></g>
    <g class="e main f-tr t-ah"><path d="M212,352 H256"/><text class="el" x="214" y="346" text-anchor="start">turn()</text></g>
    <g class="e join f-ah t-claudeH"><path d="M382,199 H422"/></g>
    <g class="e join f-ah t-codexH"><path d="M382,293 H422"/></g>
