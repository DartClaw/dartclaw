    <g class="tint k-sec"><rect class="box" x="230.60000000000002" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="252.60000000000002" y="10">failure</text>
    <g class="e "><path d="M318.0,6 H350.0"/></g><text class="lg" x="358.0" y="10">step</text>
