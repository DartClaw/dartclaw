  <text class="lg" x="24" y="732" text-anchor="start">Step circle colour is the callee: red guard, green adapter, orange provider.</text>

  <g class="edges">
    <g class="e f-proc t-ad"><title>Registered at initialize with no matcher, so every tool call asks. The hook cwd is merged into the tool input so path guards resolve relative paths.</title><path d="M140,212 H478"/><g class="step k-host"><circle cx="157" cy="200" r="9.5"/><text x="157" y="204">1</text></g><text class="ml" x="172" y="205">control_request: hook_callback<tspan class="ms" dx="9">PreToolUse, tool_name, tool_input, cwd</tspan></text></g>
    <g class="e f-ad t-gc"><title>ClaudeProtocolAdapter.mapToolName maps the provider name; rawProviderToolName keeps the original for audit.</title><path d="M480,242 H838"/><g class="step k-sec"><circle cx="497" cy="230" r="9.5"/><text x="497" y="234">2</text></g><text class="ml" x="512" y="235">evaluateBeforeToolCall<tspan class="ms" dx="9">CanonicalTool.stableName, else claude:&lt;name&gt;</tspan></text></g>
    <g class="e dash f-gc t-ad"><title>A block, or any exception during evaluation, answers deny.</title><path d="M840,272 H482"/><g class="step k-host"><circle cx="497" cy="260" r="9.5"/><text x="497" y="264">3</text></g><text class="ml" x="512" y="265">pass, warn or block<tspan class="ms" dx="9">a guard error blocks, or warns under guards.fail_open</tspan></text></g>
    <g class="e dash f-ad t-proc"><title>On allow, ANTHROPIC_API_KEY and CLAUDE_CODE_OAUTH_TOKEN are removed from tool_input.env and the reply carries updatedInput instead of a decision.</title><path d="M480,302 H142"/><g class="step k-ext"><circle cx="157" cy="290" r="9.5"/><text x="157" y="294">4</text></g><text class="ml" x="172" y="295">control_response<tspan class="ms" dx="9">permissionDecision allow or deny; updatedInput when key env removed</tspan></text></g>
    <g class="e f-proc t-ad"><title>A JSON-RPC server request the host must answer. Unsupported or malformed requests get a terminal fail-closed reply so the turn is never held.</title><path d="M140,386 H478"/><g class="step k-host"><circle cx="157" cy="374" r="9.5"/><text x="157" y="378">1</text></g><text class="ml" x="172" y="379">item/commandExecution/requestApproval<tspan class="ms" dx="9">also item/fileChange/requestApproval, MCP elicitation</tspan></text></g>
    <g class="e f-ad t-gc"><title>Relative shell paths resolve against the provider-supplied cwd; tool names map to canonical names, else codex:&lt;name&gt;.</title><path d="M480,416 H838"/><g class="step k-sec"><circle cx="497" cy="404" r="9.5"/><text x="497" y="408">2</text></g><text class="ml" x="512" y="409">evaluateBeforeToolCall<tspan class="ms" dx="9">OPENAI and CODEX keys stripped; one call per file change</tspan></text></g>
    <g class="e dash f-gc t-ad"><title>Every operation in a file-change batch is evaluated; the first block declines the whole request.</title><path d="M840,446 H482"/><g class="step k-host"><circle cx="497" cy="434" r="9.5"/><text x="497" y="438">3</text></g><text class="ml" x="512" y="439">pass, warn or block<tspan class="ms" dx="9">a guard error blocks, or warns under guards.fail_open</tspan></text></g>
    <g class="e dash f-ad t-proc"><title>On a web turn with approval: on-request, an allow waits up to 5 minutes for the operator before the reply is written.</title><path d="M480,476 H142"/><g class="step k-ext"><circle cx="157" cy="464" r="9.5"/><text x="157" y="468">4</text></g><text class="ml" x="172" y="469">JSON-RPC result<tspan class="ms" dx="9">decision: accept, decline or cancel; operator turn waits up to 5 min</tspan></text></g>
    <g class="e f-proc t-ad"><title>JSON-RPC requests from the agent. Outside an active host turn they are rejected with -32600.</title><path d="M140,560 H478"/><g class="step k-host"><circle cx="157" cy="548" r="9.5"/><text x="157" y="552">1</text></g><text class="ml" x="172" y="553">fs/read_text_file, fs/write_text_file<tspan class="ms" dx="9">and session/request_permission</tspan></text></g>
    <g class="e f-ad t-gc"><title>The path is resolved through symlinks and must stay inside the workspace root, else -32600. session/request_permission evaluates the request's operation as the tool name.</title><path d="M480,590 H838"/><g class="step k-sec"><circle cx="497" cy="578" r="9.5"/><text x="497" y="582">2</text></g><text class="ml" x="512" y="583">evaluateBeforeToolCall<tspan class="ms" dx="9">file_read or file_write; raw name is the method</tspan></text></g>
    <g class="e dash f-gc t-ad"><title>For session/request_permission an evaluation error answers granted: false.</title><path d="M840,620 H482"/><g class="step k-host"><circle cx="497" cy="608" r="9.5"/><text x="497" y="612">3</text></g><text class="ml" x="512" y="613">pass, warn or block<tspan class="ms" dx="9">a guard error blocks, or warns under guards.fail_open</tspan></text></g>
    <g class="e dash f-ad t-proc"><title>A block is a noAccess result, not a JSON-RPC error; granted true or false answers a permission request.</title><path d="M480,650 H142"/><g class="step k-ext"><circle cx="157" cy="638" r="9.5"/><text x="157" y="642">4</text></g><text class="ml" x="172" y="643">JSON-RPC result<tspan class="ms" dx="9">{content} or {ok}; {noAccess, reason} on block</tspan></text></g>
  </g>

  <a href="../control-protocol.md#1-overview"><g class="n tint k-ext" id="proc">
    <title>Provider process. The provider binary asks the host before running a tool; it never runs one the host has not answered.</title>
    <rect class="box" x="45" y="100" width="190" height="48" rx="9"/>
    <text class="name" x="57" y="119">Provider process</text>
    <text class="sub" x="57" y="135">claude, codex, ACP agent</text>
  </g></a>
  <a href="../control-protocol.md#35-tool-approval-chain"><g class="n tint k-host" id="ad">
    <title>Harness and adapter. Translates the wire request into a canonical tool name and input, evaluates the chain, and answers in the provider's own shape.</title>
    <rect class="box" x="380" y="100" width="200" height="48" rx="9"/>
    <text class="name" x="392" y="119">Harness and adapter</text>
    <text class="sub" x="392" y="135">ProtocolAdapter per provider</text>
  </g></a>
  <a href="../control-protocol.md#35-tool-approval-chain"><g class="n solid k-sec" id="gc">
    <title>GuardChain. Each guard has a 5 s budget by default; the first block wins; an exception blocks, and a timeout blocks unless the guard defines its own timeout policy.</title>
    <rect class="box" x="750" y="100" width="180" height="48" rx="9"/>
    <text class="name" x="762" y="119">GuardChain</text>
    <text class="sub" x="762" y="135">evaluateBeforeToolCall</text>
  </g></a>
  <g transform="translate(24,702)">
    <g class="solid k-sec"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">guard chain</text>
    <g class="tint k-host"><rect class="box" x="112.2" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="134.2" y="10">DartClaw adapter</text>
    <g class="tint k-ext"><rect class="box" x="255.39999999999998" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="277.4" y="10">provider process</text>
    <g class="e "><path d="M398.59999999999997,6 H430.59999999999997"/></g><text class="lg" x="438.59999999999997" y="10">request or evaluation</text>
    <g class="e dash"><path d="M590.8,6 H622.8"/></g><text class="lg" x="630.8" y="10">verdict or reply</text>
  </g>
</svg>
