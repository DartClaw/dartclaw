  <rect class="bg" width="1000" height="746"/>

  <text class="kick" x="24" y="32">SEQUENCE · GuardChain.evaluateBeforeToolCall</text>
  <text class="title" x="24" y="58">Tool interception per provider</text>
  <text class="lede" x="24" y="80">Three wire formats, one question: each provider asks the host, and the same guard chain answers.</text>

  <g class="k-ext"><rect class="band" x="16" y="160" width="968" height="162" rx="14"/><text class="kick" x="32" y="182">CLAUDE</text></g>
  <text class="note" x="112" y="182" text-anchor="start">PreToolUse hook: always fires, even with --dangerously-skip-permissions; can_use_tool comes first only with --permission-prompt-tool stdio</text>
  <g class="k-ext"><rect class="band" x="16" y="334" width="968" height="162" rx="14"/><text class="kick" x="32" y="356">CODEX</text></g>
  <text class="note" x="112" y="356" text-anchor="start">approval requests are the only interception point; under approval policy never, Codex sends none and the chain is not consulted</text>
  <g class="k-ext"><rect class="band" x="16" y="508" width="968" height="162" rx="14"/><text class="kick" x="32" y="530">ACP</text></g>
  <text class="note" x="112" y="530" text-anchor="start">reverse calls from the agent, host execution only, bound to the active turn; terminal/* is refused</text>
  <line class="life" x1="140" y1="148" x2="140" y2="160"/>
  <line class="life" x1="140" y1="194" x2="140" y2="322"/>
