    <g class="tint k-host"><rect class="box" x="124.60000000000001" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="146.60000000000002" y="10">DartClaw component</text>
    <g class="tint k-sec"><rect class="box" x="280.20000000000005" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="302.20000000000005" y="10">admin-gated</text>
    <g class="solid k-sec"><rect class="box" x="392.40000000000003" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="414.40000000000003" y="10">runs the stop</text>
