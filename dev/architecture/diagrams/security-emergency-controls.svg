<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" role="img" aria-labelledby="title desc">
  <title id="title">Emergency controls</title>
  <desc id="desc">Four entry points run the same EmergencyStopHandler.execute: it cancels every active turn, cancels running and queued tasks, and fires EmergencyStopEvent plus an SSE broadcast, best-effort and non-halting. Pause and resume are separate: PauseController queues inbound channel messages while paused and replays them collapsed into the MessageQueue on resume.</desc>
