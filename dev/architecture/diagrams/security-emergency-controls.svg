  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-chan" id="e1">
    <rect class="box" x="28" y="130" width="230" height="52" rx="9"/>
    <text class="name" x="40" y="149">channel /stop or stop!</text>
    <text class="sub" x="40" y="165">admin sender only</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">channel /stop or stop!</tspan> · ReservedCommandHandler checks GovernanceConfig.isAdmin and runs before rate limiting and pause queueing</text><text class="p2" x="36" y="702">A non-admin sender is refused with "Only admin senders can use this command." and an audit entry (guard ReservedCommand).</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-chan" id="e2">
    <rect class="box" x="28" y="192" width="230" height="52" rx="9"/>
    <text class="name" x="40" y="211">Google Chat /stop</text>
    <text class="sub" x="40" y="227">slash command, admin sender only</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">Google Chat /stop</tspan> · the slash-command handler routes to the same EmergencyStopHandler, with the same admin check</text><text class="p2" x="36" y="702">SlashCommandHandler is wired with the same EmergencyStopHandler and config.governance.isAdmin. slash_command_handler.dart.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-host" id="e3">
    <rect class="box" x="28" y="254" width="230" height="52" rx="9"/>
    <text class="name mono-name" x="40" y="273">dartclaw stop</text>
    <text class="sub" x="40" y="289">CLI, posts to the API</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">dartclaw stop</tspan> · stop_command.dart calls postObject(/api/emergency-stop) against the running server</text><text class="p2" x="36" y="702">It needs the same operator or admin access as any other HTTP caller.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-host" id="e4">
    <rect class="box" x="28" y="332" width="230" height="52" rx="9"/>
    <text class="name mono-name" x="40" y="351">POST /api/emergency-stop</text>
    <text class="sub" x="40" y="367">operator or admin access</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">POST /api/emergency-stop</tspan> · a way out when every channel is disabled; the audited caller is derived from the request authentication</text><text class="p2" x="36" y="702">emergency_stop_routes.dart; the channel and slash paths check GovernanceConfig.isAdmin instead.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n solid k-sec" id="handler">
    <rect class="box" x="360" y="130" width="230" height="72" rx="9"/>
    <text class="name mono-name" x="372" y="153">EmergencyStopHandler</text>
    <text class="sub" x="372" y="171">best-effort, failures logged,</text>
    <text class="sub" x="372" y="187">returns turn and task counts</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">EmergencyStopHandler</tspan> · execute() never halts early: one failed cancel is logged and the remaining turns and tasks are still cancelled</text><text class="p2" x="36" y="702">Cancellation keeps each lease until the managed root process exits or the slot is quarantined, so no overlapping replacement starts.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-host" id="s1">
    <rect class="box" x="650" y="130" width="322" height="72" rx="9"/>
    <g class="step"><circle cx="670" cy="152" r="10"/><text x="670" y="156">1</text></g>
    <text class="name" x="688" y="153">cancel every active turn</text>
    <text class="sub" x="688" y="171">TurnManager.cancelTurn per session on</text>
    <text class="sub" x="688" y="187">every runner the coordinator tracks</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">cancel every active turn</tspan> · primary lane, active worker leases and cached workers all count; turnsCancelled in the result</text><text class="p2" x="36" y="702">Lease state, not retained process presence, is authoritative for active execution. emergency_stop_handler.dart.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-host" id="s2">
    <rect class="box" x="650" y="218" width="322" height="72" rx="9"/>
    <g class="step"><circle cx="670" cy="240" r="10"/><text x="670" y="244">2</text></g>
    <text class="name" x="688" y="241">cancel running and queued tasks</text>
    <text class="sub" x="688" y="259">trigger: emergency_stop; review, draft,</text>
    <text class="sub" x="688" y="275">accepted and rejected are left alone</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">cancel running and queued tasks</tspan> · a task modified concurrently (version conflict) is skipped with a warning</text><text class="p2" x="36" y="702">Left tasks need manual resolution; tasksCancelled in the result.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-host" id="s3">
    <rect class="box" x="650" y="306" width="322" height="72" rx="9"/>
    <g class="step"><circle cx="670" cy="328" r="10"/><text x="670" y="332">3</text></g>
    <text class="name mono-name" x="688" y="329">EmergencyStopEvent</text>
    <text class="sub" x="688" y="347">alert emergency_stop (critical),</text>
    <text class="sub" x="688" y="363">SSE emergency_stop broadcast</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">EmergencyStopEvent</tspan> · the event carries stoppedBy and both counts; the SSE broadcast is sent by the handler itself</text><text class="p2" x="36" y="702">The alert classifier maps it to a critical alert.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-sec" id="p1">
    <rect class="box" x="28" y="444" width="230" height="56" rx="9"/>
    <text class="name" x="40" y="463">/pause, /resume</text>
    <text class="sub" x="40" y="479">admin sender only</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">/pause, /resume</tspan> · reserved commands bypass rate limiting and pause queueing; /pause is idempotent</text><text class="p2" x="36" y="702">Replies for /stop, /pause and /resume go to the issuing thread.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-chan" id="p2">
    <rect class="box" x="28" y="514" width="230" height="56" rx="9"/>
    <text class="name" x="40" y="533">inbound channel message</text>
    <text class="sub" x="40" y="549">non-reserved, while paused</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">inbound channel message</tspan> · web chat, tasks and scheduled jobs are not paused, and neither are turns already running</text><text class="p2" x="36" y="702">ChannelManager intercepts before thread binding, rate limiting and the MessageQueue.</text></g>
  </g></a>
  <a href="../security-architecture.md#emergency-controls"><g class="n tint k-host" id="pc">
    <rect class="box" x="350" y="444" width="330" height="126" rx="9"/>
    <text class="name mono-name" x="362" y="467">PauseController</text>
    <text class="sub" x="362" y="485">queues up to 200 messages in total;</text>
    <text class="sub" x="362" y="501">max_pause_queued caps a non-admin sender;</text>
    <text class="sub" x="362" y="517">each sender is told: queued, or queue full</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">PauseController</tspan> · /resume drains and unpauses atomically, collapsing messages per conversation route and per sender</text><text class="p2" x="36" y="702">The digest reads "While paused, N participant(s) sent messages:" followed by "- Sender: msg1, msg2". governance/pause_controller.dart.</text></g>
  </g></a>
  <a href="../security-architecture.md#rate-limiting"><g class="n tint k-host" id="mq">
    <rect class="box" x="760" y="444" width="212" height="126" rx="9"/>
    <text class="name" x="772" y="467">MessageQueue</text>
    <text class="sub" x="772" y="485">collapsed digests are</text>
    <text class="sub" x="772" y="501">re-enqueued per route;</text>
    <text class="sub" x="772" y="517">the per-sender rate</text>
    <text class="sub" x="772" y="533">limit is bypassed</text>
    <g class="d"><text class="p1" x="36" y="682"><tspan class="b">MessageQueue</tspan> · drainPauseQueue re-enqueues each collapsed message straight into the MessageQueue, bypassing the per-sender rate limit</text><text class="p2" x="36" y="702">Admins are exempt from max_pause_queued and max_queued, so with an empty admin_senders list those caps never fire.</text></g>
  </g></a>
