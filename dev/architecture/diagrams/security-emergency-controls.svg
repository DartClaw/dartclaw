  <text class="panel-kick" x="36" y="658">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="682">Hover a box for what it does; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="702">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">PIPELINE · EmergencyStopHandler.execute</text>
  <text class="title" x="24" y="58">Emergency controls</text>
  <text class="lede" x="24" y="80">Stop cancels turns and tasks from four entry points; pause only holds inbound channel messages.</text>

  <g class="k-sec"><rect class="band" x="16" y="96" width="968" height="298" rx="14"/><text class="kick" x="32" y="118">STOP · best-effort, a failed cancel is logged and the rest still run</text></g>
  <g class="k-chan"><rect class="band" x="16" y="410" width="968" height="176" rx="14"/><text class="kick" x="32" y="432">PAUSE AND RESUME · PauseController, in-memory, resets on restart</text></g>

