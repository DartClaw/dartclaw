<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 602" width="1000" height="602" role="img" aria-labelledby="title desc">
  <title id="title">Host-owned credential mediation</title>
  <desc id="desc">A container with no network reaches the host only through a dartclaw-bridge process started with docker exec -i. HostGateway maps each pipe to one authority; the provider adapter pins the upstream and request paths and injects the credential the host holds, and the mcp surface applies the authority's own tool policy.</desc>
  <style>

    svg { --bg:#f6f7f9; --card:#ffffff; --ink:#1e2030; --ink2:#4c4f69; --ink3:#6c6f85; --rule:#ccd0da; --edge:#8c8fa1; --hi:#1e66f5; --on:#ffffff; --panel:#1e1e2e; --panel-ink:#cdd6f4; --panel-sub:#a6adc8; --panel-kick:#fab387;
      --host:#40a02b; --host-d:#1f5c2a; --host-l:#2d7a1f; --ext:#e07c4f; --ext-d:#a8481c; --ext-l:#b5531f; --store:#179299; --store-d:#0f5f63; --store-l:#0e7377;
