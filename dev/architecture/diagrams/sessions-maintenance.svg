  <g class="d0"><text class="p1" x="36" y="726">Hover a box for what it does or skips; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="746">A limit of 0 disables its stage. Inside a rendered document this image is static; click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">PIPELINE · SessionMaintenanceService.run</text>
  <text class="title" x="24" y="58">Session maintenance</text>
  <text class="lede" x="24" y="80">Six stages trim sessions by age, count, size and retention; protected sessions are never touched by the archive and disk stages.</text>

  <g class="k-host"><rect class="band" x="24" y="262" width="620" height="370" rx="14"/><text class="kick" x="40" y="284">STAGES · IN ORDER</text></g>

  <g class="edges">
    <g class="e  f-job t-run"><path d="M174,156 V184"/><text class="el" x="182" y="174" text-anchor="start">scheduled</text></g>
    <g class="e  f-cli t-run"><path d="M494,156 V184"/><text class="el" x="502" y="174" text-anchor="start">manual</text></g>
    <g class="e  f-run t-report"><path d="M624,212 H674"/><text class="el" x="649" y="204" text-anchor="middle">report</text></g>
    <g class="e main f-run t-s0"><path d="M324,238 V294"/><text class="el" x="332" y="256" text-anchor="start">warn or enforce</text></g>
    <g class="e main f-s0 t-s1"><path d="M334,340 V350"/></g>
    <g class="e main f-s1 t-s2"><path d="M334,396 V406"/></g>
    <g class="e main f-s2 t-s3"><path d="M334,452 V462"/></g>
    <g class="e main f-s3 t-s4"><path d="M334,508 V518"/></g>
    <g class="e main f-s4 t-s5"><path d="M334,564 V574"/></g>
    <g class="e dash bad f-prot t-s1"><path d="M676,374 H630"/><text class="el" x="653" y="366" text-anchor="middle">skips</text></g>
    <g class="e dash bad f-prot t-s2"><path d="M676,430 H630"/><text class="el" x="653" y="422" text-anchor="middle">skips</text></g>
    <g class="e dash bad f-prot t-s4"><path d="M676,542 H630"/><text class="el" x="653" y="534" text-anchor="middle">skips</text></g>
  </g>

  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-host" id="job">
    <rect class="box" x="24" y="104" width="300" height="52" rx="9"/>
    <text class="name mono-name" x="36" y="123">session-maintenance job</text>
    <text class="sub" x="36" y="139">sessions.maintenance.schedule, 0 3 * * *</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">session-maintenance job</tspan> · built-in scheduled job registered in scheduling_wiring.dart; an empty or disabled schedule registers nothing</text><text class="p2" x="36" y="746">It runs every stage, then audit-file cleanup, which is outside the session model.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-host" id="cli">
    <rect class="box" x="344" y="104" width="300" height="52" rx="9"/>
    <text class="name mono-name" x="356" y="123">dartclaw cleanup</text>
    <text class="sub" x="356" y="139">--dry-run: warn mode; --enforce: enforce</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">dartclaw cleanup</tspan> · apps/dartclaw_cli cleanup_command.dart</text><text class="p2" x="36" y="746">Passes no inbox or task service, so stages 0 and 5 do not run; active channel keys and cron jobs are derived from config.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n solid k-host" id="run">
    <rect class="box" x="24" y="186" width="600" height="52" rx="9"/>
    <text class="name mono-name" x="36" y="205">SessionMaintenanceService.run</text>
    <text class="sub" x="36" y="221">mode warn (default): plan and report only; enforce: apply</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">SessionMaintenanceService.run</tspan> · maintenance/session_maintenance_service.dart</text><text class="p2" x="36" y="746">Every action is an archive or a delete with a reason and an applied flag; warn mode plans the same actions without applying them.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n line k-neu" id="report">
    <rect class="box" x="676" y="186" width="300" height="52" rx="9"/>
    <text class="name mono-name" x="688" y="205">MaintenanceReport</text>
    <text class="sub" x="688" y="221">counts, warnings, actions</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">MaintenanceReport</tspan> · sessions archived and deleted, bytes reclaimed, artifacts deleted, warnings, and one MaintenanceAction per session</text><text class="p2" x="36" y="746">Reasons: stale, count_cap, cron_retention, disk_budget, artifact_retention. applied is false in warn mode.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-host" id="s0">
    <rect class="box" x="40" y="296" width="588" height="44" rx="9"/>
    <g class="step"><circle cx="60" cy="318.0" r="10"/><text x="60" y="322.0">0</text></g>
    <text class="name mono-name" x="78" y="315">autoSettleIdleSessions</text>
    <g class="badge"><rect x="564" y="303" width="54" height="16" rx="8"/><text x="591" y="315">SETTLE</text></g>
    <text class="sub" x="78" y="331">settle idle read conversations: auto_settle_idle_days (0); scheduled job only</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">autoSettleIdleSessions</tspan> · ConversationInboxService.autoSettleIdleSessions settles idle conversations</text><text class="p2" x="36" y="746">Settling is not archival. Needs the inbox service, which the CLI does not pass.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-host" id="s1">
    <rect class="box" x="40" y="352" width="588" height="44" rx="9"/>
    <g class="step"><circle cx="60" cy="374.0" r="10"/><text x="60" y="378.0">1</text></g>
    <text class="name" x="78" y="371">prune stale</text>
    <g class="badge"><rect x="557" y="359" width="61" height="16" rx="8"/><text x="588" y="371">ARCHIVE</text></g>
    <text class="sub" x="78" y="387">archive sessions not updated within prune_after_days (30)</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">prune stale</tspan> · archives sessions whose updatedAt is older than the window</text><text class="p2" x="36" y="746">Skips archive, task and protected sessions.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-host" id="s2">
    <rect class="box" x="40" y="408" width="588" height="44" rx="9"/>
    <g class="step"><circle cx="60" cy="430.0" r="10"/><text x="60" y="434.0">2</text></g>
    <text class="name" x="78" y="427">count cap</text>
    <g class="badge"><rect x="557" y="415" width="61" height="16" rx="8"/><text x="588" y="427">ARCHIVE</text></g>
    <text class="sub" x="78" y="443">archive the oldest unprotected sessions beyond max_sessions (500)</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">count cap</tspan> · sorted by updatedAt ascending, archives the surplus</text><text class="p2" x="36" y="746">Protected sessions are not counted against the cap.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-host" id="s3">
    <rect class="box" x="40" y="464" width="588" height="44" rx="9"/>
    <g class="step"><circle cx="60" cy="486.0" r="10"/><text x="60" y="490.0">3</text></g>
    <text class="name" x="78" y="483">cron retention</text>
    <g class="badge"><rect x="564" y="471" width="54" height="16" rx="8"/><text x="591" y="483">DELETE</text></g>
    <text class="sub" x="78" y="499">delete orphaned cron sessions older than cron_retention_hours (24)</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">cron retention</tspan> · deletes cron sessions whose job is no longer configured, once older than the window</text><text class="p2" x="36" y="746">The session type is flipped to user first so the protected-type guard in deleteSession passes.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-host" id="s4">
    <rect class="box" x="40" y="520" width="588" height="44" rx="9"/>
    <g class="step"><circle cx="60" cy="542.0" r="10"/><text x="60" y="546.0">4</text></g>
    <text class="name" x="78" y="539">disk budget</text>
    <g class="badge"><rect x="564" y="527" width="54" height="16" rx="8"/><text x="591" y="539">DELETE</text></g>
    <text class="sub" x="78" y="555">delete archived sessions oldest first until usage &lt;= 80% of max_disk_mb (0)</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">disk budget</tspan> · deletes archived sessions oldest first until usage is at most 80% of the budget</text><text class="p2" x="36" y="746">Skips protected (active) sessions and warns when still over budget.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-host" id="s5">
    <rect class="box" x="40" y="576" width="588" height="44" rx="9"/>
    <g class="step"><circle cx="60" cy="598.0" r="10"/><text x="60" y="602.0">5</text></g>
    <text class="name" x="78" y="595">artifact retention</text>
    <g class="badge"><rect x="564" y="583" width="54" height="16" rx="8"/><text x="591" y="595">DELETE</text></g>
    <text class="sub" x="78" y="611">delete artifacts of terminal tasks past artifact_retention_days; scheduled only</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">artifact retention</tspan> · deletes artifacts of terminal tasks older than tasks.artifact_retention_days</text><text class="p2" x="36" y="746">Needs taskService and dataDir, which the CLI does not pass; outside the session model.</text></g>
  </g></a>
  <a href="../session-state-architecture.md#sessionmaintenanceservice"><g class="n tint k-sec" id="prot">
    <rect class="box" x="676" y="350" width="300" height="200" rx="9"/>
    <text class="name" x="688" y="373">protected sessions</text>
    <text class="sub" x="688" y="391">main sessions</text>
    <text class="sub" x="688" y="407">task sessions</text>
    <text class="sub" x="688" y="423">any session with an active turn</text>
    <text class="sub" x="688" y="439">channel sessions whose key is active</text>
    <text class="sub" x="688" y="455">cron sessions whose job is active</text>
    <g class="d"><text class="p1" x="36" y="726"><tspan class="b">protected sessions</tspan> · _isProtected in session_maintenance_service.dart; stages 1, 2 and 4 skip these</text><text class="p2" x="36" y="746">The scheduled job treats every channel session key as active whenever a channel is registered; the CLI does so when a channel is enabled in config.</text></g>
  </g></a>
