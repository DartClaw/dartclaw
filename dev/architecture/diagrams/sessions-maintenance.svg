<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 774" width="1000" height="774" role="img" aria-labelledby="title desc">
  <title id="title">Session maintenance</title>
  <desc id="desc">SessionMaintenanceService.run, started by the scheduled session-maintenance job or by dartclaw cleanup, runs up to six stages in order: settle idle conversations, archive stale sessions, archive past the count cap, delete orphaned cron sessions, delete archived sessions over the disk budget, delete artifacts of terminal tasks. Stages 1, 2 and 4 skip protected sessions. In warn mode the run only plans and reports.</desc>
