<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Conversation submission lifecycle</title>
  <desc id="desc">A web conversation submission is claimed, committed, then accepted or queued, dispatched and run to a terminal state. A global-cap refusal returns it to queued; a restart rewrites in-flight states to uncertain or held.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .num { fill: var(--k); }
    .num-text { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .state .box { rx: 14px; }
    .edge.hot { stroke: var(--sec); }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="700"/>
  <text class="title" x="24" y="34">Conversation submission lifecycle</text>
  <text class="lede" x="24" y="56">workState of one ConversationSubmissionClaim in ConversationState. Solid arrows are the live flow; the dashed band is restart recovery.</text>
  <g class="node k-host">
    <title>commitState preparing. submit() persists the claim in meta.json, then verifies attachments (sha256), appends the transcript message by identity, writes the attempt or queue record file, and only then commits.</title>
    <path class="edge" d="M224,136 L290,136"/>
    <path class="edge" d="M150,162 V316 H290"/>
    <rect class="box" x="24" y="110" width="200" height="52" rx="6"/>
    <text class="mono" x="38" y="130">preparing</text>
    <text class="sub" x="38" y="148">claim persisted (commitState)</text>
  </g>
  <g class="node k-host">
    <title>workState accepted: no turn active, no dispatch in flight, nothing queued. Carries an attemptId.</title>
    <path class="edge" d="M450,136 L520,136"/>
    <rect class="box" x="290" y="110" width="160" height="52" rx="6"/>
    <text class="mono" x="304" y="130">accepted</text>
    <text class="sub" x="304" y="148">idle: dispatch now</text>
  </g>
  <g class="node k-host">
    <title>_dispatch: revalidates the admitted context, verifies the transcript message, record files and attachment manifest, persists dispatching with admitContext, then calls TurnManager.reserveContextTurn.</title>
    <path class="edge" d="M680,136 L760,136"/>
    <path class="edge" d="M560,162 V250 H410 V290"/>
    <rect class="box" x="520" y="110" width="160" height="52" rx="6"/>
    <text class="mono" x="534" y="130">dispatching</text>
    <text class="sub" x="534" y="148">context revalidated</text>
  </g>
  <g class="node k-host">
    <title>workState running with a turnId; _observeOutcome waits for the turn outcome.</title>
    <path class="edge" d="M900,162 V290"/>
    <path class="edge" d="M800,162 V250 H620 V290"/>
    <rect class="box" x="760" y="110" width="216" height="52" rx="6"/>
    <text class="mono" x="774" y="130">running</text>
    <text class="sub" x="774" y="148">turn reserved, executeTurn started</text>
  </g>
  <g class="node k-host">
    <title>workState queued with a queueId. Input is queued when a turn is active, a dispatch is in flight, or any item is already queued. The oldest queued item is released when the turn completes or when global capacity frees.</title>
    <path class="edge" d="M330,290 V162"/>
    <path class="edge" d="M370,342 V406 H324"/>
    <rect class="box" x="290" y="290" width="160" height="52" rx="6"/>
    <text class="mono" x="304" y="310">queued</text>
    <text class="sub" x="304" y="328">waits its turn</text>
  </g>
  <g class="node k-host">
    <title>workState stopping: steer or stop requested; the displayed turn is being cancelled.</title>
    <path class="edge" d="M680,316 L760,316"/>
    <rect class="box" x="520" y="290" width="160" height="52" rx="6"/>
    <text class="mono" x="534" y="310">stopping</text>
    <text class="sub" x="534" y="328">cancel in flight</text>
  </g>
  <g class="node k-host">
    <title>_observeOutcome records the terminal state and tool records. Only a completed turn dispatches the next queued item; failed, cancelled or shutdown holds the rest.</title>
    <rect class="box" x="760" y="290" width="216" height="52" rx="6"/>
    <text class="mono" x="774" y="310">terminal</text>
    <text class="sub" x="774" y="328">completed | failed | cancelled</text>
  </g>
  <g class="node k-sec">
    <title>workState held: parked for the owner to send, edit or remove. commitState integrityFailed (SUBMISSION_INTEGRITY_FAILED) also lands here.</title>
    <rect class="box" x="24" y="380" width="300" height="64" rx="6"/>
    <text class="mono" x="38" y="400">held</text>
    <text class="sub" x="38" y="418">dispatch error or failed integrity check;</text>
    <text class="sub" x="38" y="434">queue held after a failed turn or shutdown</text>
  </g>
  <text class="edge-label" x="232" y="130">commit</text>
  <text class="edge-label" x="462" y="130">verified</text>
  <text class="edge-label" x="690" y="130">reserved</text>
  <text class="edge-label" x="334" y="230" text-anchor="end">released</text>
  <text class="edge-label" x="418" y="244">BusyTurnException</text>
  <text class="edge-label" x="700" y="244">stop / steer</text>
  <text class="edge-label" x="906" y="230">outcome</text>
  <text class="edge-label" x="158" y="198">committed, busy</text>
  <text class="edge-label" x="380" y="376">failed turn or shutdown</text>
  <rect class="group" x="24" y="472" width="952" height="176" rx="8"/>
  <text class="group-label" x="36" y="490">On restart: ConversationService.recoverAfterRestart, once per session on first touch</text>
  <g class="node k-host">
    <title>workState uncertain is informational: the process cannot confirm the turn. _settleUncertainDispatches marks it failed (Dispatch was never confirmed) at the next dispatch.</title>
    <path class="edge" d="M344,522 L420,522"/>
    <rect class="box" x="44" y="504" width="300" height="36" rx="6"/>
    <text class="mono" x="58" y="524">dispatching, running, stopping</text>
  </g>
  <g class="node k-sec">
    <title>workState uncertain is informational: the process cannot confirm the turn. _settleUncertainDispatches marks it failed (Dispatch was never confirmed) at the next dispatch.</title>
    <rect class="box" x="420" y="504" width="330" height="36" rx="6"/>
    <text class="mono" x="434" y="524">uncertain</text>
  </g>
  <text class="sub" x="766" y="526">next dispatch marks it failed</text>
  <g class="node k-host">
    <title>Queued items become held so a restart never auto-sends them.</title>
    <path class="edge" d="M344,568 L420,568"/>
    <rect class="box" x="44" y="550" width="300" height="36" rx="6"/>
    <text class="mono" x="58" y="570">queued</text>
  </g>
  <g class="node k-sec">
    <title>Queued items become held so a restart never auto-sends them.</title>
    <rect class="box" x="420" y="550" width="330" height="36" rx="6"/>
    <text class="mono" x="434" y="570">held</text>
  </g>
  <text class="sub" x="766" y="572">owner releases or removes it</text>
  <g class="node k-host">
    <title>_completeDurableSequence replays the durable steps; a failure marks integrityFailed and held.</title>
    <path class="edge" d="M344,614 L420,614"/>
    <rect class="box" x="44" y="596" width="300" height="36" rx="6"/>
    <text class="mono" x="58" y="616">preparing</text>
  </g>
  <g class="node k-sec">
    <title>_completeDurableSequence replays the durable steps; a failure marks integrityFailed and held.</title>
    <rect class="box" x="420" y="596" width="330" height="36" rx="6"/>
    <text class="mono" x="434" y="616">committed, or integrityFailed and held</text>
  </g>
  <text class="sub" x="766" y="618">sequence replayed idempotently</text>
  <text class="note" x="24" y="686">Opened directly in a browser, hovering a node shows its detail. Approval records in resolving become unavailable on restart (not drawn).</text>
</svg>
