<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Container isolation topology</title>
  <desc id="desc">A container has no network and no credential. Its provider binary reaches one upstream and the MCP endpoint only through two host-opened bridge pipes served by HostGateway.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
    .name { font-size: 13.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="590"/>
  <text class="title" x="24" y="34">Container isolation topology</text>
  <text class="lede" x="24" y="56">One container per Container Authority. All outside access goes through host-opened bridge pipes.</text>
  <rect class="group" x="16" y="76" width="300" height="426" rx="8"/>
  <text class="group-label" x="28" y="92">Container (one per authority)</text>
  <rect class="group" x="368" y="76" width="296" height="426" rx="8"/>
  <text class="group-label" x="380" y="92">Dart host</text>
  <a href="../control-protocol.md">
  <g class="node k-ext">
    <title>The provider binary from the configured image. ANTHROPIC_BASE_URL points at the loopback provider bridge (127.0.0.1); MCP goes to the loopback MCP bridge. ACP agents never run here.</title>
    <path class="edge" d="M97,176 L97,218"/>
    <path class="edge" d="M235,176 L235,218"/>
    <rect class="box" x="32" y="112" width="268" height="64" rx="6"/>
    <text class="name" x="46" y="133">claude or codex</text>
    <text class="sub" x="46" y="150">provider binary from the image</text>
    <text class="sub" x="46" y="165">talks only to the loopback bridges</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-sec">
    <title>dartclaw-bridge (BridgeSurface.provider), mounted read-only at /opt/dartclaw/dartclaw-bridge. Chooses no destination and holds no credential; frames provider traffic to the host over the docker exec -i pipe.</title>
    <path class="edge" d="M97,274 V304 H384"/>
    <rect class="box" x="32" y="218" width="130" height="56" rx="6"/>
    <text class="name" x="46" y="239">bridge: provider</text>
    <text class="chip-text" x="46" y="256">dartclaw-bridge</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-sec">
    <title>dartclaw-bridge (BridgeSurface.mcp). Frames MCP requests for the host /mcp endpoint over its own docker exec -i pipe.</title>
    <path class="edge" d="M300,246 H384"/>
    <rect class="box" x="170" y="218" width="130" height="56" rx="6"/>
    <text class="name" x="184" y="239">bridge: mcp</text>
    <text class="chip-text" x="184" y="256">dartclaw-bridge</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-sec">
    <title>Security profile mounts. A per-authority generated-state mount holds client configuration and is removed with the container. No host home is ever mounted, so provider login state stays outside the boundary.</title>
    <rect class="box" x="32" y="326" width="268" height="78" rx="6"/>
    <text class="name" x="46" y="347">Mounts</text>
    <text class="chip-text" x="46" y="364">/workspace:rw · /project:ro</text>
    <text class="chip-text" x="46" y="379">/projects:ro (workspace profile)</text>
    <text class="sub" x="46" y="394">restricted profile: no workspace mounts</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-sec">
    <title>Flags set by ContainerManager at create time.</title>
    <rect class="box" x="32" y="412" width="268" height="78" rx="6"/>
    <text class="name" x="46" y="433">Hardening</text>
    <text class="chip-text" x="46" y="450">--network none · --cap-drop ALL</text>
    <text class="chip-text" x="46" y="465">--read-only · no-new-privileges</text>
    <text class="sub" x="46" y="480">/tmp: size-limited noexec tmpfs</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-host">
    <title>dartclaw-&lt;fnv1a32(dataDir)&gt;-&lt;profile&gt;-&lt;authority&gt;. Container ownership is labelled with the data directory so a restart reclaims strays.</title>
    <path class="edge dashed" d="M384,144 L316,144"/>
    <text class="edge-label" x="342" y="137" text-anchor="middle">creates</text>
    <rect class="box" x="384" y="112" width="264" height="64" rx="6"/>
    <text class="name" x="398" y="133">ContainerManager</text>
    <text class="sub" x="398" y="150">docker or podman: create, start, reclaim</text>
    <text class="sub" x="398" y="165">destroys the container with its authority</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-sec">
    <title>Registers each live authority before its bridges start, serves the framed pipes, pins the upstream and refuses on credential trouble. Nothing re-registers a revoked authority.</title>
    <path class="edge" d="M648,230 L704,230"/>
    <path class="edge" d="M648,322 L704,322"/>
    <rect class="box" x="384" y="200" width="264" height="150" rx="6"/>
    <text class="name" x="398" y="221">HostGateway</text>
    <text class="chip-text" x="398" y="238">GatewayAuthority per container</text>
    <text class="sub" x="398" y="253">provider adapter strips any client-supplied</text>
    <text class="sub" x="398" y="268">credential and injects the host-held one</text>
    <text class="sub" x="398" y="283">McpBridgeSurface enforces the authority</text>
    <text class="sub" x="398" y="298">tool allowlist; revoked for good on release</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-sec">
    <title>SubscriptionCredentialStore and the named credential store. HostGateway reads them per request through the provider adapter.</title>
    <path class="edge" d="M516,380 L516,350"/>
    <rect class="box" x="384" y="380" width="264" height="70" rx="6"/>
    <text class="name" x="398" y="401">Host-held credentials</text>
    <text class="sub" x="398" y="418">subscription stores, named API keys</text>
    <text class="sub" x="398" y="433">never in the container environment</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-ext">
    <title>The authority reaches its provider through the gateway only. The container has no network.</title>
    <rect class="box" x="704" y="200" width="280" height="60" rx="6"/>
    <text class="name" x="718" y="221">Provider API</text>
    <text class="sub" x="718" y="238">exactly one pinned upstream per authority</text>
  </g>
  </a>
  <a href="../system-architecture.md#mcp-server">
  <g class="node k-host">
    <title>The ordinary /mcp handler scoped to the authority principal: caller policy, guard evaluation and audit run before the tool.</title>
    <rect class="box" x="704" y="292" width="280" height="60" rx="6"/>
    <text class="name" x="718" y="313">McpProtocolHandler (/mcp)</text>
    <text class="sub" x="718" y="330">host MCP server, same tool dispatch</text>
  </g>
  </a>
  <text class="note" x="24" y="526">Pipes are opened by the host with docker exec -i; killing the process pair revokes the surface. The container holds no socket and no network.</text>
  <text class="note" x="24" y="546">The same boundary applies to claude and codex. ACP agents have no verified adapter, so they never run in a container.</text>
  <text class="note" x="24" y="566">With the posture disabled (container.enabled: false) the provider runs as a host subprocess; guards still evaluate, but there is no OS boundary.</text>
</svg>
