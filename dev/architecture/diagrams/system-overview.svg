<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" width="1000" height="704" role="img" aria-labelledby="title desc">
  <title id="title">System architecture overview</title>
  <desc id="desc">The Dart host process: five ways work arrives, the conversation, execution and task layers, policy, storage and shared services, and the provider binaries it drives over stdio.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
    .name { font-size: 13.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="704"/>
  <text class="title" x="24" y="34">System architecture overview</text>
  <text class="lede" x="24" y="56">One Dart host process owns state and policy; provider binaries only reason and run tools. Hover a box for its role.</text>
  <rect class="group" x="16" y="76" width="968" height="484" rx="8"/>
  <text class="group-label" x="28" y="92">Dart host process</text>
  <a href="../channel-messaging-architecture.md">
  <g class="node k-chan">
    <title>Channel adapters (dartclaw_whatsapp, dartclaw_signal, dartclaw_google_chat, dartclaw_slack) normalize inbound platform payloads into ChannelMessage and hand them to ChannelManager.</title>
    <path class="edge" d="M144,162 L144,204"/>
    <rect class="box" x="32" y="100" width="225" height="62" rx="6"/>
    <text class="name" x="46" y="121">Channel ingress</text>
    <text class="sub" x="46" y="138">WhatsApp, Signal,</text>
    <text class="sub" x="46" y="153">Google Chat, Slack</text>
  </g>
  </a>
  <a href="../system-architecture.md#web-ui">
  <g class="node k-host">
    <title>Server-rendered web UI and JSON API on one shelf server (DartclawServer). POST /api/sessions/&lt;id&gt;/send admits chat messages through ConversationService.submit.</title>
    <path class="edge" d="M330,162 L330,204"/>
    <rect class="box" x="269" y="100" width="225" height="62" rx="6"/>
    <text class="name" x="283" y="121">Web UI and REST API</text>
    <text class="sub" x="283" y="138">Trellis + HTMX + SSE</text>
    <text class="sub" x="283" y="153">shelf routes, auth middleware</text>
  </g>
  </a>
  <a href="../observability-operations-architecture.md">
  <g class="node k-host">
    <title>Schedules heartbeat, git-sync and configured jobs. A prompt job starts a turn through TurnManager with cron provenance; a task job creates a reviewable task.</title>
    <path class="edge" d="M618,162 L618,204"/>
    <rect class="box" x="506" y="100" width="225" height="62" rx="6"/>
    <text class="name" x="520" y="121">ScheduleService</text>
    <text class="sub" x="520" y="138">cron, interval and once jobs</text>
    <text class="sub" x="520" y="153">prompt, task and shell jobs</text>
  </g>
  </a>
  <a href="../system-architecture.md#mcp-server">
  <g class="node k-host">
    <title>McpProtocolHandler on the same shelf server. Memory, knowledge, task, workflow, scheduling and web tools; guard-evaluated and audited at dispatch.</title>
    <path class="edge" d="M855,162 L855,204"/>
    <rect class="box" x="743" y="100" width="225" height="62" rx="6"/>
    <text class="name" x="757" y="121">MCP server (/mcp)</text>
    <text class="sub" x="757" y="138">tools for provider binaries</text>
    <text class="sub" x="757" y="153">and named MCP clients</text>
  </g>
  </a>
  <a href="../session-state-architecture.md">
  <g class="node k-host">
    <title>Routes inbound messages to sessions (pause check, thread binding, per-sender rate limit, debounced FIFO queue) and owns session and conversation state.</title>
    <path class="edge" d="M356,249 L388,249"/>
    <path class="edge" d="M194,294 L194,346"/>
    <rect class="box" x="32" y="204" width="324" height="90" rx="6"/>
    <text class="name" x="46" y="225">Conversation</text>
    <text class="chip-text" x="46" y="242">ChannelManager → ChannelTaskBridge</text>
    <text class="chip-text" x="46" y="257">→ MessageQueue</text>
    <text class="chip-text" x="46" y="272">SessionService · ConversationService</text>
  </g>
  </a>
  <a href="../control-protocol.md">
  <g class="node k-host">
    <title>Admission (budget, session lock, loop and rate checks) then one capacity grant per execution. TurnRunner runs the turn and streams events.</title>
    <path class="edge" d="M478,294 L478,346"/>
    <path class="edge" d="M630,294 L630,580"/>
    <rect class="box" x="388" y="204" width="274" height="90" rx="6"/>
    <text class="name" x="402" y="225">Execution</text>
    <text class="chip-text" x="402" y="242">TurnManager → TurnRunner</text>
    <text class="chip-text" x="402" y="257">ExecutionCoordinator</text>
    <text class="sub" x="402" y="272">primary lane + per-provider worker leases</text>
  </g>
  </a>
  <a href="../task-execution-architecture.md">
  <g class="node k-host">
    <title>Queued tasks and workflow steps lease a provider worker from ExecutionCoordinator, run in a git worktree if one is declared, then go to review.</title>
    <path class="edge" d="M694,249 L662,249"/>
    <path class="edge" d="M831,294 L831,346"/>
    <rect class="box" x="694" y="204" width="274" height="90" rx="6"/>
    <text class="name" x="708" y="225">Tasks and workflows</text>
    <text class="chip-text" x="708" y="242">TaskService · TaskExecutor</text>
    <text class="chip-text" x="708" y="257">TaskReviewService</text>
    <text class="chip-text" x="708" y="272">WorkflowExecutor</text>
  </g>
  </a>
  <a href="../data-model.md">
  <g class="node k-store">
    <title>Files are authoritative for sessions, messages, memory, config and audit. PostgreSQL 14+ holds tasks, executions, workflow runs, traces, events and knowledge-graph facts, plus derived search projections.</title>
    <rect class="box" x="32" y="346" width="324" height="80" rx="6"/>
    <text class="name" x="46" y="367">Storage</text>
    <text class="sub" x="46" y="384">Files: sessions, messages, memory, audit</text>
    <text class="sub" x="46" y="399">(NDJSON, JSON, YAML, Markdown)</text>
    <text class="sub" x="46" y="414">PostgreSQL: tasks, runs, traces, search</text>
  </g>
  </a>
  <a href="../security-architecture.md">
  <g class="node k-sec">
    <title>Guards, rate limits, token budget, loop detection, container isolation and host-held credentials. ContainerManager and HostGateway wrap container executions.</title>
    <path class="edge dashed" d="M478,426 L478,580"/>
    <text class="edge-label" x="486" y="520" text-anchor="start">container + gateway</text>
    <rect class="box" x="388" y="346" width="200" height="80" rx="6"/>
    <text class="name" x="402" y="367">Policy</text>
    <text class="chip-text" x="402" y="384">GuardChain, governance</text>
    <text class="chip-text" x="402" y="399">ContainerManager,</text>
    <text class="chip-text" x="402" y="414">HostGateway, credentials</text>
  </g>
  </a>
  <a href="../task-execution-architecture.md">
  <g class="node k-host">
    <title>Git clones under &lt;data_dir&gt;/projects, per-task worktrees, and push/PR creation. Blocking git calls run in isolates.</title>
    <rect class="box" x="694" y="346" width="274" height="80" rx="6"/>
    <text class="name" x="708" y="367">Projects and worktrees</text>
    <text class="chip-text" x="708" y="384">ProjectService</text>
    <text class="chip-text" x="708" y="399">WorktreeManager</text>
    <text class="chip-text" x="708" y="414">RemotePushService</text>
  </g>
  </a>
  <text class="note" x="32" y="454">Shared services, used by every box above</text>
  <a href="../system-architecture.md#memory-search-and-context-research">
  <g class="node k-host">
    <title>Canonical Markdown memory with derived PostgreSQL search projections, the temporal knowledge graph and the wiki. Reached through MCP tools and prompt composition.</title>
    <rect class="box" x="32" y="464" width="324" height="66" rx="6"/>
    <text class="name" x="46" y="485">Knowledge</text>
    <text class="sub" x="46" y="502">memory corpus, lexical or hybrid search,</text>
    <text class="sub" x="46" y="517">temporal KG, wiki, context_research</text>
  </g>
  </a>
  <a href="../observability-operations-architecture.md">
  <g class="node k-host">
    <title>Fire-and-forget typed events, hot-reloadable configuration, alert routing and usage tracking.</title>
    <rect class="box" x="694" y="464" width="274" height="66" rx="6"/>
    <text class="name" x="708" y="485">Cross-cutting</text>
    <text class="chip-text" x="708" y="502">EventBus · ConfigNotifier</text>
    <text class="chip-text" x="708" y="517">AlertRouter · UsageTracker</text>
  </g>
  </a>
  <rect class="group" x="388" y="580" width="580" height="92" rx="8"/>
  <text class="group-label" x="400" y="596">Provider binaries (stdio control protocol)</text>
  <a href="../control-protocol.md">
  <g class="node k-ext">
    <title>Claude Code CLI. Bidirectional JSONL; runs in a container or on the host.</title>
    <rect class="box" x="400" y="604" width="176" height="56" rx="6"/>
    <text class="name" x="414" y="625">claude</text>
    <text class="sub" x="414" y="642">JSONL</text>
    <text class="sub" x="414" y="657">container or host</text>
  </g>
  </a>
  <a href="../control-protocol.md">
  <g class="node k-ext">
    <title>Codex app-server. JSON-RPC over stdio; runs in a container or on the host.</title>
    <rect class="box" x="588" y="604" width="176" height="56" rx="6"/>
    <text class="name" x="602" y="625">codex</text>
    <text class="sub" x="602" y="642">JSON-RPC</text>
    <text class="sub" x="602" y="657">container or host</text>
  </g>
  </a>
  <a href="../control-protocol.md">
  <g class="node k-ext">
    <title>Agent Client Protocol agents. No mediated container boundary, so they run on the host only.</title>
    <rect class="box" x="776" y="604" width="180" height="56" rx="6"/>
    <text class="name" x="790" y="625">ACP agent</text>
    <text class="sub" x="790" y="642">JSON-RPC</text>
    <text class="sub" x="790" y="657">host only</text>
  </g>
  </a>
  <rect class="group" x="16" y="580" width="356" height="92" rx="8"/>
  <text class="group-label" x="28" y="596">Sidecars (outposts)</text>
  <g class="node k-chan">
    <title>Go sidecar for the WhatsApp Web protocol. Driven by dartclaw_whatsapp over REST and webhooks.</title>
    <rect class="box" x="28" y="604" width="160" height="56" rx="6"/>
    <text class="name" x="42" y="625">GOWA</text>
    <text class="sub" x="42" y="642">WhatsApp, Go</text>
  </g>
  <g class="node k-chan">
    <title>signal-cli sidecar. Driven by dartclaw_signal over JSON-RPC and SSE.</title>
    <rect class="box" x="200" y="604" width="160" height="56" rx="6"/>
    <text class="name" x="214" y="625">signal-cli</text>
    <text class="sub" x="214" y="642">Signal</text>
  </g>
  <text class="note" x="24" y="696">Arrows show the main request path; every subsystem persists through Storage and publishes on the EventBus.</text>
</svg>
