    .ghost .box { fill: none; stroke: var(--k); stroke-dasharray: 5 4; }
    .solid .box { fill: var(--kd); stroke: var(--kd); }
    .name { font-size: 14.5px; font-weight: 700; }
    .sub { font-size: 11.5px; fill: var(--ink2); }
    .mono { font-size: 11.5px; fill: var(--ink2); }
    .solid text { fill: var(--on); }
    .solid .sub, .solid .mono { fill: var(--on); fill-opacity: .82; }
    .badge rect { fill: none; stroke: var(--kl); stroke-width: 1.2; }
