    svg:has(.n:hover) .d0, svg:has(a:focus-visible) .d0 { display: none; }
    svg:has(.n:hover) .edges .e { opacity: .14; }
    .e.join path { marker-end: none; }
    .band.inner { fill: none; stroke-dasharray: 3 4; }
    .mono-name { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; }
    .edges .el { --halo: color-mix(in srgb, var(--host) 6%, var(--bg)); }
    svg:has(#p1:hover) .edges :is(.f-p1,.t-p1) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#p2:hover) .edges :is(.f-p2,.t-p2) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#p3:hover) .edges :is(.f-p3,.t-p3) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#p4:hover) .edges :is(.f-p4,.t-p4) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#p5:hover) .edges :is(.f-p5,.t-p5) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#p6:hover) .edges :is(.f-p6,.t-p6) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#p7:hover) .edges :is(.f-p7,.t-p7) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#p7c:hover) .edges :is(.f-p7c,.t-p7c) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path class="ah-main" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="682"/>
  <!-- Details panel: painted first so node details (.d) draw on top -->
  <rect class="panel" x="16" y="586" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="610">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="634">Hover a step for what it checks and how it fails; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="654">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">PIPELINE · StorageWiring.wire</text>
  <text class="title" x="24" y="58">Serving startup order</text>
  <text class="lede" x="24" y="80">Each step guards the next: local files are read before PostgreSQL opens, and ownership is taken before the schema is touched.</text>

  <g class="k-host"><rect class="band" x="16" y="104" width="968" height="132" rx="14"/><text class="kick" x="32" y="126">BEFORE POSTGRESQL</text></g>
  <g class="k-store"><rect class="band" x="16" y="256" width="968" height="132" rx="14"/><text class="kick" x="32" y="278">POSTGRESQL</text></g>
  <g class="k-host"><rect class="band" x="16" y="408" width="968" height="108" rx="14"/><text class="kick" x="32" y="430">AFTER THE TURN STACK EXISTS</text></g>

  <g class="edges">
    <g class="e main f-p1 t-p2"><path d="M252,178 H290"/><text class="el" x="271" y="170" text-anchor="middle">then</text></g>
    <g class="e main f-p2 t-p3"><path d="M404,222 V238 H190 V284"/></g>
    <g class="e main f-p3 t-p4"><path d="M252,330 H290"/></g>
    <g class="e main f-p4 t-p5"><path d="M516,330 H554"/></g>
    <g class="e main f-p5 t-p6"><path d="M780,330 H794"/></g>
    <g class="e main f-p6 t-p7"><path d="M884,374 V436"/><text class="el" x="892" y="410" text-anchor="start">wiring returns</text></g>
  </g>

  <a href="../data-model.md#memory-corpus"><g class="n tint k-host" id="p1">
    <rect class="box" x="28" y="134" width="224" height="88" rx="9"/>
    <g class="step"><circle cx="48" cy="156" r="10"/><text x="48" y="160">1</text></g>
    <text class="name" x="66" y="157">Memory preflight</text>
    <text class="sub" x="66" y="175">canonical Markdown per</text>
    <text class="sub" x="66" y="191">principal, before any index</text>
    <g class="d"><text class="p1" x="36" y="634"><tspan class="b">Memory preflight</tspan> · MemoryPreflight validates each principal's canonical memory before any derived indexing</text><text class="p2" x="36" y="654">A failure on the owner workspace exits 1; a failing named-agent workspace is unavailable instead.</text></g>
  </g></a>
  <a href="../data-model.md#instance-local-and-small-stores"><g class="n tint k-host" id="p2">
    <rect class="box" x="292" y="134" width="224" height="88" rx="9"/>
    <g class="step"><circle cx="312" cy="156" r="10"/><text x="312" y="160">2</text></g>
    <text class="name mono-name" x="330" y="157">turn_state.json</text>
    <text class="sub" x="330" y="175">open the store, then log</text>
    <text class="sub" x="330" y="191">orphaned turn records</text>
    <g class="chip k-neu"><rect x="330" y="198" width="126" height="16" rx="8"/><text x="337" y="210">scan: serving only</text></g>
    <g class="d"><text class="p1" x="36" y="634"><tspan class="b">turn_state.json</tspan> · the scan logs every orphaned turn record; it changes nothing, and a scan failure is only a warning</text><text class="p2" x="36" y="654">Local state is scanned before PostgreSQL opens; headless and one-shot clients skip the scan.</text></g>
  </g></a>
  <a href="../data-model.md#31-backend"><g class="n tint k-store" id="p3">
    <rect class="box" x="28" y="286" width="224" height="88" rx="9"/>
    <g class="step"><circle cx="48" cy="308" r="10"/><text x="48" y="312">3</text></g>
    <text class="name" x="66" y="309">PostgreSQL pool</text>
    <text class="sub" x="66" y="327">PostgresBackend, one pool</text>
    <text class="sub" x="66" y="343">database.pool_size, default 5</text>
    <g class="d"><text class="p1" x="36" y="634"><tspan class="b">PostgreSQL pool</tspan> · the factory opens the pool from the DSN resolved through the credential registry</text><text class="p2" x="36" y="654">A failure while opening, claiming or validating the database closes the backends and the turn-state store, then exits 1.</text></g>
  </g></a>
  <a href="../data-model.md#33-serving-interlock"><g class="n solid k-store" id="p4">
    <rect class="box" x="292" y="286" width="224" height="88" rx="9"/>
    <g class="step"><circle cx="312" cy="308" r="10"/><text x="312" y="312">4</text></g>
    <text class="name" x="330" y="309">Serving interlock</text>
    <text class="sub" x="330" y="327">session advisory lock on a</text>
    <text class="sub" x="330" y="343">dedicated connection</text>
    <g class="chip k-neu"><rect x="330" y="350" width="88" height="16" rx="8"/><text x="337" y="362">serving only</text></g>
    <g class="d"><text class="p1" x="36" y="634"><tspan class="b">Serving interlock</tspan> · PostgresInterlock takes pg_try_advisory_lock before the schema gate, so two servers cannot share a database</text><text class="p2" x="36" y="654">Ownership is re-checked every 60 s; an unrecoverable loss (a competing owner, or 10 minutes of recovery budget spent) exits 1.</text></g>
  </g></a>
  <a href="../data-model.md#32-schema-gate"><g class="n tint k-store" id="p5">
    <rect class="box" x="556" y="286" width="224" height="88" rx="9"/>
    <g class="step"><circle cx="576" cy="308" r="10"/><text x="576" y="312">5</text></g>
    <text class="name" x="594" y="309">Schema gate</text>
    <text class="sub" x="594" y="327">empty: bootstrap; exact: ok;</text>
    <text class="sub" x="594" y="343">else one transition or refuse</text>
    <g class="d"><text class="p1" x="36" y="634"><tspan class="b">Schema gate</tspan> · prepare creates an empty schema, validates the exact current one, or applies the one admitted 0.27 transition</text><text class="p2" x="36" y="654">Every other shape raises SchemaIncompatibleException without mutating anything; hybrid mode also preflights pgvector first.</text></g>
  </g></a>
  <a href="../data-model.md#derived-search-indexes"><g class="n tint k-store" id="p6">
    <rect class="box" x="796" y="286" width="176" height="88" rx="9"/>
    <g class="step"><circle cx="816" cy="308" r="10"/><text x="816" y="312">6</text></g>
    <text class="name" x="834" y="309">Index reconcile</text>
    <text class="sub" x="834" y="327">FTS language check,</text>
    <text class="sub" x="834" y="343">memory index rebuild</text>
    <g class="d"><text class="p1" x="36" y="634"><tspan class="b">Index reconcile</tspan> · validates database.fts_language, then CanonicalIndexReconciler rebuilds each principal's memory_chunks when stale</text><text class="p2" x="36" y="654">A failed reconcile is logged and canonical memory stays available; only the derived rows are affected.</text></g>
  </g></a>
  <a href="../data-model.md#instance-local-and-small-stores"><g class="n tint k-host" id="p7">
    <rect class="box" x="556" y="438" width="416" height="66" rx="9"/>
    <g class="step"><circle cx="576" cy="460" r="10"/><text x="576" y="464">7</text></g>
    <text class="name" x="594" y="461">Orphan turns acknowledged</text>
    <text class="sub" x="594" y="479">detectAndCleanOrphanedTurns, once the turn stack exists</text>
    <g class="d"><text class="p1" x="36" y="634"><tspan class="b">Orphan turns acknowledged</tspan> · after TurnManager and TurnRunner exist, the serving runtime acknowledges the records the step-2 scan logged</text><text class="p2" x="36" y="654">Only a non-headless runtime with a primary harness does this, so a one-shot client never acknowledges the server's turn records.</text></g>
  </g></a>
  <a href="../data-model.md#4-standalone-execution-checkpoint"><g class="n ghost k-neu" id="p7c">
    <rect class="box" x="28" y="438" width="504" height="66" rx="9"/>
    <text class="name" x="40" y="461">Headless and one-shot clients</text>
    <text class="sub" x="40" y="479">skip the step-2 scan, 4 and 7; standalone runs open no PostgreSQL at all</text>
    <g class="d"><text class="p1" x="36" y="634"><tspan class="b">Headless and one-shot clients</tspan> · rebuild-index, cleanup and the standalone workflow CLI never take the serving role</text><text class="p2" x="36" y="654">The interlock belongs to the serving runtime alone; a standalone run opens no PostgreSQL connection unless a backend factory is injected.</text></g>
  </g></a>
  <g transform="translate(24,560)">
    <g class="tint k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">files and host</text>
    <g class="tint k-store"><rect class="box" x="130.8" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="152.8" y="10">PostgreSQL</text>
    <g class="solid k-store"><rect class="box" x="236.8" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="258.8" y="10">claims the database</text>
    <g class="ghost k-neu"><rect class="box" x="398.6" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="420.6" y="10">other clients</text>
    <g class="e main"><path d="M523.2,6 H555.2"/></g><text class="lg" x="563.2" y="10">startup order</text>
  </g>
</svg>
