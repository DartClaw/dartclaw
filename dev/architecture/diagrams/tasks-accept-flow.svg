  <text class="panel-kick" x="36" y="642">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="666">Hover a box for what it does and how it fails; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="686">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">DECISION FLOW · TaskReviewService._reviewUnlocked</text>
  <text class="title" x="24" y="58">Accepting a reviewed task</text>
  <text class="lede" x="24" y="80">Git delivery runs before the transition. A failure leaves the task in review, so the operator can retry or push back.</text>

  <g class="k-host"><rect class="band" x="482" y="100" width="494" height="120" rx="14"/><text class="kick" x="498" y="122">LOCAL PROJECT · SERVER CHECKOUT</text></g>
  <g class="k-host"><rect class="band" x="232" y="346" width="744" height="222" rx="14"/></g>
  <g class="k-host"><text class="kick" x="830" y="368" text-anchor="end">EXTERNAL PROJECT · PUSH, THEN PR OR BRANCH</text></g>
  <g class="k-host"><text class="el" x="602" y="252" text-anchor="start">MergeSuccess</text></g>

  <g class="edges">
    <g class="e  f-accept t-decide"><path d="M184,283 H242"/><text class="el" x="213" y="276" text-anchor="middle">locked</text></g>
    <g class="e main f-decide t-accepted"><path d="M444,283 H738"/><text class="el" x="452" y="276" text-anchor="start">no worktree</text></g>
    <g class="e  f-decide t-merge"><path d="M344,248 V169 H492"/><text class="el" x="400" y="162" text-anchor="middle">local</text></g>
    <g class="e  f-decide t-prepare"><path d="M344,318 V378"/><text class="el" x="352" y="340" text-anchor="start">external</text></g>
    <g class="e bad f-merge t-conflict"><path d="M684,169 H738"/><text class="el" x="711" y="162" text-anchor="middle">conflict</text></g>
    <g class="e main join f-merge t-accepted"><path d="M594,204 V283"/></g>
    <g class="e  f-prepare t-push"><path d="M444,415 H492"/><text class="el" x="468" y="408" text-anchor="middle">diff ok</text></g>
    <g class="e  f-push t-pr"><path d="M684,415 H738"/><text class="el" x="711" y="408" text-anchor="middle">pushed</text></g>
    <g class="e main f-pr t-accepted"><path d="M852,378 V325"/><text class="el" x="860" y="340" text-anchor="start">recorded</text></g>
    <g class="e bad f-prepare t-failed"><path d="M344,450 V488"/><text class="el" x="352" y="474" text-anchor="start">no diff</text></g>
    <g class="e bad f-push t-failed"><path d="M589,450 V488"/><text class="el" x="597" y="474" text-anchor="start">push failed</text></g>
    <g class="e bad f-pr t-failed"><path d="M852,450 V488"/><text class="el" x="860" y="474" text-anchor="start">PR failed</text></g>
  </g>

  <a href="../task-execution-architecture.md#61-taskreviewservice"><g class="n tint k-chan" id="accept">
    <rect class="box" x="24" y="248" width="160" height="70" rx="9"/>
    <text class="name mono-name" x="36" y="271">accept</text>
    <text class="sub" x="36" y="289">TaskReviewService</text>
    <text class="sub" x="36" y="305">.review, per-task lock</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">accept</tspan> · entered from the Web UI and HTTP API (TaskActionService.review), channel review cards, or the task_review tool</text><text class="p2" x="36" y="686">Actions on one task are serialized by a per-task async lock, so two accepts cannot both merge or push.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#62-accept-flow"><g class="n solid k-host" id="decide">
    <rect class="box" x="244" y="248" width="200" height="70" rx="9"/>
    <text class="name" x="256" y="271">which delivery?</text>
    <text class="sub" x="256" y="289">worktree, not workflow-owned?</text>
    <text class="sub" x="256" y="305">taskTargetsExternalProject?</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">which delivery?</tspan> · worktreeJson set and not a workflow-owned git task, then taskTargetsExternalProject: project id set and not _local</text><text class="p2" x="36" y="686">Workflow git promotion owns publish and merge for workflow-owned tasks, so those only transition here.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#54-mergeexecutor-local-projects"><g class="n tint k-host" id="merge">
    <rect class="box" x="494" y="134" width="190" height="70" rx="9"/>
    <text class="name mono-name" x="506" y="157">MergeExecutor.merge</text>
    <text class="sub" x="506" y="175">invariants, stash, squash</text>
    <text class="sub" x="506" y="191">or --no-ff, restore</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">MergeExecutor.merge</tspan> · clean index, no untracked files overlapping the stash, an unmoved target when expectedBaseSha is given</text><text class="p2" x="36" y="686">On conflict a squash resets hard and a merge aborts; the original branch and the stash are always restored.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#54-mergeexecutor-local-projects"><g class="n tint k-sec" id="conflict">
    <rect class="box" x="740" y="134" width="224" height="70" rx="9"/>
    <text class="name mono-name" x="752" y="157">ReviewMergeConflict</text>
    <text class="sub" x="752" y="175">conflict.json artifact;</text>
    <text class="sub" x="752" y="191">task stays in review</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">ReviewMergeConflict</tspan> · MergeConflict is persisted as a conflict.json data artifact and returned with the conflicting files</text><text class="p2" x="36" y="686">TaskActionService maps it to HTTP 409 MERGE_CONFLICT; the task can be retried after the base moves or pushed back.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#62-accept-flow"><g class="n solid k-store" id="accepted">
    <rect class="box" x="740" y="243" width="224" height="80" rx="9"/>
    <text class="name" x="752" y="266">accepted</text>
    <text class="sub" x="752" y="284">TaskService.transition</text>
    <text class="sub" x="752" y="300">local: worktree cleaned after;</text>
    <text class="sub" x="752" y="316">external: cleaned up before</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">accepted</tspan> · the review transition, the last step; a version conflict here returns ReviewActionFailed (concurrent modification)</text><text class="p2" x="36" y="686">The local path cleans the worktree and branch after the transition; the external path already cleaned up after the push.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#55-remotepushservice-and-prcreator-external-projects"><g class="n tint k-host" id="prepare">
    <rect class="box" x="244" y="380" width="200" height="70" rx="9"/>
    <text class="name" x="256" y="403">prepare branch</text>
    <text class="sub" x="256" y="421">commit leftover changes;</text>
    <text class="sub" x="256" y="437">verify diff against base</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">prepare branch</tspan> · git add -A and commit task(&lt;id&gt;): &lt;title&gt; when the worktree is dirty, then git diff --quiet &lt;base&gt;...HEAD</text><text class="p2" x="36" y="686">No committed difference means there is nothing to publish: push-error.txt is written and the action fails.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#55-remotepushservice-and-prcreator-external-projects"><g class="n tint k-host" id="push">
    <rect class="box" x="494" y="380" width="190" height="70" rx="9"/>
    <text class="name mono-name" x="506" y="403">RemotePushService</text>
    <text class="sub" x="506" y="421">git push origin &lt;branch&gt;</text>
    <text class="sub" x="506" y="437">in an isolate</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">RemotePushService</tspan> · credentials resolve at push time from credentialsRef; results: PushSuccess, PushAuthFailure, PushRejected, PushError</text><text class="p2" x="36" y="686">Every failure writes push-error.txt and returns ReviewActionFailed; nothing was transitioned.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#55-remotepushservice-and-prcreator-external-projects"><g class="n tint k-host" id="pr">
    <rect class="box" x="740" y="380" width="224" height="70" rx="9"/>
    <text class="name" x="752" y="403">PrCreator or branch</text>
    <text class="sub" x="752" y="421">githubPr: REST pull request;</text>
    <text class="sub" x="752" y="437">else the branch is recorded</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">PrCreator or branch</tspan> · PrCreated stores a pr artifact with the URL; branch-only strategy stores the branch name</text><text class="p2" x="36" y="686">PrCreationFailed stores an error artifact and fails the review action even though the branch was pushed.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#62-accept-flow"><g class="n tint k-sec" id="failed">
    <rect class="box" x="244" y="490" width="720" height="60" rx="9"/>
    <text class="name mono-name" x="256" y="513">ReviewActionFailed</text>
    <text class="sub" x="256" y="531">error artifact written; task stays in review; HTTP 500 INTERNAL_ERROR</text>
    <g class="d"><text class="p1" x="36" y="666"><tspan class="b">ReviewActionFailed</tspan> · no diff, push failure, PR creation failure, missing merge or push infrastructure, or a concurrent modification</text><text class="p2" x="36" y="686">The task is never moved to accepted when git delivery failed.</text></g>
  </g></a>
  <g transform="translate(24,592)">
    <g class="tint k-chan"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">review action</text>
    <g class="tint k-host"><rect class="box" x="124.60000000000001" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="146.60000000000002" y="10">git delivery step</text>
    <g class="tint k-store"><rect class="box" x="274.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="296.0" y="10">transition</text>
    <g class="tint k-sec"><rect class="box" x="380.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="402.0" y="10">result: stays in review</text>
    <g class="e main"><path d="M566.6,6 H598.6"/></g><text class="lg" x="606.6" y="10">to accepted</text>
    <g class="e "><path d="M696.8,6 H728.8"/></g><text class="lg" x="736.8" y="10">delivery step</text>
    <g class="e bad"><path d="M839.4,6 H871.4"/></g><text class="lg" x="879.4" y="10">failure</text>
  </g>
</svg>
