<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 714" width="1000" height="714" role="img" aria-labelledby="title desc">
  <title id="title">Accepting a reviewed task</title>
  <desc id="desc">The accept action takes a per-task lock and picks a delivery path. With no worktree, or a workflow-owned git task, the status only transitions. A local project merges into the server checkout; an external project commits leftovers, pushes and opens a pull request or records the branch. A merge conflict or a push or PR failure returns a result and leaves the task in review.</desc>
