  </g>

  <a href="../task-execution-architecture.md#101-per-task-scope"><g class="n tint k-host" id="r1">
    <rect class="box" x="32" y="134" width="268" height="46" rx="9"/>
    <g class="step"><circle cx="52" cy="157.0" r="10"/><text x="52" y="161.0">1</text></g>
    <text class="name mono-name" x="70" y="153">Task.maxTokens</text>
    <text class="sub" x="70" y="169">AgentExecution.budgetTokens</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">Task.maxTokens</tspan> · stored as AgentExecution.budgetTokens; a positive maxTokens in the create body sets it</text><text class="p2" x="36" y="594">TaskConfigView.tokenBudget, which the post-turn overrun check uses, covers rungs 1 to 3 only.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#101-per-task-scope"><g class="n tint k-host" id="r2">
    <rect class="box" x="32" y="200" width="268" height="46" rx="9"/>
    <g class="step"><circle cx="52" cy="223.0" r="10"/><text x="52" y="227.0">2</text></g>
    <text class="name mono-name" x="70" y="219">configJson.tokenBudget</text>
    <text class="sub" x="70" y="235">per-task override</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">configJson.tokenBudget</tspan> · read when Task.maxTokens is null or not positive</text><text class="p2" x="36" y="594">A value of zero or below falls through to the next rung rather than disabling the budget.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#101-per-task-scope"><g class="n tint k-host" id="r3">
    <rect class="box" x="32" y="266" width="268" height="46" rx="9"/>
    <g class="step"><circle cx="52" cy="289.0" r="10"/><text x="52" y="293.0">3</text></g>
    <text class="name mono-name" x="70" y="285">configJson.budget</text>
    <text class="sub" x="70" y="301">deprecated alias</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">configJson.budget</tspan> · the legacy key for tokenBudget, still honoured</text><text class="p2" x="36" y="594">TaskConfigView logs a deprecation warning when it reads it.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#101-per-task-scope"><g class="n tint k-host" id="r4">
    <rect class="box" x="32" y="332" width="268" height="46" rx="9"/>
    <g class="step"><circle cx="52" cy="355.0" r="10"/><text x="52" y="359.0">4</text></g>
    <text class="name mono-name" x="70" y="351">Goal.maxTokens</text>
    <text class="sub" x="70" y="367">inherited from the goal</text>
    <g class="chip k-neu"><rect x="195" y="339" width="95" height="16" rx="8"/><text x="202" y="351">not post-turn</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">Goal.maxTokens</tspan> · read only by the pre-turn check, which receives the task's Goal</text><text class="p2" x="36" y="594">A task budgeted only here is checked before a turn but never after it: the post-turn check stops at rung 3.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#101-per-task-scope"><g class="n tint k-host" id="r5">
    <rect class="box" x="32" y="398" width="268" height="46" rx="9"/>
    <g class="step"><circle cx="52" cy="421.0" r="10"/><text x="52" y="425.0">5</text></g>
    <text class="name" x="70" y="417">config default</text>
    <text class="sub" x="70" y="433">tasks.budget.default_max_tokens</text>
    <g class="chip k-neu"><rect x="195" y="405" width="95" height="16" rx="8"/><text x="202" y="417">not post-turn</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">config default</tspan> · the global default for tasks with no other budget</text><text class="p2" x="36" y="594">Like the goal rung it is seen only by the pre-turn check; null means no limit.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#101-per-task-scope"><g class="n tint k-store" id="kv">
    <rect class="box" x="372" y="126" width="230" height="64" rx="9"/>
    <text class="name mono-name" x="384" y="149">KvService</text>
    <text class="sub" x="384" y="167">session_cost:&lt;sessionId&gt;</text>
    <text class="sub" x="384" y="183">total_tokens, turn_count</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">KvService</tspan> · cumulative session cost, written by the turn runner as each turn settles (durable sessions only)</text><text class="p2" x="36" y="594">No key yet or a non-durable session means no reading, which evaluates as under, so a first turn is never blocked.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#10-budgets"><g class="n solid k-host" id="engine">
    <rect class="box" x="372" y="226" width="230" height="150" rx="9"/>
    <text class="name mono-name" x="384" y="249">BudgetEngine.evaluate</text>
    <text class="sub" x="384" y="267">no limit or no reading: under</text>
    <text class="sub" x="384" y="283">ratio &gt;= 1.0: exceeded</text>
    <text class="sub" x="384" y="299">ratio &gt;= threshold: warning</text>
    <text class="sub" x="384" y="315">first crossing writes the</text>
    <text class="sub" x="384" y="331">scope's warn-once marker</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">BudgetEngine.evaluate</tspan> · governance/budget_engine.dart: the only copy of the threshold, percentage and warn-once arithmetic</text><text class="p2" x="36" y="594">Per-task: reaching the limit leaves the marker unwritten, so a retry can still warn. Daily: the first crossing burns the day's warning.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#102-global-daily-scope"><g class="n tint k-store" id="usage">
    <rect class="box" x="372" y="412" width="230" height="64" rx="9"/>
    <text class="name mono-name" x="384" y="435">UsageTracker</text>
    <text class="sub" x="384" y="453">usage_daily:&lt;date&gt;</text>
    <text class="sub" x="384" y="469">budget_warning_posted_at</text>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">UsageTracker</tspan> · the persisted daily aggregate; BudgetConfig.timezone decides which date "today" is</text><text class="p2" x="36" y="594">The warn-once marker lives in the same aggregate, so one warning per day survives a restart.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#101-per-task-scope"><g class="n tint k-host" id="policy">
    <rect class="box" x="658" y="134" width="314" height="110" rx="9"/>
    <text class="name mono-name" x="670" y="157">TaskBudgetPolicy</text>
    <g class="badge"><rect x="880" y="145" width="82" height="16" rx="8"/><text x="921" y="157">FAILS OPEN</text></g>
    <text class="sub" x="670" y="175">checkBudget: before each turn and</text>
    <text class="sub" x="670" y="191">workflow prompt; reads session_cost</text>
    <text class="sub" x="670" y="207">any exception: logged, turn proceeds</text>
    <g class="chip k-host"><rect x="670" y="220" width="144" height="16" rx="8"/><text x="677" y="232">warn: wrap-up message</text></g>
    <g class="chip k-sec"><rect x="820" y="220" width="107" height="16" rx="8"/><text x="827" y="232">exceeded: fails</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">TaskBudgetPolicy</tspan> · task/task_budget_policy.dart; the fail-open wrapper is here because the daily scope shares the engine and must not</text><text class="p2" x="36" y="594">Exceeded writes a budget-exceeded artifact and fails the task non-retryably. Warning fires BudgetWarningEvent once (_tokenBudgetWarningFired).</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#102-global-daily-scope"><g class="n tint k-sec" id="enforcer">
    <rect class="box" x="658" y="316" width="314" height="110" rx="9"/>
    <text class="name mono-name" x="670" y="339">BudgetEnforcer</text>
    <g class="badge"><rect x="866" y="327" width="96" height="16" rx="8"/><text x="914" y="339">NO FAIL-OPEN</text></g>
    <text class="sub" x="670" y="357">daily totals, BudgetConfig.timezone</text>
    <text class="sub" x="670" y="373">fixed 0.8 warning, warn-once marker</text>
    <text class="sub" x="670" y="389">TurnGovernanceEnforcer maps outcome</text>
    <g class="chip k-sec"><rect x="670" y="402" width="95" height="16" rx="8"/><text x="677" y="414">block: throws</text></g>
    <g class="chip k-neu"><rect x="771" y="402" width="138" height="16" rx="8"/><text x="778" y="414">warn: budget_warning</text></g>
    <g class="d"><text class="p1" x="36" y="574"><tspan class="b">BudgetEnforcer</tspan> · governance/budget_enforcer.dart; no error handling, so a storage failure surfaces rather than admitting an over-budget turn</text><text class="p2" x="36" y="594">At the limit with BudgetAction.block it throws BudgetExhaustedException, which the poller turns into a non-retryable task failure.</text></g>
  </g></a>
  <g transform="translate(24,500)">
    <g class="tint k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">task scope</text>
    <g class="tint k-store"><rect class="box" x="106.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="128.0" y="10">persisted reading</text>
    <g class="tint k-sec"><rect class="box" x="255.4" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="277.4" y="10">daily guardrail</text>
    <g class="e "><path d="M392.4,6 H424.4"/></g><text class="lg" x="432.4" y="10">data flow</text>
  </g>
