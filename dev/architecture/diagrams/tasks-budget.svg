  <text class="panel-kick" x="36" y="550">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="574">Hover a box for what it reads or decides; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="594">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">LADDER AND ENGINE · BudgetEngine.evaluate</text>
  <text class="title" x="24" y="58">Task budgets</text>
  <text class="lede" x="24" y="80">One engine, two scopes. The engine does no I/O and catches nothing; each scope owns its error posture.</text>

  <g class="k-host"><rect class="band" x="16" y="100" width="300" height="362" rx="14"/><text class="kick" x="32" y="122">LIMIT · FIRST POSITIVE WINS</text></g>
  <g class="k-host"><rect class="band" x="646" y="100" width="338" height="160" rx="14"/><text class="kick" x="662" y="122">PER-TASK SCOPE · tasks.budget</text></g>
  <g class="k-sec"><rect class="band" x="646" y="282" width="338" height="160" rx="14"/><text class="kick" x="662" y="304">DAILY SCOPE · budget</text></g>

  <g class="edges">
    <g class="e  f-r1 t-r2"><path d="M166,180 V198"/><text class="el" x="174" y="194" text-anchor="start">not positive</text></g>
    <g class="e join f-r1 t-engine"><path d="M300,157 H330"/></g>
    <g class="e  f-r2 t-r3"><path d="M166,246 V264"/><text class="el" x="174" y="260" text-anchor="start">not positive</text></g>
    <g class="e join f-r2 t-engine"><path d="M300,223 H330"/></g>
    <g class="e  f-r3 t-r4"><path d="M166,312 V330"/><text class="el" x="174" y="326" text-anchor="start">not positive</text></g>
    <g class="e join f-r3 t-engine"><path d="M300,289 H330"/></g>
    <g class="e  f-r4 t-r5"><path d="M166,378 V396"/><text class="el" x="174" y="392" text-anchor="start">not positive</text></g>
    <g class="e join f-r4 t-engine"><path d="M300,355 H330"/></g>
    <g class="e join f-r5 t-engine"><path d="M300,421 H330"/></g>
    <g class="e join f-r1 f-r2 f-r3 f-r4 f-r5 t-engine"><path d="M330,157 V421"/></g>
    <g class="e  f-r1 f-r2 f-r3 f-r4 f-r5 t-engine"><path d="M330,291 H370"/><text class="el" x="350" y="283" text-anchor="middle">limit</text></g>
    <g class="e  f-kv t-engine"><path d="M487,190 V224"/><text class="el" x="495" y="212" text-anchor="start">tokens used</text></g>
    <g class="e  f-usage t-engine"><path d="M487,410 V378"/><text class="el" x="495" y="398" text-anchor="start">daily tokens</text></g>
