<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Task budgets: limit ladder and evaluation</title>
  <desc id="desc">The per-task token limit resolves through a five-rung ladder; BudgetEngine compares session consumption with it and returns under, warning or exceeded; the per-task and daily consumers decide what a breach means and differ in error posture.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
    .name { font-size: 13px; font-weight: 600; }
    .badge { fill: var(--accent); }
    .badge-text { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .k-dev .box.reserved, .reserved .box { stroke-dasharray: 5 4; }
    .bus { fill: none; stroke: var(--edge); stroke-width: 1.4; }
    .legend-swatch { fill: none; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="560"/>
  <text class="title" x="24" y="34">Task budgets: limit ladder and evaluation</text>
  <text class="lede" x="24" y="56">One engine, two scopes. The engine does no I/O and catches nothing; each scope keeps its own error handling.</text>
  <text class="note" x="24" y="88">limit: TaskBudgetPolicy.resolveTokenBudget, first positive value wins</text>
  <g class="node k-host">
    <title>Rung 1 of the ladder. If this value is null or not positive the next rung is tried.</title>
    <path class="edge" d="M160,144 L160,164"/>
    <a href="../task-execution-architecture.md#101-per-task-scope">
    <rect class="box " x="24" y="100" width="272" height="44" rx="6"/>
    <text class="mono" x="36" y="120">Task.maxTokens</text>
    <text class="sub" x="36" y="136">AgentExecution.budgetTokens</text>
    </a>
  </g>
  <text class="edge-label" x="167" y="158">null</text>
  <g class="node k-host">
    <title>Rung 2 of the ladder. If this value is null or not positive the next rung is tried.</title>
    <path class="edge" d="M160,208 L160,228"/>
    <a href="../task-execution-architecture.md#101-per-task-scope">
    <rect class="box " x="24" y="164" width="272" height="44" rx="6"/>
    <text class="mono" x="36" y="184">configJson.tokenBudget</text>
    <text class="sub" x="36" y="200">per-task override</text>
    </a>
  </g>
  <text class="edge-label" x="167" y="222">null</text>
  <g class="node k-host">
    <title>Rung 3 of the ladder. If this value is null or not positive the next rung is tried.</title>
    <path class="edge" d="M160,272 L160,292"/>
    <a href="../task-execution-architecture.md#101-per-task-scope">
    <rect class="box " x="24" y="228" width="272" height="44" rx="6"/>
    <text class="mono" x="36" y="248">configJson.budget</text>
    <text class="sub" x="36" y="264">deprecated key</text>
    </a>
  </g>
  <text class="edge-label" x="167" y="286">null</text>
  <g class="node k-host">
    <title>Rung 4 of the ladder. If this value is null or not positive the next rung is tried.</title>
    <path class="edge" d="M160,336 L160,356"/>
    <a href="../task-execution-architecture.md#101-per-task-scope">
    <rect class="box " x="24" y="292" width="272" height="44" rx="6"/>
    <text class="mono" x="36" y="312">Goal.maxTokens</text>
    <text class="sub" x="36" y="328">inherited from the goal</text>
    </a>
  </g>
  <text class="edge-label" x="167" y="350">null</text>
  <g class="node k-host">
    <title>Rung 5 of the ladder. If this value is null or not positive the next rung is tried.</title>
    <a href="../task-execution-architecture.md#101-per-task-scope">
    <rect class="box " x="24" y="356" width="272" height="44" rx="6"/>
    <text class="mono" x="36" y="376">tasks.budget.default_max_tokens</text>
    <text class="sub" x="36" y="392">global default</text>
    </a>
  </g>
  <path class="bus" d="M296,122 H316 V378 H296"/>
  <g class="node k-host">
    <title>governance/budget_engine.dart: the only copy of the threshold, percentage and warn-once arithmetic. BudgetScope supplies limit, consumption and the warn-once cell.</title>
    <path class="edge" d="M650,215 L700,215"/>
    <path class="edge" d="M650,282 L700,282"/>
    <a href="../task-execution-architecture.md#10-budgets">
    <rect class="box " x="400" y="190" width="250" height="110" rx="6"/>
    <text class="mono" x="412" y="210">BudgetEngine.evaluate</text>
    <text class="sub" x="412" y="226">limit null or 0: under (no read)</text>
    <text class="sub" x="412" y="240">no consumption reading: under</text>
    <text class="sub" x="412" y="254">ratio &gt;= 1.0: exceeded</text>
    <text class="sub" x="412" y="268">ratio &gt;= warning threshold: warning</text>
    <text class="sub" x="412" y="282">warn-once gating via the scope</text>
    </a>
  </g>
  <path class="edge" d="M316,244 L400,244"/>
  <g class="node k-store">
    <title>Cumulative session cost written at turn settlement; the per-task scope reads it before each turn.</title>
    <path class="edge" d="M525,350 L525,302"/>
    <rect class="box " x="400" y="350" width="250" height="56" rx="6"/>
    <text class="mono" x="412" y="370">KvService</text>
    <text class="sub" x="412" y="386">session_cost:&lt;sessionId&gt;:</text>
    <text class="sub" x="412" y="400">total_tokens, turn_count</text>
  </g>
  <g class="node k-host">
    <title>task/task_budget_policy.dart. A terminal breach does not consume the warn-once cell. The fail-open wrapper lives here because the daily scope shares the engine and must not fail open.</title>
    <a href="../task-execution-architecture.md#101-per-task-scope">
    <rect class="box " x="700" y="100" width="276" height="140" rx="6"/>
    <text class="mono" x="712" y="120">TaskBudgetPolicy.checkBudget</text>
    <text class="sub" x="712" y="136">before each turn and workflow prompt</text>
    <text class="sub" x="712" y="150">warning (tasks.budget.warning_threshold,</text>
    <text class="sub" x="712" y="164">default 0.8): system message to the agent,</text>
    <text class="sub" x="712" y="178">BudgetWarningEvent, warn-once flag</text>
    <text class="sub" x="712" y="192">exceeded: budget-exceeded artifact,</text>
    <text class="sub" x="712" y="206">non-retryable task failure</text>
    <text class="sub" x="712" y="220">any exception: proceeds (fails open)</text>
    </a>
  </g>
  <g class="node k-sec">
    <title>governance/budget_enforcer.dart. A BudgetExhaustedException from admission fails a polled task non-retryably.</title>
    <a href="../task-execution-architecture.md#102-global-daily-scope">
    <rect class="box " x="700" y="260" width="276" height="120" rx="6"/>
    <text class="mono" x="712" y="280">BudgetEnforcer</text>
    <text class="sub" x="712" y="296">daily UsageTracker totals, timezone</text>
    <text class="sub" x="712" y="310">aware; fixed 80% warning, warn-once</text>
    <text class="sub" x="712" y="324">marker in the persisted daily aggregate</text>
    <text class="sub" x="712" y="338">TurnGovernanceEnforcer: block throws</text>
    <text class="sub" x="712" y="352">BudgetExhaustedException; no fail open</text>
    </a>
  </g>
  <text class="edge-label" x="358" y="238" text-anchor="middle">limit</text>
  <text class="edge-label" x="532" y="332">per-task tokens used</text>
  <rect class="group" x="24" y="436" width="952" height="70" rx="6"/>
  <text class="note" x="36" y="458">Known divergence: the post-turn overrun check in TaskExecutor reads TaskConfigView.tokenBudget, which stops before Goal.maxTokens and the config default,</text>
  <text class="note" x="36" y="476">and three display readers (TaskProgressTracker, server.dart, tasks_page.dart) read configJson alone. Only the pre-turn check above uses the full ladder.</text>
  <text class="note" x="36" y="494">So a goal-budgeted task is checked before a turn but not after it.</text>
  <text class="note" x="24" y="534">Opened directly in a browser, hovering a box shows its detail and highlights its outgoing arrows.</text>
</svg>
