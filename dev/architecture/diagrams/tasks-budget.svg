<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 622" width="1000" height="622" role="img" aria-labelledby="title desc">
  <title id="title">Task budgets</title>
  <desc id="desc">A per-task limit comes from a five-rung ladder where the first positive value wins. BudgetEngine.evaluate compares a scope's consumption with its limit and returns under, warning or exceeded. The per-task scope (TaskBudgetPolicy) fails open on any error; the daily scope (BudgetEnforcer) has no error handling, so a storage failure surfaces.</desc>
