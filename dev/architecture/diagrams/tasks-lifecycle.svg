<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Task lifecycle: status transitions</title>
  <desc id="desc">The nine TaskStatus values and the transitions TaskStatus.validTransitions allows. The main path is draft, queued, running, review, then accepted or rejected; failed loops back to queued for retry, and cancelled is reachable from every non-terminal state before review.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
    .name { font-size: 13px; font-weight: 600; }
    .badge { fill: var(--accent); }
    .badge-text { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .k-dev .box.reserved, .reserved .box { stroke-dasharray: 5 4; }
    .legend-swatch { fill: none; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="590"/>
  <text class="title" x="24" y="34">Task lifecycle: status transitions</text>
  <text class="lede" x="24" y="56">Source of truth: TaskStatus.validTransitions in dartclaw_core. Every change is a compare-and-set on status and version (TaskService.transition).</text>
  <g class="node k-host">
    <title>draft: task row exists but is not queued. TaskService.create(autoStart: true) goes straight to queued.</title>
    <path class="edge" d="M150,192 L200,192"/>
    <path class="edge" d="M70,214 L70,440"/>
    <a href="../task-execution-architecture.md#24-state-machine">
    <rect class="box " x="30" y="170" width="120" height="44" rx="6"/>
    <text class="mono" x="42" y="190">draft</text>
    <text class="sub" x="42" y="206">created, not queued</text>
    </a>
  </g>
  <g class="node k-host">
    <title>queued: picked up by the TaskExecutor poll (2 s), oldest first. A full provider lane or a cloning project leaves the task here.</title>
    <path class="edge" d="M340,192 L410,192"/>
    <path class="edge" d="M225,214 L225,440"/>
    <path class="edge" d="M285,214 L285,340"/>
    <a href="../task-execution-architecture.md#33-taskexecutor">
    <rect class="box " x="200" y="170" width="140" height="44" rx="6"/>
    <text class="mono" x="212" y="190">queued</text>
    <text class="sub" x="212" y="206">waiting for dispatch</text>
    </a>
  </g>
  <g class="node k-host">
    <title>running: set by checkout after the execution lease is acquired. startedAt is stamped here.</title>
    <path class="edge" d="M530,192 L620,192"/>
    <path class="edge" d="M500,170 L500,104 L900,104 L900,130"/>
    <path class="edge" d="M430,170 L430,106 L390,106"/>
    <path class="edge" d="M420,214 L420,340"/>
    <path class="edge" d="M470,214 L470,440"/>
    <a href="../task-execution-architecture.md#34-execution-core">
    <rect class="box " x="410" y="170" width="120" height="44" rx="6"/>
    <text class="mono" x="422" y="190">running</text>
    <text class="sub" x="422" y="206">holds a lease</text>
    </a>
  </g>
  <g class="node k-host">
    <title>review: reached after a completed turn unless reviewMode is auto-accept. TaskReviewService applies accept, reject, or push_back.</title>
    <path class="edge" d="M740,184 L840,162"/>
    <path class="edge" d="M740,200 L840,232"/>
    <path class="edge" d="M690,214 L690,265 L525,265 L525,216"/>
    <a href="../task-execution-architecture.md#6-review">
    <rect class="box " x="620" y="170" width="120" height="44" rx="6"/>
    <text class="mono" x="632" y="190">review</text>
    <text class="sub" x="632" y="206">awaiting a decision</text>
    </a>
  </g>
  <g class="node k-store">
    <title>accepted: terminal. Worktree tasks have been merged (local project) or pushed (external project) first.</title>
    <rect class="box " x="840" y="130" width="120" height="44" rx="6"/>
    <text class="mono" x="852" y="150">accepted</text>
    <text class="sub" x="852" y="166">terminal</text>
  </g>
  <g class="node k-sec">
    <title>rejected: terminal. The worktree is cleaned up without merging.</title>
    <rect class="box " x="840" y="210" width="120" height="44" rx="6"/>
    <text class="mono" x="852" y="230">rejected</text>
    <text class="sub" x="852" y="246">terminal</text>
  </g>
  <g class="node k-dev">
    <title>interrupted: valid edges exist (running to interrupted, then queued or cancelled) but no production code transitions a task into it today.</title>
    <path class="edge dashed" d="M300,128 L300,170"/>
    <rect class="box reserved" x="250" y="84" width="140" height="44" rx="6"/>
    <text class="mono" x="262" y="104">interrupted</text>
    <text class="sub" x="262" y="120">reserved, never entered</text>
  </g>
  <g class="node k-sec">
    <title>failed: TaskStatus.terminal is true, but failed to queued is the retry and manual-restart edge. markFailedOrRetry writes the retry bookkeeping while the task is still running, then goes running to failed to queued.</title>
    <path class="edge" d="M330,340 L330,216"/>
    <a href="../task-execution-architecture.md#35-failure-and-retry">
    <rect class="box " x="240" y="340" width="180" height="44" rx="6"/>
    <text class="mono" x="252" y="360">failed</text>
    <text class="sub" x="252" y="376">terminal, or retried</text>
    </a>
  </g>
  <g class="node k-sec">
    <title>cancelled: terminal. TaskCancellationSubscriber cancels the active turn on running to cancelled. The only outgoing edge is the one-shot correction to failed.</title>
    <path class="edge dashed" d="M330,440 L330,386"/>
    <rect class="box " x="30" y="440" width="540" height="44" rx="6"/>
    <text class="mono" x="42" y="460">cancelled</text>
    <text class="sub" x="42" y="476">terminal; reached from draft, queued, interrupted, running</text>
  </g>
  <text class="edge-label" x="156" y="184">start</text>
  <text class="edge-label" x="346" y="184">checkout</text>
  <text class="edge-label" x="552" y="184">turn done</text>
  <text class="edge-label" x="760" y="154">accept</text>
  <text class="edge-label" x="760" y="232">reject</text>
  <text class="edge-label" x="560" y="258">push-back</text>
  <text class="edge-label" x="520" y="98">reviewMode: auto-accept</text>
  <text class="edge-label" x="338" y="282">retry</text>
  <text class="edge-label" x="338" y="420">correction</text>
  <path class="edge" d="M24,525 L64,525"/>
  <text class="note" x="74" y="529">transition</text>
  <path class="edge dashed" d="M170,525 L210,525"/>
  <text class="note" x="220" y="529">reserved or exceptional edge</text>
  <rect class="legend-swatch" x="440" y="517" width="22" height="16" rx="4" style="stroke:var(--store)"/>  <text class="note" x="470" y="529">accepted</text>
  <rect class="legend-swatch" x="540" y="517" width="22" height="16" rx="4" style="stroke:var(--sec)"/>  <text class="note" x="570" y="529">rejected, failed, cancelled (TaskStatus.terminal)</text>
  <text class="note" x="24" y="552">Valid but not drawn: review to queued, review to failed, interrupted to cancelled. Full table: section 2.4.</text>
  <text class="note" x="24" y="572">Opened directly in a browser, hovering a status shows its meaning and highlights its outgoing transitions.</text>
</svg>
