  <g class="d0"><text class="p1" x="36" y="584">Hover a box for what it records and when; its connections light up. Click it to open its section.</text><text class="p2" x="36" y="604">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">DATA FLOW · TurnOutcome → TaskEventRecorder</text>
  <text class="title" x="24" y="58">Turn outcome to task events, traces and runner metrics</text>
  <text class="lede" x="24" y="80">Recording happens when the turn completes, not while it streams. Events are awaited, the trace is not.</text>

  <g class="k-host"><rect class="band" x="16" y="236" width="470" height="132" rx="14"/><text class="kick" x="32" y="258">RUNNER METRICS · EVERY RUNNER TURN</text></g>
  <g class="k-host"><rect class="band" x="530" y="96" width="454" height="398" rx="14"/><text class="kick" x="546" y="118">TaskExecutor · ORDINARY TASK TURNS ONLY</text></g>

