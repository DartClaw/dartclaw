<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc">
  <title id="title">Turn outcome to task events, traces and runner metrics</title>
  <desc id="desc">How a task turn becomes durable records. TurnRunner builds the TurnOutcome from the harness stream; TaskExecutor then awaits task events and fires a trace write without awaiting, while the coordinator feeds RunnerObserver independently.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
    .name { font-size: 13px; font-weight: 600; }
    .badge { fill: var(--accent); }
    .badge-text { fill: var(--bg); font-size: 11px; font-weight: 700; text-anchor: middle; }
    .k-dev .box.reserved, .reserved .box { stroke-dasharray: 5 4; }
    .legend-swatch { fill: none; stroke-width: 1.4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="570"/>
  <text class="title" x="24" y="34">Turn outcome to task events, traces and runner metrics</text>
  <text class="lede" x="24" y="56">Recording happens when the turn completes, not while it streams. Workflow-owned tasks take a different path (note below).</text>
  <g class="node k-ext">
    <title>Claude Code JSONL or Codex JSON-RPC events surfaced by the harness. Wire formats are in Control Protocol.</title>
    <path class="edge" d="M214,138 L264,138"/>
    <rect class="box " x="24" y="100" width="190" height="76" rx="6"/>
    <text class="name" x="36" y="120">Harness stream</text>
    <text class="sub" x="36" y="136">BridgeEvents: tool use,</text>
    <text class="sub" x="36" y="150">tool result, usage with</text>
    <text class="sub" x="36" y="164">provider cache fields</text>
  </g>
  <g class="node k-host">
    <title>dartclaw_runtime/lib/src/turn_runner.dart; tool-hook state in turn_guard_evaluator.dart (maxRetainedToolEvents = 64). Returns a TurnOutcome with token counts, toolCalls, toolCallCount, failedToolCallCount, limitBreach, loopDetection.</title>
    <path class="edge" d="M524,138 L620,138"/>
    <path class="edge" d="M394,176 L394,250"/>
    <rect class="box " x="264" y="100" width="260" height="76" rx="6"/>
    <text class="mono" x="276" y="120">TurnRunner</text>
    <text class="sub" x="276" y="136">ToolCallRecords: first 63 + latest,</text>
    <text class="sub" x="276" y="150">exact counts kept; usage and cache</text>
    <text class="sub" x="276" y="164">tokens normalized by ProtocolAdapter</text>
  </g>
  <g class="node k-host">
    <title>_executeCore step 9. Token and tool events are awaited before the trace write is started, so durable events precede the best-effort trace.</title>
    <path class="edge" d="M700,176 L700,250"/>
    <path class="edge" d="M830,176 L830,250"/>
    <a href="../task-execution-architecture.md#34-execution-core">
    <rect class="box " x="620" y="100" width="230" height="76" rx="6"/>
    <text class="mono" x="632" y="120">TaskExecutor</text>
    <text class="sub" x="632" y="136">after waitForOutcome and</text>
    <text class="sub" x="632" y="150">waitForExecutionSettled;</text>
    <text class="sub" x="632" y="164">ordinary task turns only</text>
    </a>
  </g>
  <g class="node k-host">
    <title>Forwards each terminal outcome once, so primary and worker turns share one metrics path.</title>
    <path class="edge" d="M264,288 L214,288"/>
    <rect class="box " x="264" y="250" width="260" height="76" rx="6"/>
    <text class="mono" x="276" y="270">ExecutionCoordinator</text>
    <text class="sub" x="276" y="286">emits turnSettled with the</text>
    <text class="sub" x="276" y="300">outcome for every runner turn</text>
    <text class="sub" x="276" y="314">(primary and worker)</text>
  </g>
  <g class="node k-host">
    <title>dartclaw_runtime/lib/src/task/runner_observer.dart. In memory; reset on restart. Fires RunnerStateChangedEvent.</title>
    <path class="edge" d="M120,326 L120,423 L330,423"/>
    <a href="../task-execution-architecture.md#76-runnerobserver">
    <rect class="box " x="24" y="250" width="190" height="76" rx="6"/>
    <text class="mono" x="36" y="270">RunnerObserver</text>
    <text class="sub" x="36" y="286">per-runner tokens, turns,</text>
    <text class="sub" x="36" y="300">errors, tool-call counts;</text>
    <text class="sub" x="36" y="314">busy and idle state</text>
    </a>
  </g>
  <g class="node k-host">
    <title>An insert failure propagates to the caller. TaskEventCreatedEvent is fired only after the insert succeeds.</title>
    <path class="edge" d="M700,326 L700,390"/>
    <path class="edge" d="M620,326 L620,358 L435,358 L435,390"/>
    <a href="../task-execution-architecture.md#72-persistence-and-recorder">
    <rect class="box " x="580" y="250" width="200" height="76" rx="6"/>
    <text class="mono" x="592" y="270">TaskEventRecorder</text>
    <text class="sub" x="592" y="286">tokenUpdate, then one</text>
    <text class="sub" x="592" y="300">toolCalled per retained</text>
    <text class="sub" x="592" y="314">record; awaited inserts</text>
    </a>
  </g>
  <g class="node k-host">
    <title>TaskExecutor._persistTrace builds the TurnTrace from the outcome. It is the only producer of turn traces.</title>
    <path class="edge" d="M895,326 L895,390"/>
    <a href="../task-execution-architecture.md#8-turn-traces">
    <rect class="box " x="810" y="250" width="170" height="76" rx="6"/>
    <text class="mono" x="822" y="270">TurnTraceService</text>
    <text class="sub" x="822" y="286">_persistTrace, unawaited;</text>
    <text class="sub" x="822" y="300">failure only logged</text>
    </a>
  </g>
  <g class="node k-host">
    <title>Consumers (TaskProgressTracker, task SSE route) are in the live-progress figure.</title>
    <a href="../task-execution-architecture.md#73-observability-pipeline">
    <rect class="box " x="330" y="390" width="210" height="66" rx="6"/>
    <text class="mono" x="342" y="410">EventBus</text>
    <text class="sub" x="342" y="426">TaskEventCreatedEvent,</text>
    <text class="sub" x="342" y="440">RunnerStateChangedEvent</text>
    </a>
  </g>
  <g class="node k-store">
    <title>PostgreSQL table behind TaskEventService; schema in Data Model.</title>
    <rect class="box " x="580" y="390" width="200" height="66" rx="6"/>
    <text class="mono" x="592" y="410">task_events</text>
    <text class="sub" x="592" y="426">append-only, indexed by</text>
    <text class="sub" x="592" y="440">task_id and kind</text>
  </g>
  <g class="node k-store">
    <title>PostgreSQL table behind TurnTraceService; schema in Data Model.</title>
    <rect class="box " x="810" y="390" width="170" height="66" rx="6"/>
    <text class="mono" x="822" y="410">turns</text>
    <text class="sub" x="822" y="426">one row per traced turn;</text>
    <text class="sub" x="822" y="440">tool calls: JSON envelope</text>
  </g>
  <text class="edge-label" x="402" y="218">turnSettled</text>
  <text class="edge-label" x="540" y="130">TurnOutcome</text>
  <text class="edge-label" x="708" y="218">awaited</text>
  <text class="edge-label" x="838" y="218">unawaited</text>
  <text class="edge-label" x="708" y="362">insert</text>
  <text class="edge-label" x="445" y="374">after insert</text>
  <text class="edge-label" x="128" y="416">state change</text>
  <rect class="group" x="24" y="486" width="956" height="52" rx="6"/>
  <text class="note" x="36" y="508">Workflow-owned tasks (WorkflowOneShotRunner) skip the TaskExecutor recording block: no tokenUpdate or toolCalled events and no turn trace.</text>
  <text class="note" x="36" y="526">They write token breakdown to the step row, record structured-output events, and fire WorkflowCliTurnProgressEvent. Runner metrics still come from the coordinator.</text>
</svg>
