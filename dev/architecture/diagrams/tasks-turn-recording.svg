  <a href="../control-protocol.md#64-tool-calls-usage-and-outcome-fields"><g class="n tint k-ext" id="harness">
    <rect class="box" x="24" y="130" width="150" height="82" rx="9"/>
    <text class="name" x="36" y="153">Harness stream</text>
    <text class="sub" x="36" y="171">tool events, usage,</text>
    <text class="sub" x="36" y="187">cache fields</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">Harness stream</tspan> · Claude Code JSONL or Codex JSON-RPC events, surfaced to the runner as BridgeEvents</text><text class="p2" x="36" y="604">Wire formats and the provider-specific usage and cache fields are in Control Protocol.</text></g>
  </g></a>
  <a href="../control-protocol.md#64-tool-calls-usage-and-outcome-fields"><g class="n tint k-host" id="runner">
    <rect class="box" x="250" y="130" width="220" height="82" rx="9"/>
    <text class="name mono-name" x="262" y="153">TurnRunner</text>
    <text class="sub" x="262" y="171">tool calls: first 63 + latest,</text>
    <text class="sub" x="262" y="187">exact counts kept; usage</text>
    <text class="sub" x="262" y="203">normalized per provider</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">TurnRunner</tspan> · returns the TurnOutcome: token counts, toolCalls, toolCallCount, failedToolCallCount, limitBreach, loopDetection</text><text class="p2" x="36" y="604">turn_guard_evaluator.dart retains 64 tool events (maxRetainedToolEvents), so a long turn records at most 64 toolCalled events.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#34-execution-core"><g class="n solid k-host" id="exec">
    <rect class="box" x="546" y="130" width="422" height="82" rx="9"/>
    <text class="name mono-name" x="558" y="153">TaskExecutor</text>
    <text class="sub" x="558" y="171">after waitForOutcome and waitForExecutionSettled</text>
    <text class="sub" x="558" y="187">record, step 9 of _executeCore</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">TaskExecutor</tspan> · token and tool events are awaited before the trace write starts, so durable events precede the best-effort trace</text><text class="p2" x="36" y="604">Workflow-owned turns skip this block: no tokenUpdate or toolCalled events and no trace. Runner metrics still come from the coordinator.</text></g>
  </g></a>
  <a href="../control-protocol.md#62-execution-allocation"><g class="n tint k-host" id="coord">
    <rect class="box" x="250" y="270" width="220" height="82" rx="9"/>
    <text class="name mono-name" x="262" y="293">ExecutionCoordinator</text>
    <text class="sub" x="262" y="311">emits turnSettled with the</text>
    <text class="sub" x="262" y="327">outcome of every runner turn,</text>
    <text class="sub" x="262" y="343">primary and worker</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">ExecutionCoordinator</tspan> · forwards each terminal turn outcome once, so primary and worker turns share one metrics path</text><text class="p2" x="36" y="604">Lease acquire and release, disposal and quarantine travel on the same coordinator event stream.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#76-runnerobserver"><g class="n tint k-host" id="observer">
    <rect class="box" x="24" y="270" width="150" height="82" rx="9"/>
    <text class="name mono-name" x="36" y="293">RunnerObserver</text>
    <text class="sub" x="36" y="311">tokens, turns, errors</text>
    <text class="sub" x="36" y="327">tool-call counts,</text>
    <text class="sub" x="36" y="343">busy and idle state</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">RunnerObserver</tspan> · task/runner_observer.dart derives per-runner metrics from ExecutionCoordinator.events and fires RunnerStateChangedEvent</text><text class="p2" x="36" y="604">Metrics are in memory and reset on restart; they are not task data and no task row records them.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#72-persistence-and-recorder"><g class="n tint k-host" id="recorder">
    <rect class="box" x="546" y="270" width="206" height="82" rx="9"/>
    <g class="step"><circle cx="566" cy="292" r="10"/><text x="566" y="296">1</text></g>
    <text class="name mono-name" x="584" y="293">TaskEventRecorder</text>
    <text class="sub" x="584" y="311">tokenUpdate, then one</text>
    <text class="sub" x="584" y="327">toolCalled per retained</text>
    <text class="sub" x="584" y="343">record; awaited inserts</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">TaskEventRecorder</tspan> · an insert failure propagates to the caller; TaskEventCreatedEvent is fired only after the insert succeeded</text><text class="p2" x="36" y="604">tokenUpdate carries input, output and cache counts plus tokenUsageComplete; toolCalled carries name, success, durationMs, errorType.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#8-turn-traces"><g class="n tint k-host" id="trace">
    <rect class="box" x="762" y="270" width="206" height="82" rx="9"/>
    <g class="step"><circle cx="782" cy="292" r="10"/><text x="782" y="296">2</text></g>
    <text class="name mono-name" x="800" y="293">TurnTraceService</text>
    <text class="sub" x="800" y="311">_persistTrace, unawaited;</text>
    <text class="sub" x="800" y="327">failure is only logged</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">TurnTraceService</tspan> · TaskExecutor._persistTrace builds the TurnTrace from the outcome; the only producer; failed turns are traced too</text><text class="p2" x="36" y="604">model is the task's override, not the resolved model; tool calls are stored as a JSON envelope (records, count, failedCount, truncated).</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#73-observability-pipeline"><g class="n tint k-host" id="bus">
    <rect class="box" x="24" y="408" width="446" height="70" rx="9"/>
    <text class="name mono-name" x="36" y="431">EventBus</text>
    <text class="sub" x="36" y="449">TaskEventCreatedEvent, RunnerStateChangedEvent</text>
    <text class="sub" x="36" y="465">consumers are in the live-progress figure</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">EventBus</tspan> · in-process typed events; TaskEventCreatedEvent is fired only after the insert succeeded</text><text class="p2" x="36" y="604">TaskProgressTracker and the task SSE route subscribe to it; see the live-progress figure and sections 7.4 to 7.6.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#72-persistence-and-recorder"><g class="n tint k-store" id="events">
    <rect class="box" x="546" y="408" width="206" height="70" rx="9"/>
    <text class="name mono-name" x="558" y="431">task_events</text>
    <text class="sub" x="558" y="449">append-only, indexed by</text>
    <text class="sub" x="558" y="465">task_id and kind</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">task_events</tspan> · PostgreSQL table behind TaskEventService; schema in Data Model</text><text class="p2" x="36" y="604">At startup the server seeds TaskProgressTracker for running tasks from the stored events.</text></g>
  </g></a>
  <a href="../task-execution-architecture.md#8-turn-traces"><g class="n tint k-store" id="turns">
    <rect class="box" x="762" y="408" width="206" height="70" rx="9"/>
    <text class="name mono-name" x="774" y="431">turns</text>
    <text class="sub" x="774" y="449">one row per traced turn;</text>
    <text class="sub" x="774" y="465">tool calls: JSON envelope</text>
    <g class="d"><text class="p1" x="36" y="584"><tspan class="b">turns</tspan> · PostgreSQL table behind TurnTraceService; schema in Data Model</text><text class="p2" x="36" y="604">GET /api/traces filters by taskId, sessionId, runnerId, model, provider and time, newest first, limit up to 500.</text></g>
  </g></a>
