<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-labelledby="title desc">
  <title id="title">Turn outcome to task events, traces and runner metrics</title>
  <desc id="desc">A turn's TurnOutcome reaches two consumers. TaskExecutor awaits tokenUpdate and toolCalled events into task_events, then persists a turn trace without awaiting it. ExecutionCoordinator forwards every runner turn as turnSettled to RunnerObserver, which fires runner state events. Workflow-owned tasks skip the TaskExecutor block.</desc>
