<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" role="img" aria-labelledby="title desc">
  <title id="title">Workflow run status</title>
  <desc id="desc">The seven WorkflowRunStatus values and every transition the service and executor perform. A run starts pending, runs, and ends completed, failed or cancelled. Paused and awaitingApproval are holds that resume into running or are cancelled; failed re-enters running only through an explicit retry.</desc>
  <style>

    svg { --bg:#f6f7f9; --card:#ffffff; --ink:#1e2030; --ink2:#4c4f69; --ink3:#6c6f85; --rule:#ccd0da; --edge:#8c8fa1; --hi:#1e66f5; --on:#ffffff; --panel:#1e1e2e; --panel-ink:#cdd6f4; --panel-sub:#a6adc8; --panel-kick:#fab387;
      --host:#40a02b; --host-d:#1f5c2a; --host-l:#2d7a1f; --ext:#e07c4f; --ext-d:#a8481c; --ext-l:#b5531f; --store:#179299; --store-d:#0f5f63; --store-l:#0e7377;
      --sec:#d20f39; --sec-d:#9b0c2c; --sec-l:#b80d33; --chan:#8839ef; --chan-d:#5d23a8; --chan-l:#7027d4; --neu:#7c7f93; --neu-d:#4c4f69; --neu-l:#5c5f77; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#181825; --card:#1e1e2e; --ink:#cdd6f4; --ink2:#bac2de; --ink3:#9399b2; --rule:#45475a; --edge:#7f849c; --hi:#89b4fa; --on:#f5f7ff; --panel:#11111b; --panel-ink:#cdd6f4; --panel-sub:#a6adc8; --panel-kick:#fab387;
        --host:#a6e3a1; --host-d:#2f6b3a; --host-l:#a6e3a1; --ext:#fab387; --ext-d:#8f4a24; --ext-l:#fab387; --store:#94e2d5; --store-d:#1f6460; --store-l:#94e2d5;
        --sec:#f38ba8; --sec-d:#8a2c45; --sec-l:#f38ba8; --chan:#cba6f7; --chan-d:#5e3f94; --chan-l:#cba6f7; --neu:#9399b2; --neu-d:#45475a; --neu-l:#bac2de; }
    }
    text { fill: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .mono, .kick, .badge text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .title { font-size: 21px; font-weight: 700; }
    .lede { fill: var(--ink3); font-size: 13px; }
    .kick { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; fill: var(--kl, var(--ink3)); }
    .k-host { --k:var(--host); --kd:var(--host-d); --kl:var(--host-l); }
    .k-ext { --k:var(--ext); --kd:var(--ext-d); --kl:var(--ext-l); }
    .k-store { --k:var(--store); --kd:var(--store-d); --kl:var(--store-l); }
    .k-sec { --k:var(--sec); --kd:var(--sec-d); --kl:var(--sec-l); }
    .k-chan { --k:var(--chan); --kd:var(--chan-d); --kl:var(--chan-l); }
    .k-neu { --k:var(--neu); --kd:var(--neu-d); --kl:var(--neu-l); }
    .band { fill: color-mix(in srgb, var(--k) 6%, var(--bg)); stroke: color-mix(in srgb, var(--k) 50%, var(--bg)); stroke-width: 1.4; stroke-dasharray: 7 5; }
    .box { stroke-width: 1.5; }
    .tint .box { fill: color-mix(in srgb, var(--k) 13%, var(--card)); stroke: var(--k); }
    .line .box { fill: var(--card); stroke: var(--k); }
    .ghost .box { fill: none; stroke: var(--k); stroke-dasharray: 5 4; }
    .solid .box { fill: var(--kd); stroke: var(--kd); }
    .name { font-size: 14.5px; font-weight: 700; }
    .sub { font-size: 11.5px; fill: var(--ink2); }
    .mono { font-size: 11.5px; fill: var(--ink2); }
    .solid text { fill: var(--on); }
    .solid .sub, .solid .mono { fill: var(--on); fill-opacity: .82; }
    .badge rect { fill: none; stroke: var(--kl); stroke-width: 1.2; }
    .badge text { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; fill: var(--kl); text-anchor: middle; }
    .solid .badge rect { stroke: var(--on); stroke-opacity: .7; }
    .solid .badge text { fill: var(--on); }
    .e path { fill: none; stroke: var(--ec, var(--edge)); stroke-width: var(--ew, 1.6px); marker-end: var(--em, url(#ah)); }
    .e.main path { stroke: var(--ec, var(--host)); stroke-width: var(--ew, 2.4px); marker-end: var(--em, url(#ah-main)); }
    .e.bad path { stroke: var(--ec, var(--sec)); marker-end: var(--em, url(#ah-bad)); }
    .e.dash path { stroke-dasharray: 6 4; }
    .el { font-size: 11px; fill: var(--ink2); paint-order: stroke; stroke: var(--halo, var(--bg)); stroke-width: 4px; stroke-linejoin: round; }
    .in-host .el { --halo: color-mix(in srgb, var(--host) 6%, var(--bg)); }
    .ah { fill: var(--edge); } .ah-main { fill: var(--host); } .ah-bad { fill: var(--sec); } .ah-hi { fill: var(--hi); }
    .panel { fill: var(--panel); }
    .panel-kick { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; fill: var(--panel-kick); }
    .p1 { fill: var(--panel-ink); font-size: 13px; }
    .p1 tspan.b { font-weight: 700; }
    .p2 { fill: var(--panel-sub); font-size: 12.5px; }
    .lg { font-size: 11px; fill: var(--ink2); }
    .chip rect { fill: color-mix(in srgb, var(--k) 10%, var(--card)); stroke: var(--k); stroke-width: 1; }
    .chip text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: var(--kl); }
    .step circle { fill: var(--kd); } .step text { fill: var(--on); font-size: 11px; font-weight: 700; text-anchor: middle; }
    /* Interaction, effective only when the SVG is opened directly. */
    .n { cursor: pointer; }
    .n:hover .box, a:focus-visible .box { stroke: var(--hi); stroke-width: 2.8; }
    .d { display: none; pointer-events: none; }
    .n:hover .d, a:focus-visible .d { display: inline; }
    svg:has(.n:hover) .d0, svg:has(a:focus-visible) .d0 { display: none; }
    svg:has(.n:hover) .edges .e { opacity: .14; }
    .e.join path { marker-end: none; }
    .band.inner { fill: none; stroke-dasharray: 3 4; }
    .mono-name { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13.5px; }
    svg:has(#pending:hover) .edges :is(.f-pending,.t-pending) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#running:hover) .edges :is(.f-running,.t-running) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#completed:hover) .edges :is(.f-completed,.t-completed) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#failed:hover) .edges :is(.f-failed,.t-failed) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#paused:hover) .edges :is(.f-paused,.t-paused) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#awaiting:hover) .edges :is(.f-awaiting,.t-awaiting) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#cancelled:hover) .edges :is(.f-cancelled,.t-cancelled) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path class="ah-main" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-bad" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="670"/>
  <!-- Details panel: painted first so node details (.d) draw on top -->
  <rect class="panel" x="16" y="574" width="968" height="80" rx="12"/>
  <text class="panel-kick" x="36" y="598">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="622">Hover a status for what it means; its transitions light up. Click it to open its section.</text><text class="p2" x="36" y="642">A chip inside a box (→ cancelled) is a valid transition that is not drawn as an arrow.</text></g>

  <text class="kick" x="24" y="32">STATE MACHINE · WorkflowRunStatus</text>
  <text class="title" x="24" y="58">Workflow run status</text>
  <text class="lede" x="24" y="80">No transition table: each move is a conditional update on the expected status. Waiting on a human is a hold, not a failure.</text>



  <g class="edges">
    <g class="e main f-pending t-running"><path d="M190,252 H268"/><text class="el" x="229" y="244" text-anchor="middle">start</text></g>
    <g class="e main f-running t-completed"><path d="M540,228 H640 V140 H778"/><text class="el" x="646" y="132" text-anchor="start">all nodes done</text></g>
    <g class="e bad f-running t-failed"><path d="M540,258 H778"/><text class="el" x="548" y="250" text-anchor="start">step, gate or budget failure</text></g>
    <g class="e  f-failed t-running"><path d="M778,278 H542"/><text class="el" x="660" y="292" text-anchor="middle">retry</text></g>
    <g class="e  f-running t-paused"><path d="M290,288 V358"/><text class="el" x="284" y="330" text-anchor="end">pause</text></g>
    <g class="e  f-paused t-running"><path d="M330,360 V290"/><text class="el" x="338" y="330" text-anchor="start">resume</text></g>
    <g class="e  f-running t-awaiting"><path d="M500,288 V358"/><text class="el" x="494" y="350" text-anchor="end">hold</text></g>
    <g class="e  f-awaiting t-running"><path d="M520,360 V290"/><text class="el" x="528" y="330" text-anchor="start">approve, request changes</text></g>
    <g class="e  f-running t-cancelled"><path d="M420,288 V466"/><text class="el" x="428" y="314" text-anchor="start">cancel</text></g>
    <g class="e  f-paused t-cancelled"><path d="M230,432 V466"/><text class="el" x="238" y="454" text-anchor="start">cancel</text></g>
    <g class="e  f-awaiting t-cancelled"><path d="M620,432 V466"/><text class="el" x="628" y="454" text-anchor="start">reject, cancel, timeout</text></g>
  </g>

  <a href="../workflow-architecture.md#52-start-and-trigger-convergence"><g class="n line k-neu" id="pending">
    <rect class="box" x="24" y="216" width="166" height="72" rx="9"/>
    <text class="name mono-name" x="36" y="239">pending</text>
    <text class="sub" x="36" y="257">momentary, in start()</text>
    <g class="chip k-neu"><rect x="36" y="264" width="82" height="16" rx="8"/><text x="43" y="276">→ cancelled</text></g>
    <g class="d"><text class="p1" x="36" y="622"><tspan class="b">pending</tspan> · start() inserts the run, then updates it to running (expected status pending) before spawning the executor</text><text class="p2" x="36" y="642">Not terminal, so cancel would accept it; the window is one call, hence a chip and no arrow.</text></g>
  </g></a>
  <a href="../workflow-architecture.md#53-executor-preflight-and-traversal"><g class="n solid k-host" id="running">
    <rect class="box" x="270" y="216" width="270" height="72" rx="9"/>
    <text class="name mono-name" x="282" y="239">running</text>
    <g class="badge"><rect x="441" y="227" width="89" height="16" rx="8"/><text x="486" y="239">updateOwned</text></g>
    <text class="sub" x="282" y="257">executor active; it writes only</text>
    <text class="sub" x="282" y="273">while the status is still running</text>
    <g class="d"><text class="p1" x="36" y="622"><tspan class="b">running</tspan> · every executor write is a conditional update on running (updateOwned)</text><text class="p2" x="36" y="642">A changed status throws WorkflowRunOwnershipLost and stops it. A restart re-spawns running runs at the cursor, status unchanged.</text></g>
  </g></a>
  <a href="../workflow-architecture.md#53-executor-preflight-and-traversal"><g class="n solid k-store" id="completed">
    <rect class="box" x="780" y="104" width="180" height="72" rx="9"/>
    <text class="name mono-name" x="792" y="127">completed</text>
    <text class="sub" x="792" y="145">terminal, success</text>
    <g class="d"><text class="p1" x="36" y="622"><tspan class="b">completed</tspan> · all nodes done; the publish hook ran if gitStrategy.publish is enabled</text><text class="p2" x="36" y="642">The cursor is cleared, completedAt set and git cleanup invoked. A publish error fails the run instead.</text></g>
  </g></a>
  <a href="../workflow-architecture.md#54-pause-resume-retry-cancel"><g class="n tint k-sec" id="failed">
    <rect class="box" x="780" y="216" width="180" height="72" rx="9"/>
    <text class="name mono-name" x="792" y="239">failed</text>
    <text class="sub" x="792" y="257">terminal, retryable</text>
    <g class="d"><text class="p1" x="36" y="622"><tspan class="b">failed</tspan> · step, gate, budget or accounting failure, preflight or publish error, or an unexpected executor exception</text><text class="p2" x="36" y="642">Only failed accepts retry: it clears the failed step's status, error and outcome keys, then re-enters running at the cursor.</text></g>
  </g></a>
  <a href="../workflow-architecture.md#54-pause-resume-retry-cancel"><g class="n tint k-ext" id="paused">
    <rect class="box" x="130" y="360" width="220" height="72" rx="9"/>
    <text class="name mono-name" x="142" y="383">paused</text>
    <text class="sub" x="142" y="401">operator pause, or</text>
    <text class="sub" x="142" y="417">onError: pause hold</text>
    <g class="d"><text class="p1" x="36" y="622"><tspan class="b">paused</tspan> · operator pause, an onError: pause hold, or a step whose task was cancelled while the run was running</text><text class="p2" x="36" y="642">Pause sets the cancel flag and aborts the executor's wait; in-flight tasks keep running. Resume re-enters running at the cursor.</text></g>
  </g></a>
  <a href="../workflow-architecture.md#82-approval"><g class="n tint k-ext" id="awaiting">
    <rect class="box" x="480" y="360" width="260" height="72" rx="9"/>
    <text class="name mono-name" x="492" y="383">awaitingApproval</text>
    <text class="sub" x="492" y="401">approval gate, needsInput,</text>
    <text class="sub" x="492" y="417">onFailure: pause</text>
    <g class="d"><text class="p1" x="36" y="622"><tspan class="b">awaitingApproval</tspan> · approval gate, step needsInput outcome or onFailure: pause; all use the _approval.* hold shape</text><text class="p2" x="36" y="642">Approve (resume) continues at the next step; request changes re-enters running at the revise step; reject, cancel or timeout cancels.</text></g>
  </g></a>
  <a href="../workflow-architecture.md#54-pause-resume-retry-cancel"><g class="n tint k-neu" id="cancelled">
    <rect class="box" x="130" y="468" width="630" height="60" rx="9"/>
    <text class="name mono-name" x="142" y="491">cancelled</text>
    <text class="sub" x="142" y="509">terminal · cancel, reject or approval timeout</text>
    <g class="d"><text class="p1" x="36" y="622"><tspan class="b">cancelled</tspan> · cancel records a pending approval as rejected, cancels queued and running child tasks and invokes git cleanup</text><text class="p2" x="36" y="642">Reachable from pending, running, paused and awaitingApproval. An approval timeout also lands here, with approval status timed_out.</text></g>
  </g></a>
  <g transform="translate(24,548)">
    <g class="solid k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">active</text>
    <g class="tint k-ext"><rect class="box" x="81.2" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="103.2" y="10">human hold</text>
    <g class="solid k-store"><rect class="box" x="187.2" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="209.2" y="10">success</text>
    <g class="tint k-sec"><rect class="box" x="274.6" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="296.6" y="10">failure</text>
    <g class="tint k-neu"><rect class="box" x="362.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="384.0" y="10">operator-ended</text>
    <g class="e main"><path d="M492.8,6 H524.8"/></g><text class="lg" x="532.8" y="10">main path</text>
    <g class="e bad"><path d="M610.6,6 H642.6"/></g><text class="lg" x="650.6" y="10">failure</text>
    <g class="e "><path d="M716.0,6 H748.0"/></g><text class="lg" x="756.0" y="10">transition</text>
  </g>
</svg>
