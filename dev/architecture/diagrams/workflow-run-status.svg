<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="title desc">
  <title id="title">Run status transitions</title>
  <desc id="desc">WorkflowRunStatus: pending moves to running at start. Running ends in completed, failed or cancelled, or is held as paused or awaitingApproval; holds resume to running and failed can be retried.</desc>
  <style>
    svg { --bg:#eff1f5; --band:#e6e9ef; --box:#ffffff; --line:#9ca0b0; --fg:#4c4f69; --sub:#6c6f85; --edge:#8c8fa1; --accent:#1e66f5; --host:#1e66f5; --ext:#fe640b; --store:#179299; --sec:#d20f39; --chan:#8839ef; --dev:#7c7f93; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#1e1e2e; --band:#181825; --box:#313244; --line:#6c7086; --fg:#cdd6f4; --sub:#a6adc8; --edge:#7f849c; --accent:#89b4fa; --host:#89b4fa; --ext:#fab387; --store:#94e2d5; --sec:#f38ba8; --chan:#cba6f7; --dev:#9399b2; }
    }
    text { fill: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .title { font-size: 18px; font-weight: 600; }
    .lede, .sub, .note { fill: var(--sub); }
    .sub { font-size: 11px; }
    .note { font-size: 11.5px; }
    .tier { font-size: 15px; font-weight: 700; }
    .tier-sub { fill: var(--sub); font-size: 10.5px; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
    .chip-text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
    .box { fill: color-mix(in srgb, var(--k) 10%, var(--box)); stroke: var(--k); stroke-width: 1.4; }
    .chip { fill: var(--box); stroke: var(--line); }
    .k-host { --k: var(--host); }
    .k-chan { --k: var(--chan); }
    .k-ext { --k: var(--ext); }
    .k-store { --k: var(--store); }
    .k-sec { --k: var(--sec); }
    .k-dev { --k: var(--dev); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 6 4; }
    .group-label { fill: var(--sub); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .k-dev .box { stroke-dasharray: 5 4; fill: var(--box); }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label { fill: var(--sub); font-size: 10.5px; }
    .arrowhead { fill: var(--edge); }
    .arrowhead-hi { fill: var(--accent); }
    .node { cursor: default; }
    .node:hover .box { stroke-width: 2.6; }
    svg:has(.node:hover) .edge { opacity: 0.2; }
    svg .node:hover .edge { opacity: 1; stroke: var(--accent); stroke-width: 2.2; marker-end: url(#arrow-hi); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead-hi" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="490"/>
  <text class="title" x="24" y="34">Run status transitions</text>
  <text class="lede" x="24" y="56">Waiting on a human (awaitingApproval, paused) is a hold, not a failure. Only completed, failed and cancelled are terminal.</text>
  <g class="node k-host">
    <title>start() inserts the run as pending and updates it to running before the executor is spawned.</title>
    <path class="edge" d="M164,200 H300"/>
    <rect class="box" x="24" y="170" width="140" height="60" rx="6"/>
    <text class="mono" x="38" y="191">pending</text>
    <text class="sub" x="38" y="208">inserted, momentary</text>
  </g>
  <text class="edge-label" x="232" y="192" text-anchor="middle">start</text>
  <a href="../workflow-architecture.md#51-status-model">
  <g class="node k-host">
    <title>The executor stops with WorkflowRunOwnershipLost when the status changed externally. A server restart re-spawns running runs from the persisted cursor.</title>
    <path class="edge" d="M560,170 H640 V120 H780"/>
    <path class="edge" d="M560,200 H780"/>
    <path class="edge" d="M560,244 H700 V320 H780"/>
    <path class="edge" d="M330,250 V340"/>
    <path class="edge" d="M510,250 V340"/>
    <rect class="box" x="300" y="150" width="260" height="100" rx="6"/>
    <text class="mono" x="314" y="171">running</text>
    <text class="sub" x="314" y="188">executor active; updateOwned</text>
    <text class="sub" x="314" y="202">writes only while running</text>
  </g>
  </a>
  <g class="node k-store">
    <title>Publish hook ran if enabled; cursor cleared; git cleanup invoked.</title>
    <rect class="box" x="780" y="90" width="196" height="60" rx="6"/>
    <text class="mono" x="794" y="111">completed</text>
    <text class="sub" x="794" y="128">publish, cleanup, cursor cleared</text>
  </g>
  <g class="node k-sec">
    <title>Eligible for explicit retry from the stored cursor; the failed step status and outcome keys are cleared first.</title>
    <path class="edge" d="M780,222 H562"/>
    <rect class="box" x="780" y="170" width="196" height="60" rx="6"/>
    <text class="mono" x="794" y="191">failed</text>
    <text class="sub" x="794" y="208">retry resumes at the cursor</text>
  </g>
  <g class="node k-dev">
    <title>Cancel records a pending approval as rejected, cancels child tasks and invokes git cleanup.</title>
    <rect class="box" x="780" y="290" width="196" height="60" rx="6"/>
    <text class="mono" x="794" y="311">cancelled</text>
    <text class="sub" x="794" y="328">cancel, reject, timeout</text>
  </g>
  <text class="edge-label" x="650" y="112" text-anchor="start">all nodes done</text>
  <text class="edge-label" x="588" y="194" text-anchor="start">step, gate or budget failure</text>
  <text class="edge-label" x="640" y="216" text-anchor="middle">retry</text>
  <text class="edge-label" x="708" y="290" text-anchor="start">cancel</text>
  <a href="../workflow-architecture.md#54-pause-resume-retry-cancel">
  <g class="node k-chan">
    <title>Pause sets the cancellation flag and aborts the executor wait; in-flight tasks are not cancelled. onError: pause holds the run at its failed unit. Resume continues from the cursor.</title>
    <path class="edge" d="M420,340 V252"/>
    <path class="edge" d="M375,400 V432 H880 V352"/>
    <rect class="box" x="290" y="340" width="170" height="60" rx="6"/>
    <text class="mono" x="304" y="361">paused</text>
    <text class="sub" x="304" y="378">operator pause, or</text>
    <text class="sub" x="304" y="392">onError: pause hold</text>
  </g>
  </a>
  <a href="../workflow-architecture.md#82-approval">
  <g class="node k-chan">
    <title>Approve (resume) continues at the next step; request changes re-runs from the revise step; reject, cancel or timeout cancels. Uses the _approval.* context keys.</title>
    <path class="edge" d="M540,340 V252"/>
    <path class="edge" d="M730,370 H840 V352"/>
    <rect class="box" x="500" y="340" width="230" height="60" rx="6"/>
    <text class="mono" x="514" y="361">awaitingApproval</text>
    <text class="sub" x="514" y="378">approval gate, needsInput,</text>
    <text class="sub" x="514" y="392">onFailure: pause</text>
  </g>
  </a>
  <text class="edge-label" x="336" y="300" text-anchor="start">pause</text>
  <text class="edge-label" x="426" y="300" text-anchor="start">resume</text>
  <text class="edge-label" x="504" y="300" text-anchor="end">hold</text>
  <text class="edge-label" x="546" y="300" text-anchor="start">approve, request changes</text>
  <text class="edge-label" x="740" y="364" text-anchor="start">reject / timeout</text>
  <text class="edge-label" x="470" y="426" text-anchor="start">cancel</text>
  <rect x="24" y="456" width="26" height="14" rx="3" fill="none" stroke="var(--store)" stroke-width="1.4"/>
  <text class="note" x="58" y="467">terminal, success</text>
  <rect x="190" y="456" width="26" height="14" rx="3" fill="none" stroke="var(--sec)" stroke-width="1.4"/>
  <text class="note" x="224" y="467">terminal, failure (retryable)</text>
  <rect x="410" y="456" width="26" height="14" rx="3" fill="none" stroke="var(--chan)" stroke-width="1.4"/>
  <text class="note" x="444" y="467">operator or approval hold</text>
  <rect x="610" y="456" width="26" height="14" rx="3" fill="none" stroke="var(--dev)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="note" x="644" y="467">terminal, cancelled</text>
</svg>
