<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DartClaw - Empty App (First Launch)</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../dartclaw-public/dev/design-system/tokens.css">
  <link rel="stylesheet" href="../../../dartclaw-public/dev/design-system/components.css">
  <link rel="stylesheet" href="../../../dartclaw-public/dev/design-system/icons.css">
</head>
<body>

<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">&#10095; DartClaw</span>
    </div>
    <div class="session-list">
      <div class="sidebar-section-label">Workspace</div>
      <div class="session-item" data-icon="terminal">Agent</div>

      <div class="sidebar-section-label">Channels</div>
      <div class="session-item" data-icon="hash">WhatsApp Alice</div>

      <div class="sidebar-section-label">Sessions</div>
      <button class="btn btn-ghost btn-new-session" data-icon="new-session" style="width:calc(100% - var(--sp-6));margin:0 var(--sp-3) var(--sp-2);">New Session</button>
      <!-- No sessions yet -->
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">System</div>
      <a href="health-dashboard.html" class="sidebar-nav-item" data-icon="health">Health</a>
      <a href="settings-page.html" class="sidebar-nav-item" data-icon="settings">Settings</a>
      <a href="memory-dashboard.html" class="sidebar-nav-item" data-icon="memory">Memory</a>
      <a href="scheduling-status.html" class="sidebar-nav-item" data-icon="scheduling">Scheduling</a>
    </div>
  </aside>

  <!-- Topbar -->
  <header class="topbar">
    <button class="btn btn-icon btn-ghost menu-toggle" data-icon="menu" aria-label="Open sidebar" onclick="document.querySelector('.sidebar').classList.toggle('open')"></button>
    <span class="session-title" style="color: var(--fg-overlay); font-weight: var(--weight-normal);">No session selected</span>
    <div class="topbar-actions">
      <button class="theme-toggle" aria-label="Toggle theme"></button>
    </div>
  </header>

  <!-- Chat area -->
  <main class="chat-area">
    <div class="empty-state" style="flex: 1;">
      <div class="icon">&#10095;_</div>
      <p><strong>No sessions yet</strong></p>
      <p>Create a new session to start chatting with DartClaw.</p>
      <button class="btn btn-primary">+ New Session</button>
    </div>
  </main>

</div>

<script>
  // Theme toggle
  const toggle = document.querySelector('.theme-toggle');
  toggle.addEventListener('click', () => {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'light' ? null : 'light';
    if (next) {
      html.setAttribute('data-theme', next);
    } else {
      html.removeAttribute('data-theme');
    }
  });
</script>

</body>
</html>
