<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DartClaw - Loading Skeletons</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../dartclaw-public/dev/design-system/tokens.css">
  <link rel="stylesheet" href="../../../dartclaw-public/dev/design-system/components.css">
  <link rel="stylesheet" href="../../../dartclaw-public/dev/design-system/icons.css">
  <style>
    body {
      padding: var(--sp-6);
      max-width: 1100px;
      margin: 0 auto;
    }

    .page-title {
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: var(--fg);
      margin-bottom: var(--sp-1);
    }

    .page-desc {
      font-size: var(--text-sm);
      color: var(--fg-sub0);
      margin-bottom: var(--sp-8);
    }

    /* --- Section --- */
    .skeleton-section {
      margin-bottom: var(--sp-8);
    }

    .skeleton-section-title {
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      color: var(--fg);
      margin-bottom: var(--sp-4);
    }

    /* --- Shimmer animation --- */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    .skel {
      background: var(--bg-surface0);
      background-image: linear-gradient(
        90deg,
        var(--bg-surface0) 0%,
        var(--bg-surface1) 40%,
        var(--bg-surface0) 80%
      );
      background-size: 400px 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: var(--radius);
    }

    .skel-line {
      height: 12px;
      margin-bottom: var(--sp-2);
    }

    .skel-line-sm {
      height: 10px;
      margin-bottom: var(--sp-1);
    }

    .skel-block {
      border-radius: var(--radius);
    }

    /* --- Preview frames --- */
    .preview-frame {
      background: var(--bg-crust);
      border: var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    /* === CHAT PAGE SKELETON === */
    .chat-skel {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--topbar-h) 1fr;
      height: 420px;
    }

    .chat-skel-sidebar {
      grid-row: 1 / -1;
      background: var(--bg-mantle);
      border-right: var(--border);
      padding: var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .chat-skel-sidebar-header {
      height: 28px;
      width: 60%;
      margin-bottom: var(--sp-3);
    }

    .chat-skel-sidebar-btn {
      height: 32px;
      width: 100%;
      margin-bottom: var(--sp-2);
    }

    .chat-skel-session {
      height: 40px;
      width: 100%;
    }

    .chat-skel-topbar {
      background: var(--bg-mantle);
      border-bottom: var(--border);
      display: flex;
      align-items: center;
      padding: 0 var(--sp-3);
      gap: var(--sp-3);
    }

    .chat-skel-topbar-icon {
      width: 24px;
      height: 24px;
      border-radius: var(--radius);
      flex-shrink: 0;
    }

    .chat-skel-topbar-title {
      height: 16px;
      width: 180px;
    }

    .chat-skel-messages {
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }

    .chat-skel-msg {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .chat-skel-msg-role {
      height: 10px;
      width: 50px;
    }

    .chat-skel-msg-line {
      height: 12px;
    }

    /* === SESSION INFO SKELETON === */
    .info-skel {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--topbar-h) 1fr;
      height: 380px;
    }

    .info-skel-sidebar {
      grid-row: 1 / -1;
      background: var(--bg-mantle);
      border-right: var(--border);
    }

    .info-skel-topbar {
      background: var(--bg-mantle);
      border-bottom: var(--border);
      display: flex;
      align-items: center;
      padding: 0 var(--sp-3);
      gap: var(--sp-3);
    }

    .info-skel-content {
      padding: var(--sp-6) var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      max-width: 600px;
    }

    .info-skel-title {
      height: 20px;
      width: 220px;
    }

    .info-skel-subtitle {
      height: 12px;
      width: 280px;
    }

    .info-skel-label {
      height: 10px;
      width: 90px;
      margin-bottom: var(--sp-2);
    }

    .info-skel-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-2);
    }

    .info-skel-stat {
      height: 56px;
      border: var(--border);
    }

    .info-skel-stat-wide {
      grid-column: 1 / -1;
      height: 48px;
      border: var(--border);
    }

    .info-skel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--sp-2) 0;
      border-bottom: 1px solid color-mix(in srgb, var(--bg-surface0) 50%, transparent);
    }

    .info-skel-row-label {
      height: 12px;
      width: 80px;
    }

    .info-skel-row-value {
      height: 12px;
      width: 120px;
    }

    /* === HEALTH DASHBOARD SKELETON === */
    .health-skel {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--topbar-h) 1fr;
      height: 420px;
    }

    .health-skel-sidebar {
      grid-row: 1 / -1;
      background: var(--bg-mantle);
      border-right: var(--border);
    }

    .health-skel-topbar {
      background: var(--bg-mantle);
      border-bottom: var(--border);
      display: flex;
      align-items: center;
      padding: 0 var(--sp-3);
      gap: var(--sp-3);
    }

    .health-skel-content {
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      max-width: var(--container-max);
      margin: 0 auto;
      width: 100%;
    }

    .health-skel-hero {
      height: 80px;
      border: var(--border);
    }

    .health-skel-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-3);
    }

    .health-skel-card {
      height: 72px;
      border: var(--border);
    }

    .health-skel-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3);
    }

    .health-skel-metric {
      height: 100px;
      border: var(--border);
    }

    /* --- Divider --- */
    .section-divider {
      border: none;
      border-top: 1px solid var(--bg-surface0);
      margin: var(--sp-6) 0;
    }
  </style>
</head>
<body>

<h1 class="page-title">Loading Skeletons</h1>
<p class="page-desc">CSS shimmer skeletons shown during initial page load. Use <code style="background:var(--bg-surface0);padding:0.1em 0.4em;border-radius:var(--radius);font-size:var(--text-xs);">var(--bg-surface0)</code> as base with animated gradient overlay.</p>

<!-- Chat Page Skeleton -->
<div class="skeleton-section">
  <div class="skeleton-section-title">Chat Page</div>
  <div class="preview-frame">
    <div class="chat-skel">
      <!-- Sidebar -->
      <div class="chat-skel-sidebar">
        <div class="skel chat-skel-sidebar-header"></div>
        <div class="skel chat-skel-sidebar-btn"></div>
        <div class="skel chat-skel-session"></div>
        <div class="skel chat-skel-session"></div>
        <div class="skel chat-skel-session"></div>
      </div>
      <!-- Topbar -->
      <div class="chat-skel-topbar">
        <div class="skel chat-skel-topbar-icon"></div>
        <div class="skel chat-skel-topbar-title"></div>
      </div>
      <!-- Messages -->
      <div class="chat-skel-messages">
        <div class="chat-skel-msg">
          <div class="skel chat-skel-msg-role"></div>
          <div class="skel chat-skel-msg-line" style="width:85%"></div>
          <div class="skel chat-skel-msg-line" style="width:60%"></div>
        </div>
        <div class="chat-skel-msg">
          <div class="skel chat-skel-msg-role"></div>
          <div class="skel chat-skel-msg-line" style="width:90%"></div>
          <div class="skel chat-skel-msg-line" style="width:75%"></div>
          <div class="skel chat-skel-msg-line" style="width:40%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<hr class="section-divider">

<!-- Session Info Skeleton -->
<div class="skeleton-section">
  <div class="skeleton-section-title">Session Info</div>
  <div class="preview-frame">
    <div class="info-skel">
      <div class="info-skel-sidebar"></div>
      <div class="info-skel-topbar">
        <div class="skel chat-skel-topbar-icon"></div>
        <div class="skel" style="height:14px;width:100px;"></div>
      </div>
      <div class="info-skel-content">
        <div>
          <div class="skel info-skel-title"></div>
          <div class="skel info-skel-subtitle" style="margin-top:var(--sp-2);"></div>
        </div>
        <div>
          <div class="skel info-skel-label"></div>
          <div class="info-skel-stats">
            <div class="skel info-skel-stat skel-block"></div>
            <div class="skel info-skel-stat skel-block"></div>
            <div class="skel info-skel-stat-wide skel-block"></div>
          </div>
        </div>
        <div>
          <div class="skel info-skel-label"></div>
          <div class="info-skel-row">
            <div class="skel info-skel-row-label"></div>
            <div class="skel info-skel-row-value"></div>
          </div>
          <div class="info-skel-row">
            <div class="skel info-skel-row-label"></div>
            <div class="skel info-skel-row-value"></div>
          </div>
          <div class="info-skel-row">
            <div class="skel info-skel-row-label"></div>
            <div class="skel info-skel-row-value" style="width:200px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<hr class="section-divider">

<!-- Health Dashboard Skeleton -->
<div class="skeleton-section">
  <div class="skeleton-section-title">Health Dashboard</div>
  <div class="preview-frame">
    <div class="health-skel">
      <div class="health-skel-sidebar"></div>
      <div class="health-skel-topbar">
        <div class="skel chat-skel-topbar-icon"></div>
        <div class="skel" style="height:14px;width:140px;"></div>
      </div>
      <div class="health-skel-content">
        <!-- Status hero -->
        <div class="skel health-skel-hero skel-block"></div>
        <!-- 4-column metric cards (matches actual health-dashboard.html metrics-grid) -->
        <div class="health-skel-cards">
          <div class="skel health-skel-card skel-block"></div>
          <div class="skel health-skel-card skel-block"></div>
          <div class="skel health-skel-card skel-block"></div>
          <div class="skel health-skel-card skel-block"></div>
        </div>
        <!-- Full-width service status cards (2-column grid) -->
        <div class="health-skel-metrics">
          <div class="skel health-skel-metric skel-block"></div>
          <div class="skel health-skel-metric skel-block"></div>
          <div class="skel health-skel-metric skel-block"></div>
          <div class="skel health-skel-metric skel-block"></div>
        </div>
        <!-- Guard audit table placeholder -->
        <div class="skel skel-block" style="height:120px;border:var(--border);"></div>
      </div>
    </div>
  </div>
</div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'light' ? '' : 'light';
  localStorage.setItem('dartclaw-theme', html.dataset.theme || 'dark');
}
const saved = localStorage.getItem('dartclaw-theme');
if (saved === 'light') document.documentElement.dataset.theme = 'light';
</script>

<div style="position:fixed;top:var(--sp-3);right:var(--sp-3);">
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
</div>

</body>
</html>
