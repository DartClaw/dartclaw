# DartClaw — Channels Testing Config (WhatsApp, Signal and Google Chat enabled; Slack ready, off by default)
# Usage: bash dev/testing/profiles/channels/run.sh

port: 3336

database:
  url: ${DARTCLAW_POSTGRES_URL}

# Declared, not inferred: these profiles exercise the host lane, and an
# undeclared posture would isolate wherever a container runtime happens to exist.
container:
  enabled: false

gateway:
  auth_mode: token

guards:
  enabled: true

channels:
  whatsapp:
    enabled: true
    gowa_executable: whatsapp
    gowa_host: 127.0.0.1
    gowa_port: 3001
    dm_access: pairing
    group_access: disabled
    require_mention: true
    mention_patterns:
      - '@DartClaw'
      - '@bot'
    max_chunk_size: 4000

  signal:
    enabled: true
    executable: signal-cli
    host: 127.0.0.1
    port: 8080
    phone_number: "+46725619417"
    dm_access: open
    group_access: disabled

  google_chat:
    enabled: true
    service_account: credentials/googlechat/service-account.json
    audience:
      type: app-url
      value: https://mimir.tail315dbf.ts.net/integrations/googlechat
    bot_user: users/104817664214523572409
    typing_indicator: true
    dm_access: pairing
    dm_allowlist:
      - users/111261968043283685958
    group_access: allowlist
    require_mention: true

  # Off until the owner has created the Slack app and stored both credentials
  # (docs/guide/slack.md). Then, in the copy under DARTCLAW_CHANNELS_DATA_DIR
  # and never in this tracked seed, set enabled: true and add the owner's own
  # workspace IDs, for example under group_allowlist:
  #   - id: <Slack channel ID>
  #     agent: eng-bot
  slack:
    enabled: false
    mode: socket
    bot_token_credential: slack-bot
    app_token_credential: slack-app
    dm_access: allowlist
    group_access: allowlist
    require_mention: true
    streaming: true

features:
  thread_binding:
    enabled: true

agent:
  agents:
    eng-bot:
      description: Answers from shared knowledge and runs workflows for the Slack channel
      tools:
        - context_research
        - workflow_run
        - workflow_status
        - workflow_resume
        - workflow_cancel
        - workflow_request_changes

scheduling:
  heartbeat:
    enabled: false
  jobs: []

workspace:
  git_sync:
    enabled: false

logging:
  level: FINE
