# DartClaw — Container Testing Profile, CI mode (`run.sh --ci`).
#
# Declares `enabled: true` because isolation is opt-in: an absent section runs
# on the host. Under `true` every container-wiring refusal exits the server
# non-zero, so a boot that reaches a serving state has isolation on.
#
# No credential is configured and no turn is issued, so this mode runs on a fork
# PR with no repository secret.

port: 3342

database:
  url: ${DARTCLAW_POSTGRES_URL}

container:
  enabled: true

gateway:
  auth_mode: none

guards:
  enabled: true

scheduling:
  heartbeat:
    enabled: false
