# DartClaw — Container Testing Profile (real container isolation, end to end)
# Usage: bash dev/testing/profiles/container/run.sh
#
# Declares `enabled: true` because isolation is opt-in; the runner reports a host
# without a runtime as a skip before the server starts.

port: 3341

database:
  url: ${DARTCLAW_POSTGRES_URL}

container:
  enabled: true

gateway:
  auth_mode: none

guards:
  enabled: true

scheduling:
  heartbeat:
    enabled: false
