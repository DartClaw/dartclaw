# DartClaw — Visual Validation Testing Config
# Usage: bash dev/testing/profiles/visual/run.sh

port: 3338

# Declared, not inferred: these profiles exercise the host lane, and an
# undeclared posture would isolate wherever a container runtime happens to exist.
container:
  enabled: false

gateway:
  auth_mode: token

guards:
  enabled: true

# Channels are enabled in unpaired/disconnected state so the channel UI
# surfaces (sidebar entry, /settings cards, /settings/channels/<type> detail
# pages, /whatsapp/pairing, /signal/pairing) render their unconfigured/
# disconnected look. Their executables point at unresolvable paths, so each
# connect attempt fails and no sidecar process is spawned when the server
# starts. Their ports are deliberately ones no other profile uses: the sidecar
# managers attach to an already-reachable service before they spawn, so sharing
# the `channels` profile's ports would let this profile connect for real.
# Do NOT use this profile for actual channel E2E – that is what the `channels`
# profile is for.
channels:
  whatsapp:
    enabled: true
    gowa_executable: /nonexistent/dartclaw-visual/gowa   # unresolvable on purpose: the channel stays disconnected
    gowa_host: 127.0.0.1
    gowa_port: 39001                                    # deliberately unused: nothing must be reachable here
    dm_access: pairing
    group_access: disabled
    require_mention: true
    mention_patterns:
      - '@DartClaw'
      - '@bot'
    max_chunk_size: 4000

  signal:
    enabled: true
    executable: /nonexistent/dartclaw-visual/signal-cli  # unresolvable on purpose: the channel stays disconnected
    host: 127.0.0.1
    port: 39080                                         # deliberately unused: nothing must be reachable here
    phone_number: "+15551234567"        # placeholder; not used until pairing
    dm_access: pairing
    group_access: disabled

  google_chat:
    enabled: true
    # service_account intentionally omitted - channel construction fails to
    # resolve credentials and the channel object stays null, but the settings
    # card still renders Google Chat as configured-but-not-connected because
    # the settings page reads enabled-ness from config, not from channel.
    audience:
      type: app-url
      value: https://visual.example.invalid/integrations/googlechat
    dm_access: pairing
    group_access: disabled
    require_mention: true

scheduling:
  heartbeat:
    enabled: false
  jobs:
    - name: daily-summary
      schedule: 0 9 * * *
      prompt: Summarize yesterday's key events and tasks.
      delivery: announce
    - name: test-job
      schedule: 0 9 * * *
      type: prompt
      delivery: announce
      prompt: Daily test prompt
    - id: visual-review-seed
      schedule: "0 9 * * 1-5"
      type: task
      enabled: true
      task:
        title: Visual review seed task
        description: Keep the task system visible for visual validation.
        acceptance_criteria: The task detail page renders a stable seeded review flow.
        auto_start: false

projects:
  visual-demo:
    remote: git@github.com:DartClaw/workflow-test-todo-app.git
    branch: main

workspace:
  git_sync:
    enabled: false

logging:
  level: FINE
governance: {budget: {daily_tokens: 500000}, loop_detection: {enabled: true}}
features: {thread_binding: {enabled: true}}
