minimumLimaVersion: 2.0.0
base:
  - template:_images/ubuntu-lts
vmType: vz
arch: aarch64
cpus: 4
memory: 8GiB
disk: 60GiB
plain: true
mounts: []
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install --yes --no-install-recommends ca-certificates curl git ripgrep python3 unzip build-essential docker.io nodejs
      systemctl enable --now docker
      usermod -aG docker "{{.User}}"
      # Keep this SDK and checksum aligned with the Check job's sdk pin.
      curl --fail --location --output /tmp/dartsdk.zip https://storage.googleapis.com/dart-archive/channels/stable/release/3.14.0/sdk/dartsdk-linux-arm64-release.zip
      echo '2bb9a19418ced8d9f5cc9e7faa2dcbbc7dc93882b287b8cd8db859efa191c888  /tmp/dartsdk.zip' | sha256sum --check
      unzip -q -o /tmp/dartsdk.zip -d /opt
      ln -sf /opt/dart-sdk/bin/dart /usr/local/bin/dart
      rm /tmp/dartsdk.zip
