    svg:has(#turn:hover) .edges :is(.f-turn,.t-turn) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#create:hover) .edges :is(.f-create,.t-create) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
    svg:has(#review:hover) .edges :is(.f-review,.t-review) { opacity: 1; --ec: var(--hi); --ew: 2.6px; --em: url(#ah-hi); }
