  <text class="panel-kick" x="36" y="652">DETAILS</text>
  <g class="d0"><text class="p1" x="36" y="676">Hover a box for what happens there; its connections light up. Click it to open the recipe section.</text><text class="p2" x="36" y="696">Inside a rendered document this image is static. Click it to open the interactive SVG.</text></g>

  <text class="kick" x="24" y="32">FLOW · FROM A REQUEST TO A TASK OR A WORKFLOW RUN</text>
  <text class="title" x="24" y="58">Crowd coding: from a request to a task or workflow run</text>
  <text class="lede" x="24" y="80">The agent chooses the tool. Review and approval decisions made from chat need a sender in governance.admin_senders.</text>

  <g class="k-host"><rect class="band" x="238" y="94" width="746" height="146" rx="14"/><text class="kick" x="254" y="116">A TASK · task_create</text></g>
  <g class="k-host"><rect class="band" x="238" y="424" width="746" height="146" rx="14"/><text class="kick" x="254" y="446">A WORKFLOW RUN</text></g>
  <text class="el" x="228" y="258" text-anchor="end">task request</text>
  <text class="el" x="228" y="424" text-anchor="end">workflow request</text>

  <g class="edges">
    <g class="e  f-turn t-create"><path d="M216,310 H232 V174 H250"/></g>
    <g class="e  f-turn t-run"><path d="M216,352 H232 V504 H250"/></g>
    <g class="e main f-create t-review"><path d="M452,174 H512"/><text class="el" x="483" y="166" text-anchor="middle">work done</text></g>
    <g class="e main f-review t-done"><path d="M714,174 H774"/><text class="el" x="745" y="166" text-anchor="middle">decision</text></g>
    <g class="e main f-run t-approval"><path d="M452,504 H512"/><text class="el" x="483" y="496" text-anchor="middle">at a gate</text></g>
    <g class="e main f-approval t-outcome"><path d="M714,504 H774"/><text class="el" x="745" y="496" text-anchor="middle">a click</text></g>
    <g class="e dash f-create t-notify"><path d="M352,226 V284"/><text class="el" x="360" y="262" text-anchor="start">queued, running</text></g>
    <g class="e dash f-review t-notify"><path d="M614,226 V284"/><text class="el" x="622" y="262" text-anchor="start">ready for review</text></g>
    <g class="e dash f-done t-notify"><path d="M876,226 V284"/><text class="el" x="884" y="262" text-anchor="start">accepted, rejected</text></g>
    <g class="e dash f-run t-notify"><path d="M376,452 V378"/><text class="el" x="384" y="420" text-anchor="start">started</text></g>
    <g class="e dash f-approval t-notify"><path d="M614,452 V378"/><text class="el" x="622" y="420" text-anchor="start">awaiting approval</text></g>
    <g class="e dash f-outcome t-notify"><path d="M876,452 V378"/><text class="el" x="868" y="420" text-anchor="end">finished, cancelled, failed</text></g>
  </g>

  <a href="../08-crowd-coding.md#running-the-session"><g class="n solid k-host" id="turn">
    <rect class="box" x="24" y="290" width="190" height="82" rx="9"/>
    <text class="name" x="36" y="313">group session turn</text>
    <text class="sub" x="36" y="331">participants ask in plain</text>
    <text class="sub" x="36" y="347">language; the agent picks</text>
    <text class="sub" x="36" y="363">the tool</text>
    <g class="d"><text class="p1" x="36" y="676"><tspan class="b">group session turn</tspan> · the shared group session turn: it decides from the conversation which registered tool to call</text><text class="p2" x="36" y="696">SOUL.md tells it never to claim a task, review or run succeeded until the tool result confirms it.</text></g>
  </g></a>
  <a href="../08-crowd-coding.md#running-the-session"><g class="n tint k-host" id="create">
    <rect class="box" x="252" y="122" width="200" height="104" rx="9"/>
    <g class="step"><circle cx="272" cy="144" r="10"/><text x="272" y="148">1</text></g>
    <text class="name mono-name" x="290" y="145">task_create</text>
    <text class="sub" x="290" y="163">origin: this conversation</text>
    <text class="sub" x="290" y="179">queued, then runs when</text>
    <text class="sub" x="290" y="195">provider capacity frees</text>
    <text class="sub" x="290" y="211">worktree only if asked</text>
    <g class="d"><text class="p1" x="36" y="676"><tspan class="b">task_create</tspan> · records the creating message as the task origin (channel, conversation, sender), so status posts return to that conversation</text><text class="p2" x="36" y="696">The task waits for provider capacity (pool_size, shared with workflows); a worktree is used only when the request asks for one.</text></g>
  </g></a>
  <a href="../08-crowd-coding.md#running-the-session"><g class="n tint k-ext" id="review">
    <rect class="box" x="514" y="122" width="200" height="104" rx="9"/>
    <g class="step"><circle cx="534" cy="144" r="10"/><text x="534" y="148">2</text></g>
    <text class="name mono-name" x="552" y="145">task_review</text>
    <text class="sub" x="552" y="163">accept, reject, push_back</text>
    <text class="sub" x="552" y="179">completion_action: accept</text>
    <text class="sub" x="552" y="195">skips this pause</text>
    <g class="chip k-sec"><rect x="552" y="202" width="119" height="16" rx="8"/><text x="559" y="214">admin sender only</text></g>
    <g class="d"><text class="p1" x="36" y="676"><tspan class="b">task_review</tspan> · task_list and review_list return full task IDs; task_review takes accept, reject or push_back for a full ID</text><text class="p2" x="36" y="696">From a chat message the caller must be an admin sender and every attempt is audited. completion_action: accept lands the task with no pause.</text></g>
  </g></a>
  <a href="../08-crowd-coding.md#scenario-b-external-repository"><g class="n tint k-store" id="done">
    <rect class="box" x="776" y="122" width="200" height="104" rx="9"/>
    <g class="step"><circle cx="796" cy="144" r="10"/><text x="796" y="148">3</text></g>
    <text class="name" x="814" y="145">accepted / rejected</text>
    <text class="sub" x="814" y="163">accept: work merged, or</text>
    <text class="sub" x="814" y="179">branch pushed; draft PR</text>
    <text class="sub" x="814" y="195">with github-pr strategy</text>
    <text class="sub" x="814" y="211">reject: changes discarded</text>
    <g class="d"><text class="p1" x="36" y="676"><tspan class="b">accepted / rejected</tspan> · accept finalizes the task: the worktree is merged, or the branch is pushed and a PR opened (pr.strategy: github-pr)</text><text class="p2" x="36" y="696">Reject closes the task without merging. A shared session alone gives no rollback; use a worktree-backed task for isolation.</text></g>
  </g></a>
  <a href="../08-crowd-coding.md#thread-binding"><g class="n tint k-chan" id="notify">
    <rect class="box" x="252" y="286" width="724" height="90" rx="9"/>
    <text class="name" x="264" y="309">notifications in the Space thread</text>
    <text class="sub" x="264" y="327">task and run posts return to the conversation that asked</text>
    <text class="sub" x="264" y="343">thread binding on: replies in a task's thread go to that task's session</text>
    <g class="chip k-sec"><rect x="264" y="352" width="219" height="16" rx="8"/><text x="271" y="364">/bind, /unbind: admin sender only</text></g>
    <g class="d"><text class="p1" x="36" y="676"><tspan class="b">notifications in the Space thread</tspan> · posts go back to the asking conversation; with thread_binding enabled the first task post opens a thread</text><text class="p2" x="36" y="696">A binding ends when the task is terminal or idles 60 min. A run posts in the request's thread or a run thread; /unbind cannot remove a run binding.</text></g>
  </g></a>
  <a href="../08-crowd-coding.md#running-the-session"><g class="n tint k-host" id="run">
    <rect class="box" x="252" y="452" width="200" height="104" rx="9"/>
    <g class="step"><circle cx="272" cy="474" r="10"/><text x="272" y="478">1</text></g>
    <text class="name mono-name" x="290" y="475">workflow_run</text>
    <text class="sub" x="290" y="493">workflow_list names the</text>
    <text class="sub" x="290" y="509">definitions; workflow_run</text>
    <text class="sub" x="290" y="525">starts one with variables</text>
    <text class="sub" x="290" y="541">run posts to the thread</text>
    <g class="d"><text class="p1" x="36" y="676"><tspan class="b">workflow_run</tspan> · workflow_list shows the loaded definitions; workflow_run starts one with its variables</text><text class="p2" x="36" y="696">The web launch forms at /workflows and the standalone CLI stay available for deterministic starts.</text></g>
  </g></a>
  <a href="../08-crowd-coding.md#running-the-session"><g class="n tint k-ext" id="approval">
    <rect class="box" x="514" y="452" width="200" height="104" rx="9"/>
    <g class="step"><circle cx="534" cy="474" r="10"/><text x="534" y="478">2</text></g>
    <text class="name" x="552" y="475">approval step</text>
    <text class="sub" x="552" y="493">post has Approve and</text>
    <text class="sub" x="552" y="509">Reject buttons; Request</text>
    <text class="sub" x="552" y="525">changes on a revise gate</text>
    <g class="chip k-sec"><rect x="552" y="532" width="119" height="16" rx="8"/><text x="559" y="544">admin sender only</text></g>
    <g class="d"><text class="p1" x="36" y="676"><tspan class="b">approval step</tspan> · at an approval step the run's post carries Approve and Reject, plus Request changes when the gate names a revise step</text><text class="p2" x="36" y="696">Anyone else is refused and the buttons stay; an empty admin_senders list lets every member of the room approve.</text></g>
  </g></a>
  <a href="../08-crowd-coding.md#running-the-session"><g class="n tint k-store" id="outcome">
    <rect class="box" x="776" y="452" width="200" height="104" rx="9"/>
    <g class="step"><circle cx="796" cy="474" r="10"/><text x="796" y="478">3</text></g>
    <text class="name" x="814" y="475">run outcome</text>
    <text class="sub" x="814" y="493">Approve: the run resumes</text>
    <text class="sub" x="814" y="509">Reject: the run is</text>
    <text class="sub" x="814" y="525">cancelled; the post says</text>
    <text class="sub" x="814" y="541">who resolved it, when</text>
    <g class="d"><text class="p1" x="36" y="676"><tspan class="b">run outcome</tspan> · Approve resumes the run; Reject cancels it without feedback, and the post is edited to say who resolved it and when</text><text class="p2" x="36" y="696">The run page, the API and the workflow_resume and workflow_cancel tools resolve the same gate; those tools are granted through allowedTools.</text></g>
  </g></a>
  <g transform="translate(24,602)">
    <g class="solid k-host"><rect class="box" x="0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="22" y="10">the agent turn</text>
    <g class="tint k-ext"><rect class="box" x="130.8" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="152.8" y="10">waits on a human</text>
    <g class="tint k-store"><rect class="box" x="274.0" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="296.0" y="10">outcome</text>
    <g class="tint k-chan"><rect class="box" x="361.4" y="0" width="16" height="11" rx="3"/></g><text class="lg" x="383.4" y="10">the Space thread</text>
    <g class="e main"><path d="M504.59999999999997,6 H536.5999999999999"/></g><text class="lg" x="544.5999999999999" y="10">progress</text>
    <g class="e "><path d="M616.1999999999999,6 H648.1999999999999"/></g><text class="lg" x="656.1999999999999" y="10">tool call</text>
    <g class="e dash"><path d="M734.0,6 H766.0"/></g><text class="lg" x="774.0" y="10">status post</text>
  </g>
</svg>
