# DartClaw — Local Development Config
# Usage: dartclaw --config examples/dev.yaml serve

# name: MyAgent  # Custom instance name (shown in banner, browser tab, sidebar)
data_dir: ../.dartclaw-example
dev_mode: true

# PostgreSQL 14+; set DARTCLAW_DATABASE_URL first (examples/README.md).
database:
  url: ${DARTCLAW_DATABASE_URL}

port: 3333

# No auth needed for local dev
gateway:
  auth_mode: none

# Disable guards during development
guards:
  enabled: false

# Declared, so a development checkout does not build and boot a container image
# just because a runtime happens to be installed.
container:
  enabled: false

scheduling:
  heartbeat:
    enabled: false
  jobs: []

workspace:
  git_sync:
    enabled: false

logging:
  level: FINE
