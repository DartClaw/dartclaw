name: custom_guard
description: Minimal DartClaw SDK example for a custom guard.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  dartclaw_core: ^0.24.2
  dartclaw_kernel: ^0.24.2

dependency_overrides:
  dartclaw_core:
    path: ../../../packages/dartclaw_core
  dartclaw_kernel:
    path: ../../../packages/dartclaw_kernel
