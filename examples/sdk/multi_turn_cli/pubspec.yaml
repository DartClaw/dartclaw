name: multi_turn_cli
description: DartClaw SDK example for a session-backed multi-turn CLI.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  dartclaw_core: ^0.24.2
  dartclaw_kernel: ^0.24.2
  path: ^1.9.0

dependency_overrides:
  dartclaw_core:
    path: ../../../packages/dartclaw_core
  dartclaw_kernel:
    path: ../../../packages/dartclaw_kernel
