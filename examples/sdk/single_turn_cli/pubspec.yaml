name: single_turn_cli
description: Minimal DartClaw SDK example for a single-turn CLI agent.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  dartclaw_core: ^0.24.2
  dartclaw_kernel: ^0.24.2

# The runtime packages are not published; these overrides against this checkout
# are how a fork-the-runtime consumer depends on them. See ADR-008.
dependency_overrides:
  dartclaw_core:
    path: ../../../packages/dartclaw_core
  dartclaw_kernel:
    path: ../../../packages/dartclaw_kernel
