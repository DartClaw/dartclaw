name: dartclaw
description: >-
  Client tier for the DartClaw agent runtime: HTTP API client, SSE event
  streams, and the shared DTO types a running DartClaw server speaks.
version: 0.25.0
publish_to: none
repository: https://github.com/DartClaw/dartclaw
homepage: https://github.com/DartClaw/dartclaw
issue_tracker: https://github.com/DartClaw/dartclaw/issues
topics:
  - ai
  - agents
  - client
  - sse

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dartclaw_client:
    path: ../dartclaw_client
  dartclaw_kernel:
    path: ../dartclaw_kernel

dev_dependencies:
  dartclaw_runtime:
    path: ../dartclaw_runtime
  path: ^1.9.1
  test: ^1.31.0
  lints: ^6.1.0
