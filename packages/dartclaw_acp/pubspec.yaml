name: dartclaw_acp
description: Agent Client Protocol harness for DartClaw — stdio JSON-RPC third-party agents, their config section and their registrar.
publish_to: none
version: 0.25.1
repository: https://github.com/DartClaw/dartclaw/tree/main/packages/dartclaw_acp
homepage: https://github.com/DartClaw/dartclaw
issue_tracker: https://github.com/DartClaw/dartclaw/issues
topics:
  - ai
  - agents
  - acp

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dartclaw_kernel:
    path: ../dartclaw_kernel
  dartclaw_core:
    path: ../dartclaw_core
  json_rpc_2: ^4.1.0
  stream_channel: ^2.1.4
  collection: ^1.19.1
  logging: ^1.3.0
  meta: ^1.18.0
  path: ^1.9.1

dev_dependencies:
  dartclaw_testing:
    path: ../dartclaw_testing
  fake_async: ^1.3.3
  test: ^1.31.0
  lints: ^6.1.0
