name: dartclaw_google_chat
description: Google Chat channel adapter for DartClaw, including inbound messages and outbound API responses.
publish_to: none
version: 0.25.0
repository: https://github.com/DartClaw/dartclaw/tree/main/packages/dartclaw_google_chat
homepage: https://github.com/DartClaw/dartclaw
issue_tracker: https://github.com/DartClaw/dartclaw/issues
topics:
  - ai
  - chat
  - messaging
  - agents

false_secrets:
  - /test/gcp_auth_service_test.dart
  - /test/google_chat_jwt_verifier_test.dart

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dart_jsonwebtoken: ^3.4.1
  dartclaw_kernel:
    path: ../dartclaw_kernel
  dartclaw_core:
    path: ../dartclaw_core
  googleapis_auth: ^2.3.0
  http: ^1.6.0
  logging: ^1.3.0
  path: ^1.9.1
  pointycastle: ^4.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  dartclaw_testing:
    path: ../dartclaw_testing
  fake_async: ^1.3.3
  test: ^1.31.0
  lints: ^6.1.0
