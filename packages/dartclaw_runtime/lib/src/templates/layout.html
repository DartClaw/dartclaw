<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/mascot-favicon-32.png"
        tl:attr="href=${assetPrefix} + '/mascot-favicon-32.png'">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/mascot-favicon-16.png"
        tl:attr="href=${assetPrefix} + '/mascot-favicon-16.png'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title tl:fragment="documentTitle" tl:text="${title} + ' - ' + ${appName}">DartClaw</title>
  <script>(function(){var t=localStorage.getItem('dartclaw-theme');if(t==='light')document.documentElement.dataset.theme='light';})()</script>
  <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous"
        href="/static/fonts/jetbrains-mono-latin.woff2"
        tl:attr="href=${assetPrefix} + '/fonts/jetbrains-mono-latin.woff2'">
  <link rel="stylesheet" href="/static/tokens.css" tl:attr="href=${assetPrefix} + '/tokens.css'">
  <link rel="stylesheet" href="/static/app-tokens.css" tl:attr="href=${assetPrefix} + '/app-tokens.css'">
  <link rel="stylesheet" href="/static/design-system.css" tl:attr="href=${assetPrefix} + '/design-system.css'">
  <link rel="stylesheet" href="/static/app.css" tl:attr="href=${assetPrefix} + '/app.css'">
  <link rel="stylesheet" href="/static/icons.css" tl:attr="href=${assetPrefix} + '/icons.css'">
  <link rel="stylesheet" href="/static/hljs-catppuccin-mocha.css" id="hljs-theme"
        tl:attr="href=${assetPrefix} + '/hljs-catppuccin-mocha.css'">
  <script defer="defer" src="/static/htmx.min.js" tl:attr="src=${assetPrefix} + '/htmx.min.js'"></script>
  <script defer="defer" src="/static/sse.js" tl:attr="src=${assetPrefix} + '/sse.js'"></script>
  <script defer="defer" src="/static/marked.min.js" tl:attr="src=${assetPrefix} + '/marked.min.js'"></script>
  <script defer="defer" src="/static/hljs.min.js" tl:attr="src=${assetPrefix} + '/hljs.min.js'"></script>
  <script defer="defer" src="/static/hljs-dart.min.js" tl:attr="src=${assetPrefix} + '/hljs-dart.min.js'"></script>
  <script defer="defer" src="/static/purify.min.js" tl:attr="src=${assetPrefix} + '/purify.min.js'"></script>
  <script defer="defer" src="/static/stimulus.min.js" tl:attr="src=${assetPrefix} + '/stimulus.min.js'"></script>
  <script type="module" src="/static/controllers/index.js"
          tl:attr="src=${assetPrefix} + '/controllers/index.js'"></script>
</head>
<body tl:attr="data-app-name=${appName}" data-controller="dc-shell dc-toast dc-conversation-command"
      hx-indicator:inherited="#nav-progress"
      hx-status:4xx:inherited="swap:none" hx-status:5xx:inherited="swap:none">
<a tl:if="${showSkipLink}" class="skip-link" href="#main-content">Skip to content</a>
<div id="nav-progress" class="scan-bar htmx-indicator" aria-hidden="true"></div>
<tl:block tl:utext="${body}"></tl:block>
<dialog id="global-command-dialog" class="dialog command-dialog card-glass" data-command-dialog="global"
        data-search-lifecycle="all" aria-label="Search and commands">
  <div class="palette-input-row">
    <span class="icon icon-search" aria-hidden="true"></span>
    <label class="sr-only" for="global-command-query">Search conversations and commands</label>
    <input id="global-command-query" class="form-input" type="search"
           autocomplete="off" placeholder="Search conversations or run a command" data-command-query="global">
    <button type="button" class="btn btn-icon-sm" data-command-close data-icon="x" aria-label="Close"></button>
  </div>
  <div class="palette-filters" data-command-search-filters>
    <button type="button" class="chip" aria-pressed="true" data-search-lifecycle-option="all">All</button>
    <button type="button" class="chip" aria-pressed="false" data-search-lifecycle-option="active">Active</button>
    <button type="button" class="chip" aria-pressed="false" data-search-lifecycle-option="settled">Settled</button>
    <button type="button" class="chip" aria-pressed="false" data-search-lifecycle-option="archived">Archived</button>
    <label class="sr-only" for="global-command-project" data-project-controls hidden>Project</label>
    <select id="global-command-project" class="palette-project"
            data-search-project data-project-controls hidden>
      <option value=":all">All chats</option>
      <option value="">General chats</option>
    </select>
  </div>
  <div class="command-results" data-command-results role="listbox" aria-label="Search and command results"></div>
  <div class="palette-foot">
    <span><kbd>&#8593;</kbd><kbd>&#8595;</kbd> navigate</span>
    <span><kbd>&#9166;</kbd> open</span>
    <span data-command-status role="status" aria-live="polite">Type to search.</span>
  </div>
</dialog>
<tl:block tl:utext="${scriptsHtml}"></tl:block>
</body>
</html>
