<div tl:fragment="restartBanner" class="banner banner-restart" id="restart-banner"
  tl:attr="hidden=${dormant},inert=${dormant},hx-swap-oob=${swapOob}">
  <span>
    Pending changes require restart:
    <strong id="restart-banner-fields" tl:text="${fieldList}">field names</strong>
  </span>
  <span class="banner-actions">
    <button class="btn btn-sm btn-primary" data-action="click->dc-shell#confirmRestart">Restart Now</button>
    <button class="btn btn-sm btn-ghost" data-action="click->dc-shell#dismissRestartBanner">Dismiss</button>
  </span>
</div>
