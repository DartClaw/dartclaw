name: dartclaw_runtime
description: Reference HTTP API server and HTMX web UI for DartClaw deployments and task workflows.
publish_to: none
version: 0.25.0
repository: https://github.com/DartClaw/dartclaw/tree/main/packages/dartclaw_runtime
homepage: https://github.com/DartClaw/dartclaw
issue_tracker: https://github.com/DartClaw/dartclaw/issues
topics:
  - ai
  - cli
  - agents
  - server

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  anthropic_sdk_dart: ^2.2.0
  crypto: ^3.0.7
  dartclaw_bridge:
    path: ../dartclaw_bridge
  dartclaw_kernel:
    path: ../dartclaw_kernel
  dartclaw_core:
    path: ../dartclaw_core
  dartclaw_workflow:
    path: ../dartclaw_workflow
  dartclaw_google_chat:
    path: ../dartclaw_google_chat
  dartclaw_whatsapp:
    path: ../dartclaw_whatsapp
  dartclaw_signal:
    path: ../dartclaw_signal
  html2md: ^1.3.2
  http: ^1.6.0
  meta: ^1.18.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  sqlite3: ^3.1.6
  timezone: ^0.11.0
  logging: ^1.3.0
  path: ^1.9.1
  qr: ^3.0.2
  trellis: ^0.8.0
  uuid: ^4.5.3
  yaml: ^3.1.3

dev_dependencies:
  dartclaw_acp:
    path: ../dartclaw_acp
  async: ^2.13.0
  dartclaw_testing:
    path: ../dartclaw_testing
  fake_async: ^1.3.3
  test: ^1.31.0
  lints: ^6.1.0
