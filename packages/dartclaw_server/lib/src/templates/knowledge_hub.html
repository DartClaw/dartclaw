<div tl:fragment="knowledgeHub" class="shell">
  <div tl:utext="${sidebar}"><!-- sidebar --></div>
  <div class="shell-main">
  <tl:block tl:utext="${topbar}"></tl:block>
  <main id="main-content" tabindex="-1" hx-history-elt class="page-content print-in">
    <div class="page-inner knowledge-hub-page">
      <header class="pagehead">
        <div>
          <p class="page-subtitle">Browse wiki, temporal KG, memory, and inbox sources.</p>
        </div>
        <span class="status-badge status-badge-muted" tl:text="${readOnlyMarker}">READ-ONLY</span>
      </header>

      <nav class="tabs" aria-label="Knowledge views">
        <a class="tab t-label active" href="/knowledge" aria-current="page">Hub</a>
        <a class="tab t-label" href="/knowledge/timeline">Timeline</a>
      </nav>

      <section aria-label="Knowledge search">
        <form class="list-toolbar" action="/knowledge" method="get">
          <label class="sr-only" for="knowledge-search">Search knowledge</label>
          <span class="icon icon-search" aria-hidden="true"></span>
          <input id="knowledge-search" name="q" type="search" maxlength="160" class="form-input form-input--search"
                 placeholder="Search knowledge..." tl:attr="value=${query}">
          <input type="hidden" name="layer" tl:attr="value=${activeLayer}">
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <div class="chip-row" role="list">
          <a tl:each="chip : ${layerChips}" class="chip" role="listitem"
             tl:attr="href=${chip.href},aria-current=${chip.current}"
             tl:text="${chip.label}">All</a>
        </div>
      </section>

      <section aria-labelledby="knowledge-summary-heading">
        <h2 id="knowledge-summary-heading" class="section-label">Layers in these results</h2>
        <div class="knowledge-summary-strip">
          <div tl:each="summary : ${layerSummaries}" class="card card-metric" tl:classappend="${summary.cardClass}">
            <span tl:if="${summary.failed}" class="metric-value">
              <span class="icon icon-triangle-alert" aria-hidden="true"></span>
              <span class="sr-only">Failed to load</span>
            </span>
            <span tl:unless="${summary.failed}" class="metric-value" tl:text="${summary.count}">0</span>
            <span class="metric-label" tl:text="${summary.label}">Wiki</span>
          </div>
        </div>
      </section>

      <div tl:if="${hasFailedLayers}" class="banner banner-warning">
        Partial results: <span tl:text="${failedLayerNames}">KG</span> failed to load.
      </div>

      <section class="knowledge-results" aria-label="Knowledge results">
        <article tl:each="item : ${items}" class="card knowledge-result-body">
          <div class="knowledge-result-head">
            <span class="layer-badge" tl:classappend="${item.layerClass}" tl:text="${item.layerLabel}">WIKI</span>
            <h2 tl:if="${item.sourceResolved}" class="knowledge-result-title">
              <a tl:attr="href=${item.sourceHref}" tl:text="${item.title}">Source title</a>
            </h2>
          </div>
          <p class="knowledge-result-snippet" tl:text="${item.snippet}">Snippet</p>
          <div class="knowledge-result-meta">
            <a tl:if="${item.sourceResolved}" class="source-link" tl:attr="href=${item.sourceHref}" tl:text="${item.sourceLabel}">Source</a>
            <tl:block tl:utext="${item.attributionHtml}"><!-- attribution --></tl:block>
          </div>
        </article>
        <tl:block tl:unless="${hasItems}" tl:utext="${emptyStateHtml}"><!-- empty state --></tl:block>
      </section>

      <nav tl:if="${hasPagination}" class="pager" aria-label="Knowledge pagination">
        <a tl:if="${hasPreviousPage}" class="btn btn-ghost" tl:attr="href=${previousHref}">Previous</a>
        <span class="pager-label t-caption" tl:text="${pageLabel}">Page 1 of 1</span>
        <a tl:if="${hasNextPage}" class="btn btn-ghost" tl:attr="href=${nextHref}">Next</a>
      </nav>
    </div>
  </main>
  </div>
</div>
