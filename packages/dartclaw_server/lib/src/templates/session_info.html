<div tl:fragment="sessionInfo" class="shell">
  <div tl:utext="${sidebar}">sidebar</div>
  <div class="shell-main">
  <tl:block tl:utext="${topbar}"></tl:block>
  <main id="main-content" tabindex="-1" hx-history-elt class="content-area print-in" data-controller="dc-tasks">
    <div class="content-inner">

      <tl:block tl:utext="${pageHeaderHtml}">page header</tl:block>

      <div>
        <h2 class="section-title">Token Usage</h2>
        <div class="well">
          <div class="token-grid" tl:utext="${tokenMetricCardsHtml}">token metrics</div>
        </div>
        <div class="meta-row">
          <span class="meta-label">Cost</span>
          <span tl:if="${hasEstimatedCost}" class="meta-value" tl:text="${estimatedCostDisplay}">$0.00</span>
          <span tl:unless="${hasEstimatedCost}" class="meta-value"
            title="This provider does not report USD cost. Token counts are tracked for governance budgets.">cost unavailable</span>
        </div>
        <div tl:if="${hasCachedTokens}" class="meta-row">
          <span class="meta-label">Cached Input</span>
          <span class="meta-value" tl:text="${cachedTokensDisplay}">0</span>
        </div>
        <div tl:if="${hasEffectiveTokens}" class="meta-row">
          <span class="meta-label" tl:attr="title=${effectiveTokensTooltip}">Effective Tokens</span>
          <span class="meta-value" tl:text="${effectiveTokensDisplay}">0</span>
        </div>
      </div>

      <div>
        <h2 class="section-title">Session Details</h2>
        <div tl:if="${hasTurnStatus}" class="turn-status-panel"
             tl:attr="data-turn-status-session-id=${turnStatus.sessionId},data-turn-status-turn-id=${turnStatus.turnId}">
          <div class="turn-status-row">
            <span class="meta-label">Turn</span>
            <span class="status-badge" data-turn-status-state tl:text="${turnStatus.stateLabel}">waiting</span>
            <span tl:if="${turnStatus.reasonAbsent}" class="meta-value value-absent" data-turn-status-reason></span>
            <span tl:unless="${turnStatus.reasonAbsent}" class="meta-value" data-turn-status-reason
                  tl:text="${turnStatus.reasonLabel}">session lock</span>
          </div>
          <div class="turn-status-times">
            <span class="turn-status-time"><span class="turn-status-time-label t-caption">waiting since</span><span class="turn-status-time-value" data-turn-status-waiting tl:text="${turnStatus.waitingSince}"></span></span>
            <span class="turn-status-time"><span class="turn-status-time-label t-caption">stuck since</span><span class="turn-status-time-value" data-turn-status-stuck tl:text="${turnStatus.stuckSince}"></span></span>
            <span class="turn-status-time"><span class="turn-status-time-label t-caption">times out</span><span class="turn-status-time-value" data-turn-status-timeout tl:text="${turnStatus.globalTimeoutAt}"></span></span>
          </div>
          <button type="button" class="btn btn-ghost" data-turn-cancel
                  tl:attr="data-session-id=${turnStatus.sessionId},data-turn-id=${turnStatus.turnId},disabled=${turnStatus.cancelDisabled}">
            Cancel Turn
          </button>
        </div>
        <div class="meta-row">
          <span class="meta-label">Messages</span>
          <span class="meta-value" tl:text="${messageCount}">0</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Created</span>
          <span tl:if="${createdAtAbsent}" class="meta-value value-absent"></span>
          <span tl:unless="${createdAtAbsent}" class="meta-value" tl:attr="title=${createdAtIso}"
                tl:text="${createdAt}">2h ago</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Session ID</span>
          <span class="meta-value meta-value-mono" tl:text="${sessionId}">session-id</span>
        </div>
      </div>

      <div tl:if="${hasRecentTurns}">
        <h2 class="section-title">Recent Turns</h2>
        <div class="card card-compact">
          <div class="turns-list">
            <div tl:each="turn : ${recentTurns}" class="turn-row">
              <span class="turn-time" tl:text="${turn.time}">00:00</span>
              <span class="turn-role" tl:classappend="${turn.roleClass}" tl:text="${turn.roleLabel}">Role</span>
              <span class="turn-excerpt" tl:text="${turn.excerpt}">...</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
  </div>
</div>
