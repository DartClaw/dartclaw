<div class="shell">
  <div tl:utext="${sidebar}">sidebar</div>
  <div class="shell-main">
  <tl:block tl:utext="${topbar}"></tl:block>
  <main id="main-content" tabindex="-1" hx-history-elt class="page-content print-in">
    <div class="page-inner page-inner--wide" id="tasks-content" data-controller="dc-tasks">

      <tl:block tl:utext="${pageHeaderHtml}">page header</tl:block>

      <div class="task-filter-bar">
        <select id="task-status-filter" class="form-select" data-task-filter="status" data-enhance="custom-select">
          <option tl:each="opt : ${statusOptions}" tl:text="${opt.label}"
                  tl:attr="value=${opt.value},selected=${opt.selected} ? 'selected' : null">All Statuses</option>
        </select>
        <select id="task-type-filter" class="form-select" data-task-filter="type" data-enhance="custom-select">
          <option tl:each="opt : ${typeOptions}" tl:text="${opt.label}"
                  tl:attr="value=${opt.value},selected=${opt.selected} ? 'selected' : null">All Types</option>
        </select>
      </div>

      <div tl:if="${showWorkflowReviewToggle}" class="task-filter-hint">
        <a class="btn btn-ghost btn-sm"
           tl:attr="href=${workflowReviewToggleHref}"
           tl:text="${includeWorkflowOwned} ? 'Hide workflow artifacts' : 'Show workflow artifacts'">Show workflow artifacts</a>
      </div>

      <div tl:if="${harnessOverviewHtml}" tl:utext="${harnessOverviewHtml}">harness overview</div>

      <div tl:if="${hasTasks}" class="task-status-groups">
        <section tl:each="group : ${statusGroups}" class="task-status-group"
          tl:attr="aria-labelledby='task-status-' + ${group.status}">
          <h2 class="t-heading" tl:attr="id='task-status-' + ${group.status}">
            <span tl:text="${group.statusLabel}">Status</span>
            <span class="task-group-count" tl:text="${group.count}">0</span>
          </h2>

          <div tl:if="${group.isRunning}" class="task-running-cards">
            <div tl:each="task : ${group.tasks}" class="card task-card-running print-in" tl:classappend="${task.cardTintClass}">
              <div class="task-card-title" tl:text="${task.title}">Task title</div>
              <div class="task-card-meta">
                <span tl:if="${task.agentLabel}" class="task-agent-badge"><span class="identicon" aria-hidden="true" tl:attr="data-identicon-id=${task.agentLabel},data-identicon-initials=${task.agentLabel}"></span><span tl:text="${task.agentLabel}">Agent #1</span></span>
                <span tl:if="${task.projectName}" class="project-badge" tl:text="${task.projectName}">Project</span>
                <span class="type-badge" tl:text="${task.typeLabel}">Type</span>
                <span class="provider-badge" tl:classappend="'provider-badge-' + ${task.provider}"
                      tl:text="${task.providerLabel}">Claude</span>
                <span class="task-elapsed" tl:attr="data-started-at=${task.startedAt}">--:--</span>
              </div>
              <div tl:attr="id='task-meter-' + ${task.id}">
                <div tl:if="${task.isIndeterminate}" class="scan-bar"></div>
                <div tl:unless="${task.isIndeterminate}" class="meter">
                  <div class="meter-fill" tl:attr="style='width:' + ${task.progressPct} + '%'"></div>
                </div>
              </div>
              <div class="task-tokens" tl:attr="id='task-tokens-' + ${task.id}">
                <span tl:text="${task.tokenDisplay}">0 tokens</span>
              </div>
              <div tl:if="${task.hasEvents}" class="task-events" tl:attr="id='task-events-' + ${task.id}">
                <div tl:each="event : ${task.recentEvents}" class="task-event">
                  <span class="task-event-icon icon" aria-hidden="true"
                        tl:classappend="${event.maskClass} + ' ' + ${event.iconClass}"></span>
                  <span tl:text="${event.text}">Event text</span>
                </div>
              </div>
            </div>
          </div>

          <div tl:unless="${group.isRunning}" class="table-fade-wrap">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th class="task-col-title">Title</th>
                    <th tl:if="${showProjectColumn}" class="task-col-project">Project</th>
                    <th class="task-col-type">Type</th>
                    <th class="task-col-provider">Provider</th>
                    <th class="task-col-created-by">Created by</th>
                    <th class="task-col-created">Created</th>
                    <th class="task-col-status">Status</th>
                    <th class="task-col-tokens">Tokens</th>
                  </tr>
                </thead>
                <tbody>
                  <tr tl:each="task : ${group.tasks}">
                    <td class="task-col-title">
                      <a tl:if="${task.detailHref}" tl:attr="href=${task.detailHref}" tl:text="${task.title}">Task</a>
                      <span tl:unless="${task.detailHref}" tl:text="${task.title}">Task</span>
                      <div tl:if="${task.goalTitle}" class="task-goal-text">
                        Goal: <span tl:text="${task.goalTitle}">Goal title</span>
                      </div>
                    </td>
                    <td tl:if="${showProjectColumn}" class="task-col-project"
                        tl:classappend="${task.projectAbsent} ? 'value-absent' : ''"
                        tl:text="${task.projectDisplay}">Project</td>
                    <td class="task-col-type"><span class="type-badge" tl:text="${task.typeLabel}">Type</span></td>
                    <td class="task-col-provider"><span class="provider-badge" tl:classappend="'provider-badge-' + ${task.provider}"
                              tl:text="${task.providerLabel}">Claude</span></td>
                    <td class="task-col-created-by" tl:classappend="${task.createdByAbsent} ? 'value-absent' : ''"
                        tl:text="${task.createdByDisplay}">agent</td>
                    <td class="task-col-created" tl:attr="title=${task.createdAtIso}"
                        tl:text="${task.createdAtDisplay}">1h ago</td>
                    <td class="task-col-status"><tl:block tl:utext="${task.statusPillHtml}">pill</tl:block></td>
                    <td class="task-col-tokens task-tokens-static" tl:classappend="${task.finalTokenDisplay} ? '' : 'value-absent'"
                        tl:text="${task.finalTokenDisplay}">1.2K</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>

      <tl:block tl:unless="${hasTasks}" tl:utext="${emptyStateHtml}">empty state</tl:block>

    </div>

    <div tl:if="${newTaskDialogHtml}" tl:utext="${newTaskDialogHtml}">dialog</div>
  </main>
  </div>
</div>
