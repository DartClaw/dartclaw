<header tl:fragment="sessionTopbar" class="topbar" id="topbar">
  <button class="btn btn-icon btn-ghost menu-toggle" aria-label="Open sidebar" aria-controls="sidebar"
    aria-expanded="false" data-icon="menu"></button>
  <span tl:if="${isArchive}" class="session-title" tl:text="${displayTitle}">Untitled draft</span>
  <input tl:unless="${isArchive}" id="session-title" class="session-title" type="text"
    tl:attr="value=${displayTitle},data-session-id=${sessionId},data-original-title=${displayTitle}"
    maxlength="100" aria-label="Session title">
  <div class="topbar-actions">
    <a tl:attr="href=${infoHref},hx-get=${infoHref}" class="btn btn-icon btn-ghost" aria-label="Session info"
      hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML" hx-push-url="true"
      hx-select-oob="#topbar,#restart-banner-slot,#sidebar" data-icon="info"></a>
    <button tl:if="${showResume}" class="btn btn-ghost btn-sm" data-session-resume="true"
      tl:attr="data-session-id=${sessionId}">Resume</button>
    <button tl:if="${showReset}" class="btn btn-danger btn-sm btn-reset"
      tl:attr="hx-post=${resetHref}"
      hx-confirm="Reset this session? Conversation will be archived."
      hx-on::after-request="location.reload()"
      aria-label="Reset session">Reset</button>
    <button class="theme-toggle" aria-label="Toggle theme"></button>
  </div>
</header>

<header tl:fragment="plainTopbar" class="topbar" id="topbar">
  <button class="btn btn-icon btn-ghost menu-toggle" aria-label="Open sidebar" aria-controls="sidebar"
    aria-expanded="false" data-icon="menu"></button>
  <h1 class="session-title t-page-title" tl:text="${appName}">DartClaw</h1>
  <div class="topbar-actions">
    <button class="theme-toggle" aria-label="Toggle theme"></button>
  </div>
</header>

<header tl:fragment="pageTopbar" class="topbar" id="topbar">
  <button class="btn btn-icon btn-ghost menu-toggle" aria-label="Open sidebar" aria-controls="sidebar"
    aria-expanded="false" data-icon="menu"></button>
  <a tl:if="${backHref}" tl:attr="href=${backHref},hx-get=${backHref}" class="topbar-back"
    hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML" hx-push-url="true"
    hx-select-oob="#topbar,#restart-banner-slot,#sidebar"><span class="icon icon-arrow-left" aria-hidden="true"></span> <span tl:text="${backLabel}">Back</span></a>
  <h1 class="session-title-static t-page-title" tl:text="${title}">Page Title</h1>
  <div class="topbar-actions">
    <button class="theme-toggle" aria-label="Toggle theme"></button>
  </div>
</header>
