<div class="shell">
  <div tl:utext="${sidebar}">sidebar</div>
  <div class="shell-main">
  <tl:block tl:utext="${topbar}"></tl:block>
  <main id="main-content" tabindex="-1" hx-history-elt class="content-area print-in">
    <div class="content-inner content-inner--wide workflow-list-page" data-controller="dc-workflows">

      <!-- Filters -->
      <div class="workflow-filters card">
        <div class="workflow-filter-row">
          <div class="workflow-filter-group">
            <label class="form-label t-label">Status</label>
            <div class="tabs">
              <a tl:each="opt : ${statusOptions}"
                 tl:classappend="${opt.active} ? 'active' : ''"
                 class="tab t-label"
                 tl:attr="href=${opt.href},hx-get=${opt.href}"
                 hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML"
                 hx-push-url="true" hx-select-oob="#topbar,#restart-banner-slot,#sidebar"
                 tl:text="${opt.label}">All</a>
            </div>
          </div>
          <div class="workflow-filter-group">
            <label class="form-label t-label" for="workflow-definition-filter">Workflow</label>
            <select class="form-select" id="workflow-definition-filter">
              <option value="">All workflows</option>
              <option tl:each="def : ${definitionOptions}"
                      tl:attr="value=${def.value},selected=${def.selected} ? 'selected' : null"
                      tl:text="${def.label}">workflow</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Runs list -->
      <div id="workflow-runs-list">
        <div class="section-label t-caption tracking-caps">Workflow Runs</div>
        <div tl:if="${hasRuns}">
          <a tl:each="run : ${runs}" tl:attr="href=${run.href},hx-get=${run.href}"
               class="card run-card print-in" tl:classappend="${run.attention} ? 'run-card--attention' : ''"
               hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML"
               hx-push-url="true" hx-select-oob="#topbar,#restart-banner-slot,#sidebar">
              <div class="card-header">
                <span class="status-dot" tl:classappend="${run.dotClass}" aria-hidden="true"></span>
                <span class="t-heading" tl:text="${run.definitionName}">spec-and-implement</span>
                <span class="run-card-step t-caption">
                  <tl:block tl:if="${run.hasStepCount}"><span tl:text="${run.completedSteps}">3</span>/<span tl:text="${run.totalSteps}">6</span> steps</tl:block>
                  <span tl:unless="${run.hasStepCount}" class="value-absent"></span>
                </span>
                <span tl:classappend="${run.statusBadgeClass}" class="status-badge"
                      tl:text="${run.statusLabel}">running</span>
              </div>
              <div tl:if="${run.hasStepCount}" class="card-body">
                <div class="meter">
                  <div class="meter-fill" tl:classappend="${run.meterFillClass}"
                       tl:attr="style='width: ' + ${run.progressPercent} + '%'"></div>
                </div>
              </div>
              <div class="card-footer t-caption">
                <span tl:attr="title=${run.startedAtIso}"
                      tl:text="${run.startedAtDisplay}">2h ago</span>
                <span tl:text="${run.totalTokens} + ' tokens'">12.4K tokens</span>
              </div>
          </a>
        </div>
        <tl:block tl:unless="${hasRuns}" tl:utext="${emptyRunsHtml}"></tl:block>
      </div>

      <!-- Definition browser -->
      <div tl:if="${hasDefinitions}" class="workflow-definitions-section">
        <div class="section-label t-caption tracking-caps">Available Workflows</div>
        <div class="workflow-definitions-grid">
          <div tl:each="def : ${definitions}" class="workflow-definition-card card">
            <div class="workflow-definition-header">
              <span class="workflow-definition-name t-heading" tl:text="${def.name}">spec-and-implement</span>
              <span class="workflow-definition-step-count t-caption"
                    tl:text="${def.stepCount} + ' steps'">6 steps</span>
              <span tl:if="${def.hasLoops}" class="workflow-loop-badge">Loop</span>
            </div>
            <p class="workflow-definition-desc t-caption" tl:text="${def.description}">Description</p>
            <div class="workflow-definition-vars">
              <span tl:each="v : ${def.variableHints}" class="workflow-var-chip"
                    tl:attr="title=${v.description}"
                    tl:text="${v.name}">FEATURE</span>
            </div>
            <details class="workflow-launch-panel">
              <summary class="btn btn-ghost btn-sm">Run</summary>
              <form data-workflow-launch-form=""
                    hx-post="/api/workflows/run-form"
                    tl:attr="hx-target='#' + ${def.errorId}"
                    hx-swap="innerHTML">
                <input type="hidden" name="definition" tl:attr="value=${def.name}">
                <div tl:each="field : ${def.variableInputs}" class="form-field">
                  <label class="form-label t-label" tl:attr="for=${field.id}" tl:text="${field.label}">Variable</label>
                  <input class="form-input" type="text"
                         tl:attr="id=${field.id},name=${field.inputName},placeholder=${field.placeholder},value=${field.defaultValue},required=${field.required} ? 'required' : null">
                </div>
                <div tl:if="${hasProjects}" class="form-field">
                  <label class="form-label t-label" tl:attr="for=${def.projectSelectId}">Project</label>
                  <select class="form-select" tl:attr="id=${def.projectSelectId},name='project'">
                    <option value="">Default project</option>
                    <option tl:each="project : ${projectOptions}"
                            tl:attr="value=${project.value}"
                            tl:text="${project.label}">project</option>
                  </select>
                </div>
                <div class="form-error t-caption" tl:attr="id=${def.errorId}"></div>
                <div class="form-actions">
                  <button type="submit" class="btn btn-primary btn-sm">Launch</button>
                  <button type="button" class="btn btn-ghost btn-sm"
                          onclick="this.closest('details').open = false">Cancel</button>
                </div>
              </form>
            </details>
          </div>
        </div>
      </div>

    </div>
  </main>
  </div>
</div>
