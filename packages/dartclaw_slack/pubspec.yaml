name: dartclaw_slack
description: Slack channel adapter for DartClaw over Socket Mode, with threaded conversations and mrkdwn replies.
publish_to: none
version: 0.28.0
repository: https://github.com/DartClaw/dartclaw/tree/main/packages/dartclaw_slack
homepage: https://github.com/DartClaw/dartclaw
issue_tracker: https://github.com/DartClaw/dartclaw/issues
topics:
  - ai
  - chat
  - messaging
  - agents

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dartclaw_kernel:
    path: ../dartclaw_kernel
  dartclaw_core:
    path: ../dartclaw_core
  crypto: ^3.0.7
  http: ^1.6.0
  logging: ^1.3.0

dev_dependencies:
  dartclaw_testing:
    path: ../dartclaw_testing
  fake_async: ^1.3.3
  test: ^1.31.0
  yaml: ^3.1.3
  lints: ^6.1.0
