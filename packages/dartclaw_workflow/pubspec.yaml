name: dartclaw_workflow
description: Unified DartClaw workflow parsing, validation, registry, and execution utilities.
publish_to: none
version: 0.25.1
repository: https://github.com/DartClaw/dartclaw/tree/main/packages/dartclaw_workflow
homepage: https://github.com/DartClaw/dartclaw
issue_tracker: https://github.com/DartClaw/dartclaw/issues
topics:
  - ai
  - cli
  - agents
  - workflows

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dartclaw_kernel:
    path: ../dartclaw_kernel
  dartclaw_core:
    path: ../dartclaw_core
  sqlite3: ^3.1.6
  logging: ^1.3.0
  path: ^1.9.1
  uuid: ^4.5.3
  yaml: ^3.1.3

dev_dependencies:
  dartclaw_runtime:
    path: ../dartclaw_runtime
  dartclaw_testing:
    path: ../dartclaw_testing
  fake_async: ^1.3.3
  test: ^1.31.0
  lints: ^6.1.0
